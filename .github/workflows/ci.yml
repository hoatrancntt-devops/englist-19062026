name: CI

# Chạy trên mọi pull request và mọi lần đẩy lên nhánh chính.
# Đây là cổng duy nhất trước khi có người thứ hai sửa code: trước đó mọi thứ
# chỉ được kiểm bằng tay qua Docker, psql và trình duyệt.
on:
  push:
    branches: [main, master]
  pull_request:

# Đẩy commit mới lên cùng một PR thì huỷ lượt chạy cũ: kết quả của nó không còn ai đọc.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Mặc định chỉ-đọc cho MỌI job. Cài đặt repo phải để "write" thì job đẩy image mới đẩy được
# lên GHCR, nhưng quyền đó không nên rơi xuống các job chạy test — chúng chỉ cần đọc mã nguồn.
# Job nào cần hơn thì tự khai riêng, xem `permissions` trong job images.
permissions:
  contents: read

jobs:
  backend:
    name: .NET — build, test đơn vị, cổng nội dung
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Khôi phục gói
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Cổng chất lượng nội dung chạy không cần DB nên tách riêng và chạy trước:
      # nội dung hỏng thì biết ngay, không phải chờ hết bộ test tích hợp.
      - name: Cổng chất lượng nội dung
        run: dotnet test tests/ContentValidationTests --no-build --configuration Release --verbosity minimal

      - name: Test đơn vị
        run: dotnet test tests/UnitTests --no-build --configuration Release --verbosity minimal

  integration:
    name: Test tích hợp trên Postgres thật
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Testcontainers tự dựng Postgres qua Docker. Runner của GitHub đã có sẵn Docker
      # nên không cần khai service container ở đây.
      - name: Test tích hợp
        run: dotnet test tests/IntegrationTests --configuration Release --verbosity minimal

  images:
    name: Dockerfile — build cả ba ảnh, đẩy lên GHCR khi vào main
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      # Tag là SHA ngắn của commit, KHÔNG dùng 'latest'.
      # Có tag cụ thể thì mới biết máy chủ đang chạy đúng bản nào và mới quay lui được.
      - id: tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Trên PR chỉ build để bắt Dockerfile hỏng. Chỉ commit đã vào main mới được đẩy đi:
      # PR từ fork không có secret, và cũng không được phép sinh ra thứ đem triển khai.
      - name: Đăng nhập GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build và đẩy ba ảnh
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          TAG: ${{ steps.tag.outputs.tag }}
          PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          build() {
            local name="$1" dockerfile="$2"
            docker build -f "$dockerfile" -t "$REGISTRY/$name:$TAG" .
            if [ "$PUSH" = "true" ]; then
              docker push "$REGISTRY/$name:$TAG"
            fi
          }
          build api    apps/api/Dockerfile
          build worker src/Worker/Dockerfile
          build web    apps/web/Dockerfile

  deploy:
    name: Triển khai lên VPS
    runs-on: ubuntu-latest

    # Chỉ triển khai khi MỌI cổng đã xanh. Thiếu một `needs` ở đây là mở đường cho bản hỏng
    # đi thẳng ra người dùng trong lúc test vẫn đang chạy.
    needs: [backend, integration, images, web]

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # KHÔNG huỷ lượt đang chạy. Huỷ đúng lúc đang đổi container sẽ để lại trạng thái nửa vời:
    # image mới đã kéo về, dịch vụ đã dừng, mà bước kiểm tra sẵn sàng chưa kịp chạy.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    environment:
      name: production
      url: https://english-v2.hoatranlab.io.vn

    steps:
      - name: Chuẩn bị khoá SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Ghim khoá máy chủ. Thiếu dòng này thì phải dùng StrictHostKeyChecking=no,
          # tức là chấp nhận bất kỳ máy nào trả lời địa chỉ đó.
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Triển khai lên từng máy chủ
        env:
          TAG: ${{ needs.images.outputs.tag }}

          # Mỗi dòng một máy. Thêm máy thứ ba chỉ là thêm một dòng ở đây cộng hai secret,
          # không phải chép cả job ra bản thứ hai.
          HOSTS: |
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
            ${{ secrets.VPS2_USER }}@${{ secrets.VPS2_HOST }}
        run: |
          set -uo pipefail
          failed=""

          while read -r target; do
            [ -z "$target" ] && continue
            echo "::group::$target"

            # KHÔNG dừng ở máy đầu tiên hỏng. Một máy chết không phải lý do để máy còn lại
            # nằm lại bản cũ, và gom hết lỗi rồi báo một lần thì đỡ phải chạy lại để xem
            # máy thứ hai có sao không.
            if ssh -o BatchMode=yes "$target" bash -euo pipefail <<REMOTE
              cd ~/englist

              # Máy chủ phải chạy đúng compose và đúng script của commit đang triển khai,
              # không phải bản cũ còn sót lại từ lần trước.
              git fetch --quiet origin main
              git reset --quiet --hard "$TAG"

              # Kiểm tra sẵn sàng phải gọi đúng chỗ proxy đang nghe. Địa chỉ và cổng khác nhau
              # theo từng máy nên đọc thẳng từ .env của máy đó — ghi cứng ở đây thì đổi một
              # chỗ là chỗ kia lệch, và biểu hiện là bản tốt bị quay lui vì tưởng không sẵn sàng.
              BIND=\$(grep -E '^BIND_ADDRESS=' .env | cut -d= -f2)
              PORT=\$(grep -E '^BIND_PORT=' .env | cut -d= -f2)

              COMPOSE_OVERLAY=docker-compose.vps.yml \\
              HEALTH_URL="http://\${BIND:-127.0.0.1}:\${PORT:-8080}/health/ready" \\
                ./deploy/scripts/deploy-azure-vm.sh "$TAG"
          REMOTE
            then
              echo "$target: xong"
            else
              echo "::error::$target trien khai that bai"
              failed="$failed $target"
            fi

            echo "::endgroup::"
          done <<< "$HOSTS"

          if [ -n "$failed" ]; then
            echo "Cac may that bai:$failed" >&2
            exit 1
          fi

  web:
    name: Web — lint, typecheck, build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Cài gói
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` đã chạy `tsc -b` nên bao luôn phần kiểm kiểu.
      - name: Typecheck và build
        run: npm run build
