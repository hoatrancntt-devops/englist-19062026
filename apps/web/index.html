<!doctype html>
<html lang="vi" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Hoc tieng Anh giao tiep cho ky su IT, Cloud va AI" />
    <title>English for IT</title>

    <!-- Không khai báo thì trình duyệt đi tìm /favicon.ico, không có, và hiện ô trắng —
         trong khi public/favicon.svg vẫn nằm đó không ai dùng. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#1d4ed8" />
    <script>
      // Dat class dark truoc khi React chay, de trang khong nhap nhay trang roi moi doi den.
      (function () {
        try {
          var stored = localStorage.getItem('efit-theme');
          var dark = stored === 'dark' || ((!stored || stored === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
