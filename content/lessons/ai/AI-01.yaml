schema_version: 1
code: AI-01
slug: trinh-bay-ai-use-case
title_vi: "Trình bày AI use case cho người không chuyên"
title_en: "Presenting an AI use case to a non-technical stakeholder"

layer: Professional
track: Ai
level: B1
unit_code: U-AI1
order_index: 1
estimated_minutes: 12
is_checkpoint: false

illustration: ai-brain

objective_vi: >
  Trình bày một ứng dụng AI cho người không rành kỹ thuật: nói rõ nó thay thế
  công việc nào, sai thì chuyện gì xảy ra, và ai kiểm lại.

objective_observable: >
  Đạt từ 75 điểm trên cả bốn trục kỹ năng, không trục nào dưới 60.

mastery_weights:
  Listening: 0.25
  Speaking: 0.35
  Reading: 0.20
  Writing: 0.20

prerequisites:
  - lesson: OFF-12
    min_mastery: 70
    kind: Hard
  - lesson: HD-04
    min_mastery: 65
    kind: Soft
  - lesson: OFF-10
    min_mastery: 65
    kind: Soft
  - lesson: CLD-01
    min_mastery: 65
    kind: Soft

vocabulary:
  - term: "use case"
    ipa: "/juːs keɪs/"
    meaning_vi: "trường hợp ứng dụng cụ thể"
    chunk: "The use case is sorting incoming tickets."
    emoji: "🎯"
    mnemonic_vi: "\"case\" là CA, vụ việc cụ thể. Không phải \"chúng tôi dùng AI\" mà là \"AI làm đúng việc gì\". Không nêu được ca cụ thể thì chưa có dự án."
    tags: [ai, core]
  - term: "it drafts, a person approves"
    ipa: "/ɪt drɑːfts ə ˈpɜːrsn əˈpruːvz/"
    meaning_vi: "máy soạn nháp, người duyệt"
    chunk: "It drafts the reply, a person approves it."
    emoji: "✍️"
    mnemonic_vi: "\"draft\" là BẢN NHÁP. Câu trấn an mạnh nhất khi trình bày dự án AI: máy không quyết, máy chỉ soạn — người vẫn cầm bút ký."
    tags: [ai, core]
  - term: "when it is wrong"
    ipa: "/wen ɪt ɪz rɒŋ/"
    meaning_vi: "khi nó sai"
    chunk: "When it is wrong, the ticket goes to the queue as before."
    emoji: "🔀"
    mnemonic_vi: "Chữ \"WHEN\" chứ không phải \"if\" — thừa nhận nó CHẮC CHẮN sẽ sai đôi lúc. Nói \"if\" nghe như hứa hẹn không tưởng."
    tags: [ai, core]
  - term: "it makes things up"
    ipa: "/ɪt meɪks θɪŋz ʌp/"
    meaning_vi: "nó bịa ra"
    chunk: "Sometimes it makes things up, so we check the source."
    emoji: "🎭"
    mnemonic_vi: "\"make up\" là BỊA, dựng chuyện. Cách nói dân dã của \"hallucination\" — dùng chữ này với sếp không chuyên thì họ hiểu ngay."
    tags: [ai, core]
  - term: "saves about"
    ipa: "/seɪvz əˈbaʊt/"
    meaning_vi: "tiết kiệm khoảng"
    chunk: "It saves about two hours a day for the team."
    emoji: "⏱️"
    mnemonic_vi: "Chữ \"about\" chừa sai số — hứa con số chính xác rồi không đạt là mất tin. Nhưng phải CÓ con số: \"tiết kiệm nhiều thời gian\" thì không ai duyệt ngân sách."
    tags: [ai, core]
  - term: "we start small"
    ipa: "/wiː stɑːrt smɔːl/"
    meaning_vi: "chúng tôi làm nhỏ trước"
    chunk: "We start small: one team, four weeks."
    emoji: "🌱"
    mnemonic_vi: "Kèm luôn PHẠM VI và HẠN. \"Một đội, bốn tuần\" nghe như một thí nghiệm bỏ được; \"triển khai toàn công ty\" nghe như một canh bạc."
    tags: [ai, core]

sentence_patterns:
  - pattern: "It {action}, and a person {check}."
    meaning_vi: "Nó {action}, và một người {check}."
    slots:
      action: ["drafts the reply", "suggests a category", "summarises the log"]
      check: ["approves it before sending", "can change it in one click", "checks it against the source"]
  - pattern: "When it is wrong, {fallback}."
    meaning_vi: "Khi nó sai thì {fallback}."
    slots:
      fallback: ["the ticket goes to the queue as before", "the agent edits the draft", "nothing is sent"]

dialogue:
  context_vi: >
    Chị Thu, trưởng phòng dịch vụ khách hàng, nghe bạn đề xuất dùng AI phân loại
    ticket. Chị không rành kỹ thuật và đang lo nhân viên mất việc.
  turns:
    - speaker: "Thu"
      en: "You want to use AI on our tickets. Explain it to me like I know nothing about it."
      vi: "Em muốn dùng AI cho ticket của bọn chị. Giải thích như thể chị không biết gì về nó đi."
    - speaker: "You"
      en: "Right now an agent reads each new ticket and picks a category. That takes about thirty seconds each, and we get four hundred a day."
      vi: "Hiện tại một nhân viên đọc từng ticket mới rồi chọn nhóm. Mỗi cái mất khoảng ba mươi giây, mà một ngày có bốn trăm cái."
    - speaker: "Thu"
      en: "So about three hours a day. And the AI does that instead?"
      vi: "Vậy khoảng ba tiếng một ngày. Rồi AI làm thay à?"
    - speaker: "You"
      en: "It suggests a category. The agent still sees it and can change it in one click. It drafts, a person approves."
      vi: "Nó gợi ý nhóm. Nhân viên vẫn nhìn thấy và đổi được bằng một cú bấm. Máy soạn nháp, người duyệt."
    - speaker: "Thu"
      en: "What if it picks the wrong one?"
      vi: "Nếu nó chọn sai thì sao?"
    - speaker: "You"
      en: "Then the agent changes it, same as today. Nothing gets worse — the worst case is we're back to where we are now."
      vi: "Thì nhân viên đổi lại, y như hôm nay. Không có gì tệ hơn — xấu nhất là mình quay về đúng hiện trạng."
    - speaker: "Thu"
      en: "And nobody loses their job?"
      vi: "Và không ai mất việc chứ?"
    - speaker: "You"
      en: "Not from this. It removes the sorting, not the answering. The answering is the part that needs a person."
      vi: "Không phải vì cái này ạ. Nó bỏ phần phân loại, không bỏ phần trả lời. Phần trả lời mới là phần cần người."
    - speaker: "Thu"
      en: "How do we know it works before we roll it out?"
      vi: "Làm sao biết nó chạy được trước khi triển khai rộng?"
    - speaker: "You"
      en: "We start small. One team, four weeks, and we measure how often the agent has to change the suggestion."
      vi: "Bọn em làm nhỏ trước. Một nhóm, bốn tuần, và đo xem nhân viên phải sửa gợi ý bao nhiêu lần."

listening:
  context_vi: >
    Nghe hai cách trình bày cùng một ý tưởng AI. Chú ý cách nào cho
    người nghe biết chuyện gì xảy ra khi máy sai.
  speed: 1.1
  voice: en_US_female
  transcript_en: "Pitch one: we will use AI to transform our support process, improve efficiency and deliver a better customer experience with cutting-edge technology. Pitch two: the AI suggests a ticket category, the agent sees the suggestion and can change it in one click. If it is wrong, the agent changes it, exactly like today. We run it with one team for four weeks and measure how often the suggestion is changed."
  transcript_vi: "Cách một: bọn tôi sẽ dùng AI để chuyển đổi quy trình hỗ trợ, nâng cao hiệu quả và mang lại trải nghiệm khách hàng tốt hơn bằng công nghệ tiên tiến. Cách hai: AI gợi ý nhóm cho ticket, nhân viên nhìn thấy gợi ý và đổi được bằng một cú bấm. Nếu nó sai thì nhân viên đổi lại, y hệt hôm nay. Bọn tôi chạy với một nhóm trong bốn tuần và đo xem gợi ý bị đổi bao nhiêu lần."
  questions:
    - kind: mcq_listen
      prompt_vi: "Cách hai nói rõ điều gì mà cách một không?"
      choices: ["Chuyện gì xảy ra khi máy sai", "Tên mô hình dùng", "Chi phí bản quyền"]
      answer: 0
      difficulty: 2
      skill: Listening
    - kind: mcq_listen
      prompt_vi: "Cách hai đo thành công bằng gì?"
      choices: ["Mức độ hài lòng", "Số ticket mỗi ngày", "Số lần nhân viên phải đổi gợi ý"]
      answer: 2
      difficulty: 2
      skill: Listening
    - kind: mcq_listen
      prompt_vi: "Vì sao cách một khó duyệt?"
      choices: ["Quá ngắn", "Toàn từ chung chung, người nghe không biết cụ thể máy làm gì", "Dùng quá nhiều số"]
      answer: 1
      difficulty: 3
      skill: Listening

