explanation:
  why_vi: >
    Người quyết ngân sách không hỏi mô hình nào, bao nhiêu tham số. Họ hỏi ba câu:
    nó thay việc gì, sai thì sao, ai chịu trách nhiệm. Bài trình bày đầy từ
    "chuyển đổi", "tối ưu", "tiên tiến" không trả lời câu nào trong ba câu đó,
    nên bị hoãn — không phải vì người nghe phản đối AI mà vì họ không có gì để đánh giá.
  how_vi: >
    Ba câu, bằng ngôn ngữ công việc chứ không phải ngôn ngữ kỹ thuật.
    Câu một: hiện tại ai làm việc gì, mất bao lâu. Câu hai: máy làm phần nào,
    người duyệt phần nào — "it drafts, a person approves". Câu ba: khi nó sai
    thì chuyện gì xảy ra. Nếu câu ba là "quay về đúng như hôm nay" thì đề xuất
    của bạn gần như chắc chắn được duyệt.
  contrast_vi: >
    "Dùng AI để chuyển đổi quy trình hỗ trợ" không cho người nghe thứ gì để cân nhắc.
    "Máy gợi ý nhóm, nhân viên đổi bằng một cú bấm, sai thì đổi lại y như hôm nay"
    cho họ thấy rủi ro tối đa — và rủi ro tối đa bằng hiện trạng là lý lẽ mạnh nhất.

common_mistakes:
  - mistake: "Dùng từ ngữ tiếp thị thay vì mô tả công việc"
    why_vi: >
      Nghe nhiều bài giới thiệu sản phẩm nên phản xạ là nói theo giọng đó.
      Nhưng người nghe muốn biết nhân viên của họ sẽ làm gì khác đi.
    fix_vi: "Mô tả một ngày làm việc trước và sau. Bỏ hết tính từ."
    detect_phoneme_missing: []
  - mistake: "Không nói ra trường hợp máy sai"
    why_vi: >
      Sợ nói ra thì đề xuất bị từ chối. Thực tế ngược lại: người duyệt
      luôn giả định máy sẽ sai, và im lặng khiến họ nghĩ bạn chưa xét tới.
    fix_vi: "Thêm một câu \"When it is wrong, ...\" nêu rõ đường lui."
    detect_phoneme_missing: []
  - mistake: "Xin phạm vi lớn ngay từ đầu"
    why_vi: >
      Muốn chứng minh giá trị lớn nên đề xuất áp dụng toàn công ty.
      Nhưng phạm vi lớn kéo theo nhiều người phải duyệt và đề xuất chết vì chờ.
    fix_vi: "Xin một nhóm, bốn tuần, kèm một tiêu chí đo được để dừng hoặc mở rộng."
    detect_phoneme_missing: []

memory_trick_vi: >
