      - "the agent changes it"
      - "like today"
      - "wrong"

reading:
  kind: note
  context_vi: >
    Đề xuất một trang gửi trưởng phòng. Đọc và tìm chỗ tác giả nói ra
    giới hạn của mô hình.
  text_en: |
    Proposal: category suggestion for incoming tickets

    The problem
    Agents sort 400 tickets a day by hand. Each takes about 30 seconds,
    so roughly 3 hours of agent time a day goes to sorting rather than
    answering. Sorting is also the part agents rate lowest in the team survey.

    What we would build
    A model reads the ticket text and suggests one of our 14 categories.
    The suggestion appears pre-filled in the form. The agent sees it and
    changes it with one click if it is wrong. Nothing is sent to the
    customer by the model. It drafts, a person approves.

    What it will get wrong
    Two things, from the test on last month's tickets. Tickets that mention
    two systems get sorted by the first one mentioned, which is wrong about
    a fifth of the time. And tickets written in a mix of Vietnamese and
    English do noticeably worse - we measured 71% correct against 89% for
    single-language tickets. Both cases end the same way: the agent changes
    the category, which is what happens today anyway.

    What it does not do
    It does not close tickets, it does not reply to customers, and it does
    not decide priority. Priority stays manual because getting it wrong has
    a real cost and the model gave us no useful signal in testing.

    How we would know it works
    One team, four weeks. Success is the agent accepting the suggestion
    without change at least 80% of the time, measured automatically.
    Below that we stop - a suggestion that is wrong one time in three is
    worse than no suggestion, because the agent stops reading it carefully.
  text_vi: |
    Đề xuất: gợi ý phân nhóm cho ticket mới

    Vấn đề
    Nhân viên phân loại 400 ticket mỗi ngày bằng tay. Mỗi cái mất khoảng 30 giây,
    tức khoảng 3 tiếng thời gian nhân viên mỗi ngày dành cho phân loại thay vì trả lời.
    Phân loại cũng là phần bị chấm điểm thấp nhất trong khảo sát nội bộ.

    Sẽ làm gì
    Một mô hình đọc nội dung ticket và gợi ý một trong 14 nhóm của mình.
    Gợi ý hiện sẵn trong biểu mẫu. Nhân viên nhìn thấy và đổi bằng một cú bấm
    nếu sai. Mô hình không gửi gì tới khách hàng. Máy soạn nháp, người duyệt.

    Nó sẽ sai ở đâu
    Hai chỗ, theo kết quả thử trên ticket tháng trước. Ticket nhắc tới hai hệ thống
    thì bị xếp theo hệ nhắc trước, sai khoảng một phần năm số lần. Và ticket viết
    lẫn tiếng Việt với tiếng Anh thì kém hơn rõ rệt - bọn mình đo được 71% đúng
    so với 89% ở ticket một ngôn ngữ. Cả hai trường hợp đều kết thúc giống nhau:
    nhân viên đổi nhóm, đúng như việc vẫn làm hôm nay.

    Nó không làm gì
    Nó không đóng ticket, không trả lời khách, và không quyết mức ưu tiên.
    Mức ưu tiên vẫn làm tay vì sai chỗ đó có giá thật, và khi thử thì mô hình
    không cho tín hiệu nào dùng được.

    Làm sao biết nó chạy được
    Một nhóm, bốn tuần. Thành công là nhân viên chấp nhận gợi ý mà không sửa
    ít nhất 80% số lần, đo tự động. Dưới mức đó thì dừng - một gợi ý sai một phần ba
    số lần còn tệ hơn không có gợi ý, vì nhân viên sẽ thôi đọc kỹ nó.
  questions:
    - kind: mcq_read
      prompt_en: "What accuracy did mixed-language tickets reach in testing?"
      choices: ["89%", "80%", "71%"]
      answer: 2
      difficulty: 2
      reading_skill: scan
      skill: Reading
    - kind: mcq_read
      prompt_en: "Why does priority stay manual?"
      choices: ["Getting it wrong has a real cost and the model gave no useful signal", "It is too slow to automate", "Agents prefer it"]
      answer: 0
      difficulty: 3
      reading_skill: scan
      skill: Reading
    - kind: mcq_read
      prompt_en: "Why is a suggestion wrong one time in three worse than none?"
      choices: ["It costs more", "The agent stops reading it carefully", "It slows the form down"]
      answer: 1
      difficulty: 3
      reading_skill: skim
      skill: Reading

writing:
  kind: GuidedEmail
  prompt_vi: >
    Viết ba câu giới thiệu một ứng dụng AI cho người không chuyên: nó làm gì,
    ai duyệt, và chuyện gì xảy ra khi nó sai.
  prompt_en: "Introduce an AI use case to a non-technical manager."
  required_points:
    - "suggests"
    - "a person"
    - "when it is wrong"
  hint_vi: "Không dùng từ mô hình, tham số, huấn luyện. Nói bằng việc nhân viên đang làm."
  sample_en: "The model reads each new ticket and suggests one of our fourteen categories, and the suggestion appears pre-filled in the form. A person still sees every ticket and changes the category in one click if it does not fit. When it is wrong, the agent changes it exactly as they do today, so the worst case is where we already are."

