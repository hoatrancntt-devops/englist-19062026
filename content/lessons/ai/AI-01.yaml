  - kind: read_aloud
    expected_text: "It drafts the reply, and a person approves it before sending."
    prompt_vi: "Câu quan trọng nhất khi nói về AI với người không chuyên."
    ipa: "/ɪt drɑːfts ðə rɪˈplaɪ ænd ə ˈpɜːrsn/"
    focus_phonemes: ["dr", "pl"]
  - kind: read_aloud
    expected_text: "When it is wrong, the agent changes it, exactly like today."
    prompt_vi: "Nói rõ đường lui. Người nghe sợ nhất là lúc máy sai."
    ipa: "/wen ɪt ɪz rɒŋ ði ˈeɪdʒənt ˈtʃeɪndʒɪz ɪt/"
    focus_phonemes: ["dʒ", "tʃ"]
  - kind: shadow
    expected_text: "It removes the sorting, not the answering."
    prompt_vi: "Nói rõ phần nào máy làm, phần nào người vẫn làm."
    ipa: "/ɪt rɪˈmuːvz ðə ˈsɔːrtɪŋ/"
    focus_phonemes: ["v", "ŋ"]
  - kind: shadow
    expected_text: "We start small: one team, four weeks."
    prompt_vi: "Phạm vi nhỏ và thời hạn rõ làm đề xuất dễ duyệt hơn nhiều."
    ipa: "/wiː stɑːrt smɔːl wʌn tiːm/"
    focus_phonemes: ["st", "sm"]
  - kind: respond
    prompt_en: "What if the AI picks the wrong category?"
    prompt_vi: "Nêu đường lui và nói rõ xấu nhất là quay về hiện trạng."
