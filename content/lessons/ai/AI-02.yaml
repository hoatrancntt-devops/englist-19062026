is_checkpoint: false

illustration: data-pipeline

objective_vi: >
  Giải thích được khi nào cần tra tài liệu (RAG) và khi nào cần huấn luyện thêm
  (fine-tuning), bằng vấn đề cần giải chứ không bằng công nghệ nghe hay hơn.

objective_observable: >
  Đạt từ 75 điểm trên cả bốn trục kỹ năng, không trục nào dưới 60.

