explanation:
  why_vi: >
    Trong nhóm kỹ thuật, tranh luận về AI hay bắt đầu từ tên công nghệ:
    "mình fine-tune đi", "mình dùng mô hình lớn nhất đi". Bắt đầu từ đó thì
    người thắng là người nói chắc giọng hơn, không phải người có lý. Bắt đầu từ
    phàn nàn của người dùng thì câu trả lời thường hiện ra ngay và không phải cãi.
  how_vi: >
    Hai câu phân định gần như đủ cho mọi cuộc bàn: "Retrieval fixes out-of-date facts,
    not the answer style" và "Fine-tuning changes how it answers, not what it knows".
    Trước hai câu đó, luôn hỏi "What problem are we solving?" — câu hỏi này
    không phải để bắt bẻ, nó đưa cuộc bàn về thứ kiểm chứng được.
  contrast_vi: >
    "Fine-tuning tiên tiến hơn nên kết quả tốt hơn" không kiểm chứng được và
    không nói được nó tốt hơn ở việc gì. "Phàn nàn là trợ lý trả lời theo quy trình
    năm ngoái — đó là dữ kiện lỗi thời, nên tra cứu giải được còn fine-tuning thì không"
    gắn giải pháp vào đúng vấn đề, và ai cũng kiểm được lập luận đó.

common_mistakes:
  - mistake: "Chọn cách làm trước, tìm vấn đề sau"
    why_vi: >
      Công nghệ mới hấp dẫn và ai cũng muốn thử. Nhưng khi vấn đề được nêu sau
      thì nó bị uốn cho vừa giải pháp, và hệ thống ra đời không giải quyết được gì.
    fix_vi: "Luôn mở bằng \"What problem are we solving?\" rồi mới bàn cách."
    detect_phoneme_missing: []
  - mistake: "Tưởng fine-tuning dạy thêm kiến thức mới cho mô hình"
    why_vi: >
      Chữ “huấn luyện” gợi ý là nhồi thêm kiến thức. Thực tế nó chủ yếu
      đổi cách trả lời, và dữ kiện mới thì tra cứu làm rẻ hơn nhiều lần.
    fix_vi: "Nhớ: fine-tuning đổi CÁCH trả lời, tra cứu đổi CÁI mô hình dựa vào."
    detect_phoneme_missing: []
  - mistake: "Mặc định chọn mô hình lớn nhất"
    why_vi: >
      Điểm chính xác cao hơn nhìn là thắng. Nhưng chậm gấp ba lần thì người dùng
      bỏ không dùng, và một trợ lý không ai dùng có độ chính xác thực tế bằng không.
    fix_vi: "Đo trên câu hỏi thật, so cả độ chính xác lẫn độ trễ và chi phí."
    detect_phoneme_missing: []

memory_trick_vi: >
  Hai câu chốt mọi tranh luận: RETRIEVAL sửa DỮ KIỆN LỖI THỜI.
  FINE-TUNING đổi CÁCH TRẢ LỜI, không đổi CÁI NÓ BIẾT.
  Và luôn hỏi trước: mình đang giải vấn đề gì?
