vocabulary:
  - term: "retrieval"
    ipa: "/rɪˈtriːvl/"
    meaning_vi: "tra cứu — tìm tài liệu liên quan rồi đưa cho mô hình"
    chunk: "Retrieval pulls the three closest documents."
    tags: [ai, core]
  - term: "fine-tuning"
    ipa: "/faɪn ˈtjuːnɪŋ/"
    meaning_vi: "huấn luyện thêm để đổi cách trả lời"
    chunk: "Fine-tuning changes the style, not the facts."
    tags: [ai, core]
  - term: "grounded in"
    ipa: "/ˈɡraʊndɪd ɪn/"
    meaning_vi: "dựa trên nguồn cụ thể"
    chunk: "The answer is grounded in our own documents."
    tags: [ai, core]
  - term: "out of date"
    ipa: "/aʊt ɒv deɪt/"
    meaning_vi: "đã lỗi thời"
    chunk: "The model's knowledge is out of date."
    tags: [ai, core]
  - term: "cite the source"
    ipa: "/saɪt ðə sɔːrs/"
    meaning_vi: "dẫn nguồn"
    chunk: "It must cite the source for every answer."
    tags: [ai, core]
  - term: "good enough"
    ipa: "/ɡʊd ɪˈnʌf/"
    meaning_vi: "đủ dùng"
    chunk: "The smaller model is good enough for this."
    tags: [ai, core]

sentence_patterns:
  - pattern: "{Approach} fixes {problem}, not {other}."
    meaning_vi: "{Approach} giải quyết {problem}, không giải quyết {other}."
    slots:
      Approach: ["Retrieval", "Fine-tuning", "A bigger model"]
      problem: ["out-of-date facts", "the wrong tone", "missing internal knowledge"]
      other: ["the answer style", "wrong facts", "slow responses"]
  - pattern: "The smaller model is good enough because {reason}."
    meaning_vi: "Mô hình nhỏ là đủ dùng vì {reason}."
    slots:
      reason: ["the answers come from our documents", "the task is classification", "we only need three categories"]

dialogue:
  context_vi: >
    Bạn và anh Khoa bàn cách làm trợ lý tra cứu quy trình nội bộ.
    Anh Khoa muốn fine-tuning vì nghe nói nó mạnh hơn.
  turns:
    - speaker: "Khoa"
      en: "Let's fine-tune a model on all our internal documents. Then it knows everything."
      vi: "Mình fine-tune một mô hình trên toàn bộ tài liệu nội bộ đi. Thế là nó biết hết."
    - speaker: "You"
      en: "What problem are we solving? If the issue is that it doesn't know our processes, retrieval fixes that more cheaply."
      vi: "Mình đang giải vấn đề gì ạ? Nếu vấn đề là nó không biết quy trình của mình thì tra cứu giải quyết được, mà rẻ hơn."
    - speaker: "Khoa"
      en: "What's the difference in practice?"
      vi: "Thực tế khác nhau ở chỗ nào?"
    - speaker: "You"
      en: "Retrieval finds the three closest documents and gives them to the model with the question. The answer is grounded in our own files, and it can cite the source."
      vi: "Tra cứu tìm ba tài liệu gần nhất rồi đưa cho mô hình cùng câu hỏi. Câu trả lời dựa trên chính file của mình, và nó dẫn được nguồn."
    - speaker: "Khoa"
      en: "And fine-tuning doesn't do that?"
      vi: "Fine-tuning không làm được thế à?"
    - speaker: "You"
      en: "Fine-tuning changes how it answers, not what it knows. And when a process changes next month, retrieval picks it up the same day. Fine-tuning needs a new training run."
      vi: "Fine-tuning đổi cách nó trả lời, không đổi cái nó biết. Với lại tháng sau quy trình đổi thì tra cứu cập nhật ngay trong ngày. Fine-tuning phải huấn luyện lại."
    - speaker: "Khoa"
      en: "So fine-tuning is never useful?"
      vi: "Vậy fine-tuning không bao giờ dùng à?"
    - speaker: "You"
      en: "It is, when the problem is style. If we want every answer in our support tone with a fixed structure, that's a fine-tuning problem."
      vi: "Có chứ ạ, khi vấn đề là văn phong. Nếu mình muốn mọi câu trả lời theo đúng giọng hỗ trợ và một cấu trúc cố định thì đó là bài toán fine-tuning."
    - speaker: "Khoa"
      en: "Fair. Start with retrieval then."
      vi: "Hợp lý. Vậy bắt đầu bằng tra cứu."

listening:
  context_vi: >
    Nghe hai cách chọn giải pháp. Chú ý ai bắt đầu từ vấn đề
    và ai bắt đầu từ công nghệ.
  speed: 1.2
  voice: en_US_male
  transcript_en: "Speaker one: we should fine-tune, it is the more advanced approach and it will give better results. Speaker two: the complaint is that the assistant gives answers based on last year's process. That is an out-of-date facts problem, so retrieval fixes it and fine-tuning does not. Fine-tuning changes how it answers, not what it knows. If the complaint were about tone, I would say the opposite."
  transcript_vi: "Người một: mình nên fine-tune, đó là cách tiên tiến hơn và sẽ cho kết quả tốt hơn. Người hai: phàn nàn là trợ lý trả lời theo quy trình năm ngoái. Đó là vấn đề dữ kiện lỗi thời, nên tra cứu giải quyết được còn fine-tuning thì không. Fine-tuning đổi cách nó trả lời, không đổi cái nó biết. Nếu phàn nàn là về văn phong thì tôi sẽ nói ngược lại."
  questions:
    - kind: mcq_listen
      prompt_vi: "Người hai bắt đầu từ đâu?"
      choices: ["Từ nội dung phàn nàn của người dùng", "Từ công nghệ tiên tiến nhất", "Từ ngân sách"]
      answer: 0
      difficulty: 2
      skill: Listening
    - kind: mcq_listen
      prompt_vi: "Theo người hai, fine-tuning đổi cái gì?"
      choices: ["Cái mô hình biết", "Tốc độ trả lời", "Cách mô hình trả lời"]
      answer: 2
      difficulty: 2
      skill: Listening
    - kind: mcq_listen
      prompt_vi: "Khi nào người hai sẽ chọn fine-tuning?"
      choices: ["Khi dữ kiện lỗi thời", "Khi vấn đề là văn phong", "Không bao giờ"]
      answer: 1
      difficulty: 3
      skill: Listening

