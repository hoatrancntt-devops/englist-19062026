schema_version: 1
code: AI-02
slug: noi-ve-chon-mo-hinh-rag-fine-tuning
title_vi: "Chọn mô hình, RAG hay fine-tuning — nói cho đồng nghiệp hiểu"
title_en: "Talking about model selection, RAG and fine-tuning"

layer: Professional
track: Ai
