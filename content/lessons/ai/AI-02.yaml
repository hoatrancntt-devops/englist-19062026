      - "retrieval"
      - "not what it knows"

reading:
  kind: note
  context_vi: >
    Ghi chú kỹ thuật gửi cả nhóm. Đọc và tìm lý do thật khiến nhóm
    chọn mô hình nhỏ hơn.
  text_en: |
    Assistant for internal process questions - approach

    The complaint
    People ask the assistant how to raise a change request and get the
    2024 process. The process changed in March. This is an out-of-date
    facts problem, not a style problem.

    Approach: retrieval, not fine-tuning
    We index the process documents. On each question we pull the three
    closest sections and pass them to the model with the question. Every
    answer shows the document name and section it came from, so a reader
    can check it in one click.

    This also solves the maintenance problem. When a process changes, we
    re-index that document and the assistant is correct the same day.
    A fine-tuned model would need a new training run for every change,
    and we change processes about twice a month.

    Model choice
    We tested the large and the small model on 60 real questions. The
    large one was correct on 54, the small one on 52. Both cite sources
    correctly. The small one answers in 0.9 seconds against 3.1, and costs
    about a seventh as much. Two extra correct answers out of sixty does
    not justify a three-times slower assistant that people will stop using.
    We take the small model.

    What we are not doing
    No fine-tuning for now. If we later want every answer in a fixed
    support format, that is the point to revisit it - that is a style
    problem and retrieval will not fix it.

    Known limit
    Retrieval only helps if the answer is in a document. Questions about
    things we have never written down still get a confident wrong answer.
    The mitigation is the source line: no source shown means no answer to
    trust, and we say that in the interface rather than hoping people notice.
  text_vi: |
    Trợ lý trả lời câu hỏi quy trình nội bộ - hướng làm

    Phàn nàn
    Mọi người hỏi trợ lý cách mở yêu cầu thay đổi thì nhận được quy trình
    năm 2024. Quy trình đã đổi hồi tháng Ba. Đây là vấn đề dữ kiện lỗi thời,
    không phải vấn đề văn phong.

    Hướng làm: tra cứu, không fine-tuning
    Bọn mình lập chỉ mục các tài liệu quy trình. Mỗi câu hỏi thì lấy ba mục
    gần nhất rồi đưa cho mô hình cùng câu hỏi. Mọi câu trả lời hiện tên tài liệu
    và mục lấy ra, nên người đọc kiểm được bằng một cú bấm.

    Cách này còn giải quyết chuyện bảo trì. Quy trình đổi thì lập chỉ mục lại
    tài liệu đó và trợ lý trả lời đúng ngay trong ngày. Mô hình fine-tune sẽ phải
    huấn luyện lại mỗi lần đổi, mà bọn mình đổi quy trình khoảng hai lần một tháng.

    Chọn mô hình
    Bọn mình thử mô hình lớn và mô hình nhỏ trên 60 câu hỏi thật. Mô hình lớn đúng 54,
    mô hình nhỏ đúng 52. Cả hai dẫn nguồn chính xác. Mô hình nhỏ trả lời trong 0,9 giây
    so với 3,1 giây, và tốn khoảng một phần bảy. Hơn hai câu đúng trên sáu mươi
    không đủ để đánh đổi lấy một trợ lý chậm gấp ba mà rồi người ta bỏ không dùng.
    Bọn mình chọn mô hình nhỏ.

    Cái gì không làm
    Chưa fine-tuning. Nếu sau này muốn mọi câu trả lời theo một định dạng hỗ trợ
    cố định thì đó là lúc xem lại - đó là vấn đề văn phong và tra cứu không giải được.

    Giới hạn đã biết
    Tra cứu chỉ giúp khi câu trả lời có trong tài liệu. Câu hỏi về những thứ chưa từng
    được viết ra vẫn nhận một câu trả lời sai đầy tự tin. Cách giảm thiểu là dòng dẫn nguồn:
    không có nguồn nghĩa là không có câu trả lời đáng tin, và bọn mình nói thẳng điều đó
    trên giao diện chứ không mong người dùng tự để ý.
  questions:
    - kind: mcq_read
      prompt_en: "Why did the team choose the smaller model?"
      choices: ["It was more accurate", "The large one could not cite sources", "Two extra correct answers out of sixty did not justify being three times slower"]
      answer: 2
      difficulty: 3
      reading_skill: skim
      skill: Reading
    - kind: mcq_read
      prompt_en: "How often do the processes change?"
      choices: ["About twice a month", "Twice a year", "Once a week"]
      answer: 0
      difficulty: 2
      reading_skill: scan
      skill: Reading
    - kind: mcq_read
      prompt_en: "What is the stated limit of retrieval?"
      choices: ["It is slow", "It only helps if the answer exists in a document", "It cannot cite sources"]
      answer: 1
      difficulty: 3
      reading_skill: scan
      skill: Reading
    - kind: mcq_read
      prompt_en: "When would the team revisit fine-tuning?"
      choices: ["When processes change again", "When the model gets cheaper", "When they want every answer in a fixed support format"]
      answer: 2
      difficulty: 3
      reading_skill: scan
      skill: Reading

writing:
  kind: GuidedEmail
  prompt_vi: >
    Viết ba câu giải thích vì sao chọn tra cứu thay vì fine-tuning:
    nêu vấn đề, phân định hai cách, và nêu lợi ích bảo trì.
  prompt_en: "Explain why retrieval fits this problem better than fine-tuning."
  required_points:
    - "out of date"
    - "retrieval"
    - "not what it knows"
  hint_vi: "Bắt đầu từ phàn nàn của người dùng, không bắt đầu từ tên công nghệ."
  sample_en: "The complaint is that the assistant answers with last year's process, so this is an out-of-date facts problem. Retrieval fixes that because every answer is grounded in the current documents and cites the section it came from. Fine-tuning changes how it answers, not what it knows, and it would need a new training run every time we change a process."

