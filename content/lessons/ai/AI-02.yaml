    focus_phonemes: ["ɡr", "aʊ"]
  - kind: respond
    prompt_en: "Let's fine-tune a model on all our internal documents."
    prompt_vi: "Hỏi lại vấn đề cần giải, rồi phân định RAG với fine-tuning."
