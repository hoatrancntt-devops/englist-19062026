  - kind: read_aloud
    expected_text: "Retrieval fixes out-of-date facts, not the answer style."
    prompt_vi: "Một câu phân định ranh giới. Học thuộc."
    ipa: "/rɪˈtriːvl ˈfɪksɪz aʊt ɒv deɪt fækts/"
    focus_phonemes: ["tr", "kts"]
  - kind: read_aloud
    expected_text: "Fine-tuning changes how it answers, not what it knows."
    prompt_vi: "Câu còn lại của cặp. Hai câu này giải quyết hầu hết tranh luận."
    ipa: "/faɪn ˈtjuːnɪŋ ˈtʃeɪndʒɪz haʊ ɪt ˈænsərz/"
    focus_phonemes: ["tʃ", "n"]
  - kind: shadow
    expected_text: "What problem are we solving?"
    prompt_vi: "Câu hỏi mở đầu mọi cuộc bàn về công nghệ."
    ipa: "/wɒt ˈprɒbləm ɑːr wiː ˈsɒlvɪŋ/"
    focus_phonemes: ["pr", "v"]
  - kind: shadow
