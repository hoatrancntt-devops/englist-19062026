explanation:
  why_vi: >
    Một con số chung luôn dễ báo cáo và dễ nghe. Nhưng hệ thống AI hầu như không bao giờ
    kém đều — nó rất tốt với phần lớn người dùng và rất kém với một nhóm nhỏ.
    Nhóm đó chính là nhóm bỏ dùng đầu tiên, và khi họ bỏ thì con số trung bình
    còn đẹp lên, vì phần dữ liệu khó đã rời khỏi mẫu đo.
  how_vi: >
    Luôn báo cáo hai tầng: con số chung, rồi bảng tách theo một chiều có ý nghĩa —
    ngôn ngữ, nhóm người dùng, loại yêu cầu. Câu chốt là "the average hides a split".
    Và khi một nhóm tụt, hỏi nguyên nhân trước khi đụng vào mô hình: thường đó là
    dữ liệu mới chưa có tài liệu, không phải mô hình kém đi.
  contrast_vi: >
    "Độ chính xác 88%, người dùng hài lòng" không cho ai hành động được.
    "88% chung, nhưng nhóm lẫn ngôn ngữ chỉ 71% và nhóm đó chiếm một phần năm lượng việc"
    chỉ đúng chỗ cần sửa và chỉ đúng nhóm sắp mất niềm tin.

common_mistakes:
  - mistake: "Báo cáo bằng một con số trung bình duy nhất"
    why_vi: >
      Con số chung gọn và dễ trình bày. Nhưng nó trộn nhóm tốt với nhóm kém,
      và nhóm kém là nhóm sẽ bỏ dùng trước tiên.
    fix_vi: "Luôn kèm một bảng tách theo chiều có ý nghĩa với người nghe."
    detect_phoneme_missing: []
  - mistake: "Thấy số tụt là nghĩ ngay tới việc huấn luyện lại mô hình"
    why_vi: >
      Mô hình là phần mình vừa làm nên là thứ đầu tiên bị nghi.
      Thực tế phần lớn các đợt tụt là do dữ liệu mới chưa có tài liệu.
    fix_vi: "Tách theo loại yêu cầu trước. Nếu chỉ một loại tụt thì đó là vấn đề dữ liệu."
    detect_phoneme_missing: []
  - mistake: "Không nói tỷ trọng của nhóm bị kém"
    why_vi: >
      Nêu 71% mà không nói nhóm đó chiếm bao nhiêu thì người nghe không biết
      nên lo hay không lo.
    fix_vi: "Luôn kèm tỷ trọng: 71% và nhóm đó chiếm một phần năm lượng việc."
    detect_phoneme_missing: []

memory_trick_vi: >
  Hai tầng: SỐ CHUNG rồi BẢNG TÁCH. Câu chốt là "the average hides a split".
  Nhóm tụt thì hỏi dữ liệu trước, đừng đụng vào mô hình trước.
