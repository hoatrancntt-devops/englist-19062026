schema_version: 1
code: AI-03
slug: noi-ve-do-tre-do-chinh-xac-giam-sat
title_vi: "Độ trễ, độ chính xác và giám sát — nói về chất lượng bằng số"
title_en: "Talking about latency, accuracy and monitoring"

layer: Professional
track: Ai
level: B1
unit_code: U-AI2
order_index: 3
estimated_minutes: 12
is_checkpoint: false

illustration: metrics-dashboard

objective_vi: >
  Báo cáo chất lượng một hệ thống AI đang chạy bằng số đo, và nói được
  vì sao độ chính xác trung bình có thể che mất một nhóm người dùng bị hỏng.

objective_observable: >
  Đạt từ 75 điểm trên cả bốn trục kỹ năng, không trục nào dưới 60.

mastery_weights:
  Listening: 0.25
  Speaking: 0.30
  Reading: 0.25
  Writing: 0.20

prerequisites:
  - lesson: AI-02
    min_mastery: 70
    kind: Hard
  - lesson: INF-03
    min_mastery: 65
    kind: Soft

vocabulary:
  - term: "accuracy"
    ipa: "/ˈækjərəsi/"
    meaning_vi: "độ chính xác"
    chunk: "Accuracy dropped from 88 to 79 percent."
    emoji: "🎯"
    mnemonic_vi: "Nói kèm cả HAI mốc (\"từ 88 xuống 79\") chứ đừng chỉ nói con số cuối. Một con số đứng một mình không cho biết đang tốt lên hay xấu đi."
    tags: [ai, core]
  - term: "p95 latency"
    ipa: "/piː ˈnaɪnti faɪv ˈleɪtnsi/"
    meaning_vi: "độ trễ mà 95% yêu cầu nằm dưới mức đó"
    chunk: "The p95 latency is 1.4 seconds."
    emoji: "📊"
    mnemonic_vi: "Đọc \"pi-nine-ty-five\". Nghĩa: xếp mọi yêu cầu theo độ chậm, lấy mốc của người thứ 95 trên 100. Nó cho thấy trải nghiệm của người XUI NHẤT, thứ mà trung bình che mất."
    tags: [ai, core]
  - term: "the average hides"
    ipa: "/ði ˈævərɪdʒ haɪdz/"
    meaning_vi: "con số trung bình che mất"
    chunk: "The average hides a group that gets much worse answers."
    emoji: "🫥"
    mnemonic_vi: "Một chân trong lò lửa, một chân trong thùng đá — trung bình là dễ chịu. Câu này là lý do tồn tại của p95 và của việc tách nhỏ số liệu."
    tags: [ai, core]
  - term: "drift"
    ipa: "/drɪft/"
    meaning_vi: "chất lượng trôi dần theo thời gian"
    chunk: "We watch for drift every week."
    emoji: "🛶"
    mnemonic_vi: "\"drift\" là TRÔI DẠT — con thuyền không buộc dây trôi dần khỏi bến. Mô hình không đổi, nhưng thế giới quanh nó đổi, nên nó dần lệch."
    tags: [ai, core]
  - term: "break down by"
    ipa: "/breɪk daʊn baɪ/"
    meaning_vi: "tách nhỏ theo"
    chunk: "Break it down by language and by team."
    emoji: "🧩"
    mnemonic_vi: "\"break down\" là ĐẬP NHỎ RA. Thuốc giải cho \"the average hides\": đập con số tổng thành từng nhóm thì nhóm bị thiệt lộ ra ngay."
    tags: [ai, core]
  - term: "flag for review"
    ipa: "/flæɡ fɔːr rɪˈvjuː/"
    meaning_vi: "đánh dấu để người xem lại"
    chunk: "Low-confidence answers are flagged for review."
    emoji: "🚩"
    mnemonic_vi: "\"flag\" là CẮM CỜ. Cắm cờ lên những câu máy tự thấy không chắc, để người xem trước. Rẻ hơn nhiều so với bắt người duyệt tất cả."
    tags: [ai, core]

sentence_patterns:
  - pattern: "Accuracy is {number} overall, but only {lower} for {group}."
    meaning_vi: "Độ chính xác chung là {number}, nhưng chỉ {lower} với {group}."
    slots:
      number: ["88 percent", "91 percent"]
      lower: ["71 percent", "64 percent"]
      group: ["mixed-language tickets", "the night shift", "the new product line"]
  - pattern: "We break it down by {dimension} because {reason}."
    meaning_vi: "Bọn tôi tách theo {dimension} vì {reason}."
    slots:
      dimension: ["language", "team", "ticket type"]
      reason: ["the average hides the group that suffers", "one group drives most of the errors"]

dialogue:
  context_vi: >
    Bạn báo cáo kết quả bốn tuần chạy thử với chị Thu. Con số chung nhìn tốt,
    nhưng bạn tách nhỏ ra và thấy chuyện khác.
  turns:
    - speaker: "Thu"
      en: "You said 88 percent. That sounds good. Are we ready to roll it out?"
      vi: "Em nói tám mươi tám phần trăm. Nghe tốt đấy. Triển khai rộng được chưa?"
    - speaker: "You"
      en: "Not yet. 88 is the overall number, and the average hides something. I broke it down by language."
      vi: "Chưa ạ. Tám mươi tám là số chung, và con số trung bình che mất một chuyện. Em tách theo ngôn ngữ."
    - speaker: "Thu"
      en: "Go on."
      vi: "Nói tiếp đi."
    - speaker: "You"
      en: "English-only tickets are at 91. Mixed Vietnamese and English are at 71. That's about a fifth of our volume."
      vi: "Ticket thuần tiếng Anh đạt chín mươi mốt. Ticket lẫn Việt và Anh chỉ bảy mươi mốt. Nhóm đó chiếm khoảng một phần năm lượng ticket."
    - speaker: "Thu"
      en: "So one team gets a much worse tool than the others."
      vi: "Vậy là một nhóm nhận công cụ tệ hơn hẳn các nhóm khác."
    - speaker: "You"
      en: "Exactly. If we roll out on the average number, that team stops trusting it in the first week."
      vi: "Đúng ạ. Nếu triển khai dựa trên con số trung bình thì nhóm đó mất niềm tin ngay tuần đầu."
    - speaker: "Thu"
      en: "What do you suggest?"
      vi: "Em đề xuất gì?"
    - speaker: "You"
      en: "Roll out to the English-only queues now, and flag low-confidence suggestions for review instead of showing them. Then fix the mixed-language case before the second wave."
      vi: "Triển khai cho các hàng đợi thuần tiếng Anh trước, và với gợi ý độ tin cậy thấp thì đánh dấu để xem lại thay vì hiện ra. Rồi xử lý ca lẫn ngôn ngữ trước đợt hai."
    - speaker: "Thu"
      en: "And how will we know if it gets worse later?"
      vi: "Rồi làm sao biết sau này nó tệ đi?"
    - speaker: "You"
      en: "We measure the same breakdown every week. If any group drops more than five points, it goes on the standup."
      vi: "Bọn em đo đúng bảng tách đó hằng tuần. Nhóm nào tụt quá năm điểm thì đưa ra standup."

listening:
  context_vi: >
    Nghe hai bản báo cáo chất lượng. Chú ý bản nào cho người nghe
    thấy được nhóm bị ảnh hưởng nặng nhất.
  speed: 1.2
  voice: en_US_female
  transcript_en: "Report one: accuracy is 88 percent, latency is good, and users are happy. Report two: accuracy is 88 percent overall, but that average hides a split. English-only tickets are at 91 and mixed-language tickets are at 71, and mixed-language is a fifth of our volume. The p95 latency is 1.4 seconds, which is fine. We measure the same breakdown weekly and treat a five-point drop in any group as a standup item."
  transcript_vi: "Báo cáo một: độ chính xác tám mươi tám phần trăm, độ trễ tốt, người dùng hài lòng. Báo cáo hai: độ chính xác chung tám mươi tám phần trăm, nhưng con số trung bình đó che mất một sự chênh lệch. Ticket thuần tiếng Anh đạt chín mươi mốt còn ticket lẫn ngôn ngữ chỉ bảy mươi mốt, mà nhóm lẫn ngôn ngữ chiếm một phần năm lượng ticket. Độ trễ p95 là một phẩy bốn giây, mức đó ổn. Bọn tôi đo đúng bảng tách đó hằng tuần và coi việc tụt năm điểm ở bất kỳ nhóm nào là việc phải nêu ở standup."
  questions:
    - kind: mcq_listen
      prompt_vi: "Báo cáo hai phát hiện điều gì mà báo cáo một không?"
      choices: ["Một nhóm người dùng nhận kết quả kém hơn hẳn", "Độ trễ quá cao", "Chi phí tăng"]
      answer: 0
      difficulty: 2
      skill: Listening
    - kind: mcq_listen
      prompt_vi: "Nhóm lẫn ngôn ngữ chiếm bao nhiêu lượng ticket?"
      choices: ["Một phần mười", "Một nửa", "Một phần năm"]
      answer: 2
      difficulty: 2
      skill: Listening
    - kind: mcq_listen
      prompt_vi: "Ngưỡng nào khiến vấn đề được đưa ra standup?"
      choices: ["Độ trễ vượt hai giây", "Bất kỳ nhóm nào tụt quá năm điểm", "Có người phàn nàn"]
      answer: 1
      difficulty: 3
      skill: Listening

speaking_drills:
  - kind: read_aloud
    expected_text: "Accuracy is 88 percent overall, but the average hides a split."
    prompt_vi: "Câu mở đầu chuẩn khi báo cáo chất lượng."
    ipa: "/ˈækjərəsi ɪz ˈeɪti eɪt pərˈsent/"
    focus_phonemes: ["kj", "s"]
  - kind: read_aloud
    expected_text: "Mixed-language tickets are at 71 percent, and that is a fifth of our volume."
    prompt_vi: "Nêu nhóm bị ảnh hưởng kèm tỷ trọng của nhóm đó."
    ipa: "/mɪkst ˈlæŋɡwɪdʒ ˈtɪkɪts/"
    focus_phonemes: ["kst", "dʒ"]
  - kind: shadow
    expected_text: "The p95 latency is one point four seconds."
    prompt_vi: "Đọc số thập phân theo lối tiếng Anh: one point four."
    ipa: "/ðə piː ˈnaɪnti faɪv ˈleɪtnsi/"
    focus_phonemes: ["p", "t"]
  - kind: shadow
    expected_text: "Low-confidence answers are flagged for review, not shown."
    prompt_vi: "Nói rõ cách xử lý khi máy không chắc."
    ipa: "/loʊ ˈkɒnfɪdəns ˈænsərz ɑːr flæɡd/"
    focus_phonemes: ["fl", "d"]
  - kind: respond
    prompt_en: "You said 88 percent. Are we ready to roll it out?"
    prompt_vi: "Nêu con số chung, rồi tách nhỏ ra để lộ nhóm bị kém."
    accept_patterns:
      - "overall"
      - "hides"
      - "percent"

reading:
  kind: note
  context_vi: >
    Báo cáo hằng tuần về chất lượng trợ lý. Đọc và tìm dấu hiệu
    chất lượng đang trôi.
  text_en: |
    Assistant quality - week 12

    Overall accuracy: 86% (week 11: 88%, week 10: 88%)
    p95 latency: 1.4 s (unchanged)
    Volume: 2,140 suggestions

    Breakdown by language
    English only: 90% (was 91%)
    Mixed Vietnamese and English: 68% (was 71%)
    The gap is widening, not closing. Mixed-language volume also grew from
    19% to 24% of the total, which is why the overall number fell even
    though English-only barely moved. The overall number is going down for
    a reason that has nothing to do with the model getting worse.

    Breakdown by ticket type
    Access requests: 94%
    Hardware: 89%
    Network: 62%
    Network was 81% in week 9. Three new switch models were added to the
    estate in week 10 and none of them appear in any document we index.
    This is not model drift. It is a missing-document problem, and the fix
    is to write the documents, not to change anything about the model.

    Low-confidence handling
    118 suggestions fell below the confidence threshold and were flagged
    for review instead of being shown. Agents agreed with the flag in 104
    of those cases, which means the threshold is roughly in the right place.

    Action
    Write the three switch documents this week. Re-measure network on
    week 13. Do not touch the model. If network does not recover after the
    documents are indexed, then we look at the model.
  text_vi: |
    Chất lượng trợ lý - tuần 12

    Độ chính xác chung: 86% (tuần 11: 88%, tuần 10: 88%)
    Độ trễ p95: 1,4 giây (không đổi)
    Lượng: 2.140 gợi ý

    Tách theo ngôn ngữ
    Thuần tiếng Anh: 90% (trước là 91%)
    Lẫn Việt và Anh: 68% (trước là 71%)
    Khoảng cách đang giãn ra chứ không thu hẹp. Lượng ticket lẫn ngôn ngữ cũng tăng
    từ 19% lên 24% tổng số, đó là lý do con số chung giảm dù nhóm thuần tiếng Anh
    gần như không đổi. Con số chung giảm vì một lý do không liên quan gì tới việc
    mô hình kém đi.

    Tách theo loại ticket
    Yêu cầu cấp quyền: 94%
    Phần cứng: 89%
    Mạng: 62%
    Mạng từng đạt 81% ở tuần 9. Ba dòng switch mới được đưa vào hệ thống ở tuần 10
    và không dòng nào xuất hiện trong tài liệu nào bọn mình đang lập chỉ mục.
    Đây không phải mô hình trôi. Đây là vấn đề thiếu tài liệu, và cách sửa là
    viết tài liệu, không phải đụng vào mô hình.

    Xử lý gợi ý độ tin cậy thấp
    118 gợi ý rơi dưới ngưỡng tin cậy và được đánh dấu để xem lại thay vì hiện ra.
    Nhân viên đồng ý với việc đánh dấu ở 104 trường hợp, tức ngưỡng đang đặt
    tương đối đúng chỗ.

    Việc cần làm
    Viết ba tài liệu switch trong tuần này. Đo lại nhóm mạng ở tuần 13.
    Không động vào mô hình. Nếu sau khi lập chỉ mục tài liệu mà nhóm mạng vẫn không
    hồi phục thì lúc đó mới xem tới mô hình.
  questions:
    - kind: mcq_read
      prompt_en: "Why did the overall number fall?"
      choices: ["The model got worse", "Latency increased", "Mixed-language volume grew from 19% to 24%"]
      answer: 2
      difficulty: 3
      reading_skill: skim
      skill: Reading
    - kind: mcq_read
      prompt_en: "What caused the network category to drop?"
      choices: ["Three new switch models with no indexed documents", "Model drift", "A latency spike"]
      answer: 0
      difficulty: 2
      reading_skill: scan
      skill: Reading
    - kind: mcq_read
      prompt_en: "What does the report conclude about the model?"
      choices: ["Retrain it now", "Do not touch it until the documents are indexed and re-measured", "Replace it with a larger model"]
      answer: 1
      difficulty: 3
      reading_skill: skim
      skill: Reading
    - kind: mcq_read
      prompt_en: "What does the 104-out-of-118 agreement suggest?"
      choices: ["Agents ignore the flags", "The model is too slow", "The threshold is roughly right"]
      answer: 2
      difficulty: 3
      reading_skill: scan
      skill: Reading

writing:
  kind: GuidedEmail
  prompt_vi: >
    Viết ba câu báo cáo chất lượng: con số chung, con số tách nhỏ để lộ nhóm bị kém,
    và việc bạn sẽ làm.
  prompt_en: "Report AI quality in three sentences."
  required_points:
    - "overall"
    - "hides"
    - "break"
  hint_vi: "Đừng dừng ở con số trung bình. Nó là chỗ vấn đề hay lẩn vào."
  sample_en: "Accuracy is 86 percent overall this week, but that average hides a split. When we break it down by language, English-only tickets are at 90 percent and mixed-language tickets at 68, and mixed-language grew to a quarter of our volume. I am writing the three missing switch documents this week and will re-measure before we change anything about the model."

