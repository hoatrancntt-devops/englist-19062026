reading:
  kind: note
  context_vi: >
    Đề xuất hoàn chỉnh theo bốn chức năng của NIST AI RMF. Đọc và tìm
    chỗ tác giả tự đặt điều kiện dừng cho chính mình.
  text_en: |
    Proposal: ticket category suggestion
    Framework: NIST AI RMF - Govern, Map, Measure, Manage

    GOVERN - who decides and who answers for it
    The service owner is accountable for every suggestion an agent sees.
    The data owner decides which documents go into the index. Neither role
    is new; both already exist for the ticket system.
    The model sends nothing. It drafts, a person approves.

    MAP - what is in scope and what could go wrong
    In scope: internal tickets from the four support queues.
    Out of scope: customer-facing replies, HR records, anything touching
    payroll, and any decision about ticket priority.

    Risks, rated by likelihood and impact:
    1. The model states a policy that does not exist and an agent repeats
    it to a colleague. Likelihood medium, impact high. This is the risk
    that decides whether we ship.
    2. Suggestions are wrong often enough that agents click through without
    reading. Likelihood medium, impact medium.
    3. A document with restricted access is indexed and its content appears
    to someone who should not see it. Likelihood low, impact high.

    MEASURE - how we know, in numbers
    Weekly: accuracy overall and broken down by language and ticket type.
    Weekly: how often agents change the suggestion.
    Per answer: whether a source was cited.
    Stop condition: if accuracy for any group stays below 75% for two
    consecutive weeks, we turn the suggestion off for that group. This is
    written here so the decision is made now, not in the middle of an
    argument three months from now.

    MANAGE - what we do about each risk
    Risk 1: no answer is shown without a cited document section. If
    retrieval finds nothing, the field stays empty rather than guessing.
    Risk 2: the confidence threshold hides weak suggestions instead of
    showing them, and we track agreement between flags and agent decisions.
    Risk 3: the index is built from one folder with its own permissions,
    reviewed by the data owner before each re-index. No automatic crawling.
    All risks: any team lead can switch the feature off from the admin
    page, which returns the queue to the manual process with no data loss.
  text_vi: |
    Đề xuất: gợi ý phân nhóm ticket
    Khung: NIST AI RMF - Quản trị, Khoanh vùng, Đo lường, Kiểm soát

    QUẢN TRỊ - ai quyết và ai chịu trách nhiệm
    Chủ dịch vụ chịu trách nhiệm về mọi gợi ý mà nhân viên nhìn thấy.
    Chủ dữ liệu quyết tài liệu nào được đưa vào chỉ mục. Cả hai vai trò đều không mới;
    hệ thống ticket đã có sẵn.
    Mô hình không gửi gì. Nó soạn nháp, người duyệt.

    KHOANH VÙNG - phạm vi và những gì có thể hỏng
    Trong phạm vi: ticket nội bộ từ bốn hàng đợi hỗ trợ.
    Ngoài phạm vi: trả lời khách hàng, hồ sơ nhân sự, mọi thứ đụng tới lương,
    và mọi quyết định về mức ưu tiên ticket.

    Các rủi ro, chấm theo khả năng xảy ra và mức tác động:
    1. Mô hình nêu một chính sách không tồn tại và nhân viên nhắc lại với đồng nghiệp.
    Khả năng trung bình, tác động cao. Đây là rủi ro quyết định có triển khai hay không.
    2. Gợi ý sai đủ nhiều khiến nhân viên bấm qua mà không đọc.
    Khả năng trung bình, tác động trung bình.
    3. Một tài liệu có giới hạn truy cập bị đưa vào chỉ mục và nội dung của nó
    hiện ra với người không được phép xem. Khả năng thấp, tác động cao.

    ĐO LƯỜNG - biết bằng con số nào
    Hằng tuần: độ chính xác chung và tách theo ngôn ngữ, theo loại ticket.
    Hằng tuần: nhân viên đổi gợi ý bao nhiêu lần.
    Mỗi câu trả lời: có dẫn được nguồn hay không.
    Điều kiện dừng: nếu độ chính xác của nhóm nào giữ dưới 75% trong hai tuần liên tiếp,
    bọn mình tắt gợi ý cho nhóm đó. Điều này viết ra ở đây để quyết định được đưa ra
    ngay bây giờ, không phải giữa lúc tranh cãi ba tháng nữa.

    KIỂM SOÁT - làm gì với từng rủi ro
    Rủi ro 1: không hiện câu trả lời nào thiếu mục tài liệu dẫn nguồn. Nếu tra cứu
    không tìm thấy gì thì để trống chứ không đoán.
    Rủi ro 2: ngưỡng tin cậy ẩn các gợi ý yếu thay vì hiện ra, và bọn mình theo dõi
    mức khớp giữa việc đánh dấu và quyết định của nhân viên.
    Rủi ro 3: chỉ mục dựng từ một thư mục có phân quyền riêng, chủ dữ liệu duyệt trước
    mỗi lần lập lại chỉ mục. Không thu thập tự động.
    Mọi rủi ro: trưởng nhóm nào cũng tắt được tính năng từ trang quản trị, việc đó
    đưa hàng đợi về quy trình làm tay mà không mất dữ liệu.
  questions:
    - kind: mcq_read
      prompt_en: "Which risk does the author say decides whether they ship?"
      choices: ["Restricted documents being indexed", "Agents clicking through", "The model stating a policy that does not exist"]
      answer: 2
      difficulty: 3
      reading_skill: scan
      skill: Reading
    - kind: mcq_read
      prompt_en: "What is the written stop condition?"
      choices: ["Accuracy below 75% for a group for two consecutive weeks", "Any complaint from an agent", "Latency above two seconds"]
      answer: 0
      difficulty: 2
      reading_skill: scan
      skill: Reading
    - kind: mcq_read
      prompt_en: "Why is the stop condition written in advance?"
      choices: ["To satisfy the framework", "So the decision is made now rather than in the middle of an argument later", "To limit the budget"]
      answer: 1
      difficulty: 3
      reading_skill: skim
      skill: Reading
    - kind: mcq_read
      prompt_en: "How is the restricted-document risk controlled?"
      choices: ["Automatic crawling with filters", "Encryption at rest", "One folder with its own permissions, reviewed by the data owner before each re-index"]
      answer: 2
      difficulty: 3
      reading_skill: scan
      skill: Reading

writing:
  kind: GuidedEmail
  prompt_vi: >
    Viết phần rủi ro của một đề xuất AI: nêu rủi ro cao nhất kèm khả năng xảy ra
    và mức tác động, biện pháp giảm thiểu, và ai chịu trách nhiệm.
  prompt_en: "Write the risk section of an AI proposal."
  required_points:
    - "accountable"
    - "mitigation"
    - "in scope"
  hint_vi: "Mỗi rủi ro phải đi kèm ngay biện pháp giảm thiểu ở câu sau."
  sample_en: "In scope are internal tickets only, with no customer-facing replies and no HR data. The highest risk is that the model states a policy that does not exist and an agent repeats it: likelihood medium, impact high. The mitigation is that no answer is shown without a cited document section, and the service owner is accountable for every suggestion an agent sees."

