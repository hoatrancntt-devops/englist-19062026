explanation:
  why_vi: >
    Đề xuất AI bị treo ở vòng tuân thủ hầu như luôn vì cùng một lý do: nó mô tả
    kỹ hệ thống làm gì nhưng không nói ai chịu trách nhiệm khi nó sai, và không nói
    điều tệ nhất có thể xảy ra. Người duyệt không phản đối AI — họ chỉ không ký được
    vào một thứ mà trách nhiệm chưa có tên.
  how_vi: >
    Bốn mục theo NIST AI RMF. QUẢN TRỊ: nêu tên vai trò chịu trách nhiệm, và
    nêu chỗ có người kiểm. KHOANH VÙNG: nêu cả cái trong phạm vi lẫn cái ngoài phạm vi —
    phần ngoài phạm vi thường thuyết phục hơn. ĐO LƯỜNG: các số theo dõi hằng tuần,
    kèm một điều kiện dừng viết sẵn. KIỂM SOÁT: mỗi rủi ro một biện pháp,
    cộng một công tắc tắt mà người không phải kỹ sư cũng bấm được.
  contrast_vi: >
    "Hệ thống sẽ được kiểm thử và giám sát kỹ lưỡng" không có vai trò, không có số,
    không có ngưỡng. "Chủ dịch vụ chịu trách nhiệm; dưới 75% hai tuần liên tiếp thì tắt;
    trưởng nhóm nào cũng tắt được từ trang quản trị" cho người duyệt đúng ba thứ họ cần
    để ký: một cái tên, một con số, và một đường lui.

common_mistakes:
  - mistake: "Không nêu tên vai trò chịu trách nhiệm"
    why_vi: >
      Trong đầu người viết thì cả nhóm cùng chịu trách nhiệm, nghe rất hợp tác.
      Nhưng trách nhiệm chia đều là trách nhiệm không có ai, và người duyệt biết điều đó.
    fix_vi: "Viết một vai trò cụ thể: \"The service owner is accountable for ...\"."
    detect_phoneme_missing: []
  - mistake: "Chỉ nêu rủi ro, không nêu biện pháp giảm thiểu"
    why_vi: >
      Liệt kê rủi ro cảm giác như đã làm xong phần đánh giá. Nhưng danh sách rủi ro
      không có biện pháp chỉ làm người duyệt lo hơn và hoãn lâu hơn.
    fix_vi: "Mỗi rủi ro viết liền một câu \"Mitigation: ...\" ngay bên dưới."
    detect_phoneme_missing: []
  - mistake: "Bỏ qua điều kiện dừng"
    why_vi: >
      Viết điều kiện dừng cảm giác như thừa nhận đề xuất có thể thất bại.
      Nhưng đặt ngưỡng lúc chưa có áp lực dễ hơn nhiều so với lúc hệ thống đã chạy
      và có người bảo vệ nó.
    fix_vi: "Một câu: dưới ngưỡng X trong Y tuần thì tắt cho nhóm đó."
