memory_trick_vi: >
  Bốn mục RMF: QUẢN TRỊ (ai chịu trách nhiệm) — KHOANH VÙNG (trong và ngoài phạm vi) —
  ĐO LƯỜNG (số hằng tuần + điều kiện dừng) — KIỂM SOÁT (mỗi rủi ro một biện pháp + công tắc tắt).
  Người duyệt cần ba thứ: một cái tên, một con số, một đường lui.
