schema_version: 1
code: AI-04
slug: viet-de-xuat-va-danh-gia-rui-ro-ai
title_vi: "Viết đề xuất AI kèm đánh giá rủi ro"
title_en: "Writing an AI proposal and risk assessment"

layer: Professional
track: Ai
level: B1
unit_code: U-AI2
order_index: 4
estimated_minutes: 12
is_checkpoint: true

illustration: risk-matrix

objective_vi: >
  Viết đề xuất AI có đủ bốn phần theo NIST AI RMF — quản trị, khoanh vùng,
  đo lường, kiểm soát — để người duyệt biết ai chịu trách nhiệm khi máy sai.

objective_observable: >
  Đạt từ 80 điểm trên cả bốn trục kỹ năng, không trục nào dưới 65.

mastery_weights:
  Listening: 0.20
  Speaking: 0.20
  Reading: 0.25
  Writing: 0.35

prerequisites:
  - lesson: AI-03
    min_mastery: 70
    kind: Hard
  - lesson: AI-01
    min_mastery: 70
    kind: Hard
  - lesson: SEC-04
    min_mastery: 65
    kind: Soft

vocabulary:
  - term: "accountable"
    ipa: "/əˈkaʊntəbl/"
    meaning_vi: "người chịu trách nhiệm cuối cùng"
    chunk: "The service owner is accountable for the output."
    tags: [ai, core]
  - term: "in scope"
    ipa: "/ɪn skoʊp/"
    meaning_vi: "nằm trong phạm vi"
    chunk: "Only internal tickets are in scope."
    tags: [ai, core]
  - term: "human in the loop"
    ipa: "/ˈhjuːmən ɪn ðə luːp/"
    meaning_vi: "có người kiểm trong quy trình"
    chunk: "There is a human in the loop for every reply."
    tags: [ai, core]
  - term: "likelihood and impact"
    ipa: "/ˈlaɪklihʊd ænd ˈɪmpækt/"
    meaning_vi: "khả năng xảy ra và mức tác động"
    chunk: "We rate each risk by likelihood and impact."
    tags: [risk, core]
  - term: "mitigation"
    ipa: "/ˌmɪtɪˈɡeɪʃn/"
    meaning_vi: "biện pháp giảm thiểu"
    chunk: "The mitigation is a confidence threshold."
    tags: [risk, core]
  - term: "kill switch"
    ipa: "/kɪl swɪtʃ/"
    meaning_vi: "công tắc tắt ngay"
    chunk: "Any team lead can use the kill switch."
    tags: [risk, core]

sentence_patterns:
  - pattern: "{Role} is accountable for {thing}."
    meaning_vi: "{Role} chịu trách nhiệm về {thing}."
    slots:
      Role: ["The service owner", "The team lead", "The data owner"]
      thing: ["the output", "reviewing flagged answers", "what goes into the index"]
  - pattern: "Risk: {risk}. Mitigation: {mitigation}."
    meaning_vi: "Rủi ro: {risk}. Giảm thiểu: {mitigation}."
    slots:
      risk: ["the model invents a policy that does not exist", "a customer sees an unreviewed reply"]
      mitigation: ["every answer cites a source or is not shown", "a person approves before sending"]

dialogue:
  context_vi: >
    Chị Lan ở bộ phận tuân thủ đọc đề xuất của bạn. Chị không phản đối AI —
    chị chỉ cần biết ai chịu trách nhiệm khi nó sai.
  turns:
    - speaker: "Lan"
      en: "Your proposal is clear about what it does. Who is accountable when it gives a wrong answer?"
      vi: "Đề xuất của em rõ về việc nó làm gì. Ai chịu trách nhiệm khi nó trả lời sai?"
    - speaker: "You"
      en: "The service owner. The model never sends anything — it drafts, and a person approves before it goes out."
      vi: "Chủ dịch vụ ạ. Mô hình không gửi gì cả — nó soạn nháp, và người duyệt trước khi gửi đi."
    - speaker: "Lan"
      en: "What is in scope and what is not?"
      vi: "Cái gì nằm trong phạm vi, cái gì không?"
    - speaker: "You"
      en: "Internal tickets only. No customer-facing replies, no HR data, no anything that touches payroll."
      vi: "Chỉ ticket nội bộ. Không trả lời khách hàng, không dữ liệu nhân sự, không đụng gì tới lương."
    - speaker: "Lan"
      en: "And the worst thing that can happen?"
      vi: "Điều tệ nhất có thể xảy ra là gì?"
    - speaker: "You"
      en: "The model invents a policy that doesn't exist and an agent repeats it. That's the risk I rate highest."
      vi: "Mô hình bịa ra một chính sách không có thật và nhân viên nhắc lại. Đó là rủi ro em xếp cao nhất."
    - speaker: "Lan"
      en: "How do you reduce that?"
      vi: "Em giảm nó bằng cách nào?"
    - speaker: "You"
      en: "Every answer must cite a document section. If there is no source, the answer is not shown at all."
      vi: "Mọi câu trả lời phải dẫn được một mục tài liệu. Không có nguồn thì không hiện câu trả lời."
    - speaker: "Lan"
      en: "And if something goes wrong on a Saturday?"
      vi: "Nếu thứ Bảy có chuyện thì sao?"
    - speaker: "You"
      en: "Any team lead can turn it off from the admin page. It's one switch, and the system goes back to the manual process."
      vi: "Trưởng nhóm nào cũng tắt được từ trang quản trị. Một công tắc, và hệ thống quay về quy trình làm tay."

listening:
  context_vi: >
    Nghe hai đề xuất AI. Chú ý đề xuất nào trả lời được câu hỏi
    ai chịu trách nhiệm khi máy sai.
  speed: 1.2
  voice: en_US_male
  transcript_en: "Proposal one: the system will be carefully tested and monitored to ensure high quality and reliability for all users. Proposal two: the service owner is accountable for every answer that reaches a person. Scope is internal tickets only. The highest risk is the model inventing a policy, and the mitigation is that no answer is shown without a cited source. Any team lead can switch it off, which returns the team to the manual process."
  transcript_vi: "Đề xuất một: hệ thống sẽ được kiểm thử và giám sát kỹ lưỡng để đảm bảo chất lượng cao và độ tin cậy cho mọi người dùng. Đề xuất hai: chủ dịch vụ chịu trách nhiệm về mọi câu trả lời tới tay người dùng. Phạm vi chỉ là ticket nội bộ. Rủi ro cao nhất là mô hình bịa ra chính sách, và biện pháp giảm thiểu là không hiện câu trả lời nào thiếu nguồn dẫn. Trưởng nhóm nào cũng tắt được, việc đó đưa nhóm quay về quy trình làm tay."
  questions:
    - kind: mcq_listen
      prompt_vi: "Đề xuất hai nêu rõ ai chịu trách nhiệm?"
      choices: ["Chủ dịch vụ", "Nhóm phát triển", "Không nêu"]
      answer: 0
      difficulty: 2
      skill: Listening
    - kind: mcq_listen
      prompt_vi: "Biện pháp giảm rủi ro bịa chính sách là gì?"
      choices: ["Huấn luyện lại mô hình", "Giảm số câu hỏi", "Không hiện câu trả lời nào thiếu nguồn dẫn"]
      answer: 2
      difficulty: 2
      skill: Listening
    - kind: mcq_listen
      prompt_vi: "Vì sao đề xuất một khó qua vòng tuân thủ?"
      choices: ["Quá ngắn", "Không nói ai chịu trách nhiệm và điều tệ nhất có thể xảy ra", "Dùng quá nhiều số"]
      answer: 1
      difficulty: 3
      skill: Listening

