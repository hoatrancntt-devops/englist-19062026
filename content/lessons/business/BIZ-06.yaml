    difficulty: 2
    skill: Listening

explanation:
  why_vi: >
    Giao ban bằng tiếng Anh khó ở hai chỗ: cắt người lạc đề, và giao việc rõ ràng.
    Người Việt ngại cả hai — cắt lời sợ mất lòng, giao việc thì nói chung chung
    "nhờ anh xem giúp" để đỡ nghe như ra lệnh. Kết quả là buổi họp dài gấp đôi
    và tuần sau không ai nhớ ai phải làm gì.
  how_vi: >
    Mở đầu bằng giới hạn thời gian và số việc. Giao việc luôn đủ BA yếu tố trong một câu:
    "Can you take VIỆC GÌ by HẠN NÀO?" cộng "You're the owner." Ai lạc đề thì cắt bằng
    "Good point — let's take that offline" — vế đầu ghi nhận, vế sau dời chỗ.
    Kết mỗi phần bằng "Anything blocking you?"
  contrast_vi: >
    "Nhờ anh xem giúp cái này" không có hạn và không có người chịu trách nhiệm, nên
    tuần sau nó vẫn nằm đó. "Can you take this by Thursday? You're the owner" thì có cả hai.

common_mistakes:
  - mistake: "Giao việc không kèm hạn"
    why_vi: >
      Ngại ép người khác nên bỏ phần deadline. Nhưng việc không có hạn luôn xếp sau việc
      có hạn, và tới buổi giao ban sau nó vẫn ở nguyên chỗ cũ.
    fix_vi: "Luôn kèm hạn cụ thể: \"by end of day Thursday\", không dùng \"khi nào rảnh\"."
  - mistake: "Để người lạc đề nói hết cho lịch sự"
    why_vi: >
      Cắt lời bị coi là bất lịch sự trong văn hoá Việt. Nhưng trong buổi mười lăm phút,
      để một người nói mười phút là lấy mất phần của bốn người còn lại.
    fix_vi: "Dùng \"Good point — let's take that offline.\" Vế đầu là khen, nên không ai thấy bị cắt."
  - mistake: "Không chỉ định người chịu trách nhiệm khi có nhiều người liên quan"
    why_vi: >
      Nghĩ cả đội cùng lo là tinh thần tốt. Nhưng việc thuộc về cả đội là việc không
      thuộc về ai, và nó sẽ không xong.
    fix_vi: "Luôn nói rõ một cái tên: \"You're the owner.\" Người khác hỗ trợ, nhưng một người chịu."

memory_trick_vi: >
  Giao việc ba yếu tố trong một câu: VIỆC GÌ - HẠN NÀO - AI CHỊU.
  Lạc đề thì "Good point, let's take that offline". Kết thúc mỗi phần: "Anything blocking you?"
