explanation:
  why_vi: >
    Trong buổi review kiến trúc, người nghe không đánh giá phương án — họ đánh giá
    xem bạn có hiểu phương án của mình không. Người chỉ khen phương án mình chọn
    làm người nghe nghĩ một trong hai điều: bạn chưa xét phương án khác, hoặc bạn
    có xét nhưng đang giấu phần bất lợi. Cả hai đều khiến đề xuất bị chặn.
  how_vi: >
    Ba câu, theo đúng thứ tự: "We chose X over Y" — nêu cả cái không chọn.
    Rồi lý do có con số. Rồi "The trade-off is ... against ..." — nêu phần mất
    trước khi người khác chỉ ra. Nêu đánh đổi theo ít nhất hai trụ cột của
    Well-Architected, vì xét một trụ cột thì phương án nào cũng có vẻ thắng.
  contrast_vi: >
    "Kubernetes is the modern standard" là câu quảng cáo, người nghe không kiểm chứng được.
    "We run fourteen services and deploying by hand took a day a week" là con số,
    người nghe kiểm chứng được và tự thấy lý do. Con số thuyết phục, tính từ thì không.

common_mistakes:
  - mistake: "Chỉ nêu ưu điểm của phương án mình chọn"
    why_vi: >
      Tiếng Việt trong công ty thường coi việc tự nêu nhược điểm là làm yếu đề xuất.
      Trong buổi review tiếng Anh thì ngược lại: nêu ra nhược điểm chứng minh bạn đã xét kỹ.
    fix_vi: "Luôn thêm một câu \"The trade-off is ... against ...\" trước khi người khác hỏi."
    detect_phoneme_missing: []
  - mistake: "Lấy phổ biến làm lý do — \"ai cũng dùng cái này\""
    why_vi: >
      Đó là lý do dễ nói nhất khi chưa đo gì. Nhưng người nghe muốn biết nó hợp với
      bài toán của mình ở điểm nào, chứ không phải hợp với người khác ở điểm nào.
    fix_vi: "Thay bằng một con số của chính hệ thống mình: số dịch vụ, số phút, số tiền."
    detect_phoneme_missing: []
  - mistake: "Nói \"it depends\" rồi dừng lại"
    why_vi: >
      Câu này đúng nhưng chưa đủ. Dừng ở đó thì người nghe nghĩ bạn đang né câu hỏi.
    fix_vi: "Luôn nói tiếp phụ thuộc vào cái gì: \"It depends on how often the job runs.\""
    detect_phoneme_missing: []

memory_trick_vi: >
  Ba câu: CHỌN GÌ THAY VÌ GÌ — LÝ DO CÓ CON SỐ — ĐÁNH ĐỔI LÀ GÌ.
  Thiếu câu thứ ba thì đó là quảng cáo, không phải đề xuất kiến trúc.
