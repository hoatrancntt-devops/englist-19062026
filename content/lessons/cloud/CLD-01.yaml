vocabulary:
  - term: "trade-off"
    ipa: "/ˈtreɪd ɔːf/"
    meaning_vi: "sự đánh đổi — được cái này thì mất cái kia"
    chunk: "The trade-off is cost against control."
    tags: [cloud, core]
  - term: "we chose X over Y"
    ipa: "/wiː tʃoʊz ˈoʊvər/"
    meaning_vi: "chúng tôi chọn X thay vì Y"
    chunk: "We chose containers over plain VMs."
    tags: [cloud, core]
  - term: "operational overhead"
    ipa: "/ˌɒpəˈreɪʃənl ˈoʊvərhed/"
    meaning_vi: "công sức vận hành phải bỏ ra"
    chunk: "Serverless has the lowest operational overhead."
    tags: [cloud, core]
  - term: "lock-in"
    ipa: "/ˈlɒk ɪn/"
    meaning_vi: "bị buộc chặt vào một nhà cung cấp"
    chunk: "The downside is vendor lock-in."
    tags: [cloud, core]
  - term: "cold start"
    ipa: "/koʊld stɑːrt/"
    meaning_vi: "độ trễ lần gọi đầu khi hàm chưa sẵn sàng"
    chunk: "Cold start adds about two seconds."
    tags: [cloud, core]
  - term: "it depends on"
    ipa: "/ɪt dɪˈpendz ɒn/"
    meaning_vi: "còn tuỳ vào"
    chunk: "It depends on how often the job runs."
    tags: [discussion, core]

sentence_patterns:
  - pattern: "We chose {option} over {alternative} because {reason}."
    meaning_vi: "Chúng tôi chọn {option} thay vì {alternative} vì {reason}."
    slots:
      option: ["containers", "serverless functions", "plain VMs"]
      alternative: ["plain VMs", "Kubernetes", "containers"]
      reason: ["the team already knows it", "the traffic is very uneven", "we need full control of the OS"]
  - pattern: "The trade-off is {gain} against {loss}."
    meaning_vi: "Đánh đổi ở đây là {gain} đổi lấy {loss}."
    slots:
      gain: ["lower cost", "less operational overhead", "faster delivery"]
      loss: ["more vendor lock-in", "less control", "a harder debugging story"]

dialogue:
  context_vi: >
    Bạn đề xuất chạy một dịch vụ nội bộ trên serverless. Anh Dũng, kiến trúc sư,
    không phản đối — anh chỉ muốn nghe bạn nói ra phần bất lợi.
  turns:
    - speaker: "Dũng"
      en: "You want serverless for this. Tell me what we lose."
      vi: "Em muốn dùng serverless cho cái này. Nói anh nghe mình mất gì."
    - speaker: "You"
      en: "We lose some control. We can't tune the runtime, and cold start adds about two seconds on the first call."
      vi: "Mình mất một phần quyền kiểm soát. Không chỉnh được môi trường chạy, và cold start thêm khoảng hai giây ở lần gọi đầu."
    - speaker: "Dũng"
      en: "Two seconds. Is that acceptable for this service?"
      vi: "Hai giây. Với dịch vụ này thì chấp nhận được không?"
    - speaker: "You"
      en: "It is. It's an internal report job, nobody is waiting on the screen."
      vi: "Được ạ. Đây là job báo cáo nội bộ, không ai ngồi chờ trên màn hình."
    - speaker: "Dũng"
      en: "And what do we gain?"
      vi: "Còn được gì?"
    - speaker: "You"
      en: "Cost and operational overhead. It runs twice a day. On a VM we pay for twenty-four hours to use twenty minutes."
      vi: "Chi phí và công vận hành. Nó chạy hai lần một ngày. Trên VM thì mình trả tiền hai tư tiếng để dùng hai mươi phút."
    - speaker: "Dũng"
      en: "That's a real argument. The lock-in doesn't worry you?"
      vi: "Đó là lý lẽ thật. Chuyện lock-in em không lo à?"
    - speaker: "You"
      en: "A little. The business logic is in a plain library, so moving it later means rewriting the wrapper, not the logic."
      vi: "Có lo một chút. Nhưng logic nghiệp vụ nằm trong thư viện thường, nên sau này chuyển đi thì viết lại lớp bọc chứ không phải viết lại logic."

listening:
  context_vi: >
    Nghe hai người trình bày cùng một lựa chọn. Chú ý ai nói ra phần bất lợi
    và ai chỉ khen phương án mình chọn.
  speed: 1.1
  voice: en_US_male
  transcript_en: "First speaker: Kubernetes is the modern standard, it scales automatically, it's what everyone uses, and it will solve our deployment problems. Second speaker: we chose Kubernetes over plain VMs because we run fourteen services and deploying them by hand was taking a full day each week. The trade-off is that we now need someone who understands Kubernetes on call, and we don't have that person yet."
  transcript_vi: "Người thứ nhất: Kubernetes là chuẩn hiện đại, tự mở rộng, ai cũng dùng, và nó sẽ giải quyết vấn đề triển khai của mình. Người thứ hai: bọn tôi chọn Kubernetes thay vì VM thường vì đang chạy mười bốn dịch vụ và triển khai tay mất trọn một ngày mỗi tuần. Đánh đổi là giờ cần người hiểu Kubernetes trực máy, mà bọn tôi chưa có người đó."
  questions:
    - kind: mcq_listen
      prompt_vi: "Người thứ hai nêu con số nào để giải thích lý do?"
      choices: ["Mười bốn dịch vụ, mất một ngày mỗi tuần", "Hai giây cold start", "Không nêu con số nào"]
      answer: 0
      difficulty: 2
      skill: Listening
    - kind: mcq_listen
      prompt_vi: "Điểm khác nhau lớn nhất giữa hai cách trình bày?"
      choices: ["Người thứ hai nói to hơn", "Người thứ nhất dùng nhiều thuật ngữ hơn", "Người thứ hai nói ra cả phần bất lợi"]
      answer: 2
      difficulty: 2
      skill: Listening
    - kind: mcq_listen
      prompt_vi: "Người thứ hai thừa nhận điều gì chưa có?"
      choices: ["Ngân sách", "Người hiểu Kubernetes để trực", "Môi trường thử nghiệm"]
      answer: 1
      difficulty: 3
      skill: Listening

