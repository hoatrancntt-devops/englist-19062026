reading:
  kind: note
  context_vi: >
    Một ghi chú so sánh gửi trước buổi review. Đọc và tìm xem tác giả
    nêu đánh đổi theo mấy trụ cột của Well-Architected.
  text_en: |
    Deployment option for the monthly billing job

    The job runs twice a day for about twenty minutes. It reads from the
    warehouse, builds a PDF per customer, and drops the files on storage.
    Nobody waits on a screen while it runs.

    Option A - dedicated VM
    Full control of the OS and the runtime. We already have the patching
    pipeline for VMs, so this adds no new tooling. Cost is fixed at roughly
    forty dollars a month, and we use the machine for forty minutes a day.

    Option B - container on the shared cluster
    Cheaper than a dedicated VM because it shares nodes. Deployment goes
    through the pipeline the team uses for everything else. But the cluster
    is on-call territory, and a heavy billing run has starved a neighbouring
    service once before.

    Option C - serverless function
    Lowest cost, around four dollars a month, and no patching at all.
    Cold start adds two seconds, which does not matter here. The limits are
    real though: the platform caps a single execution at fifteen minutes,
    and our January run took eleven. That margin is thin.

    Recommendation
    Option C, with one condition. We split the run per region so no single
    execution goes near the fifteen-minute cap. This costs us reliability
    if the split logic is wrong, so the first three runs go out in parallel
    with the current VM job and we compare the output before switching over.

    Trade-off summary: we take cost optimization and operational excellence,
    and we accept a reliability risk that we mitigate by running both for a week.
  text_vi: |
    Phương án triển khai cho job xuất hoá đơn hàng tháng

    Job chạy hai lần một ngày, mỗi lần khoảng hai mươi phút. Nó đọc từ kho dữ liệu,
    dựng một file PDF cho mỗi khách hàng, rồi đẩy file lên bộ nhớ lưu trữ.
    Không ai ngồi chờ trên màn hình lúc nó chạy.

    Phương án A - máy ảo riêng
    Toàn quyền với hệ điều hành và môi trường chạy. Bọn mình đã có quy trình vá
    cho máy ảo nên phương án này không thêm công cụ mới nào. Chi phí cố định
    khoảng bốn mươi đô một tháng, và mình dùng máy bốn mươi phút mỗi ngày.

    Phương án B - container trên cụm dùng chung
    Rẻ hơn máy ảo riêng vì dùng chung node. Triển khai đi qua đúng quy trình
    mà cả nhóm đang dùng. Nhưng cụm đó thuộc phạm vi trực, và một lần chạy hoá đơn
    nặng đã từng làm đói tài nguyên một dịch vụ bên cạnh.

    Phương án C - hàm serverless
    Rẻ nhất, khoảng bốn đô một tháng, và không phải vá gì cả.
    Cold start thêm hai giây, ở đây không quan trọng. Nhưng giới hạn là có thật:
    nền tảng chặn một lần chạy ở mười lăm phút, mà lần chạy tháng Một mất mười một phút.
    Khoảng dư đó mỏng.

    Đề xuất
    Phương án C, kèm một điều kiện. Tách lần chạy theo từng khu vực để không lần nào
    tiến gần mốc mười lăm phút. Việc này khiến mình mất điểm về độ tin cậy nếu logic
    tách sai, nên ba lần chạy đầu sẽ chạy song song với job trên máy ảo hiện tại
    và bọn mình đối chiếu kết quả trước khi chuyển hẳn.

    Tóm tắt đánh đổi: mình lấy tối ưu chi phí và hiệu quả vận hành,
    và chấp nhận một rủi ro về độ tin cậy, giảm rủi ro đó bằng cách chạy song song một tuần.
  questions:
    - kind: mcq_read
      prompt_en: "Why is cold start acceptable for this job?"
      choices: ["It is under one second", "The platform removed cold starts", "Nobody waits on a screen while it runs"]
      answer: 2
      difficulty: 2
      reading_skill: scan
      skill: Reading
    - kind: mcq_read
      prompt_en: "What is the thin margin the note warns about?"
      choices: ["Eleven minutes against a fifteen-minute cap", "Forty dollars against four dollars", "Two seconds against one second"]
      answer: 0
      difficulty: 3
      reading_skill: scan
      skill: Reading
    - kind: mcq_read
      prompt_en: "How does the author reduce the reliability risk?"
      choices: ["By buying a bigger VM", "By running both jobs in parallel and comparing output", "By ignoring it"]
      answer: 1
      difficulty: 3
      reading_skill: skim
      skill: Reading
    - kind: mcq_read
      prompt_en: "Which Well-Architected pillars does the summary name?"
      choices: ["Security and sustainability", "Performance efficiency only", "Cost optimization and operational excellence"]
      answer: 2
      difficulty: 3
      reading_skill: skim
      skill: Reading

writing:
  kind: GuidedEmail
  prompt_vi: >
    Viết ba câu trình bày một lựa chọn triển khai: chọn gì thay vì gì, vì sao,
    và đánh đổi là gì.
  prompt_en: "Present a deployment choice in three sentences."
  required_points:
    - "we chose"
    - "over"
    - "trade-off"
  hint_vi: "Câu một nêu lựa chọn, câu hai nêu lý do có con số, câu ba nêu phần mất."
  sample_en: "We chose serverless functions over a dedicated VM because the job runs twice a day for twenty minutes and a VM sits idle the rest of the time. The trade-off is lower cost against a fifteen-minute execution cap that our January run came close to. We split the run per region to stay under it, and we will run both jobs in parallel for a week before switching."

