explanation:
  why_vi: >
    HA và DR trong tiếng Việt hay được gộp thành "dự phòng", nên khi nói tiếng Anh
    người ta lấy HA ra trả lời cho câu hỏi về DR. Người nghe hiểu là hệ thống
    chịu được mất cả vùng, trong khi thực tế không. Hiểu lầm này chỉ lộ ra
    đúng lúc mất vùng thật, và lúc đó thì đã muộn.
  how_vi: >
    Nhớ ranh giới: HA lo hỏng lẻ trong cùng một vùng, DR lo mất cả vùng.
    Khi được hỏi về DR, trả lời bằng đúng hai con số: RTO là bao lâu mới chạy lại,
    RPO là mất bao nhiêu dữ liệu. Và nếu chưa thử bao giờ thì nói ra —
    "we have never tested it" là câu khó nói nhưng cứu bạn về sau.
  contrast_vi: >
    "Bọn em có HA nên không sao" trả lời sang chuyện khác. "HA bảo vệ mình khỏi
    một node hỏng, không phải khỏi mất cả vùng — với mất vùng thì RTO bốn tiếng,
    RPO mười lăm phút" trả lời đúng câu hỏi và cho người nghe con số để quyết định.

common_mistakes:
  - mistake: "Lấy HA ra trả lời câu hỏi về DR"
    why_vi: >
      Cả hai đều là "dự phòng" trong đầu người nói, và HA là phần mình tự hào hơn
      nên bật ra trước. Nhưng nó tạo cảm giác an toàn sai.
    fix_vi: "Nghe kỹ phạm vi hỏng trong câu hỏi: một máy hay cả vùng. Trả lời đúng phạm vi đó."
    detect_phoneme_missing: []
  - mistake: "Đọc con số RTO trong tài liệu như thể đã kiểm chứng"
    why_vi: >
      Con số nằm sẵn trong kế hoạch nên nghe như sự thật. Nhưng nếu chưa diễn tập
      thì nó là ước lượng, và ước lượng DR thường lệch nhiều lần.
    fix_vi: "Thêm \"that number is an estimate, we have never tested a full failover\"."
    detect_phoneme_missing: []
  - mistake: "Nhầm RTO với RPO"
    why_vi: >
      Hai chữ viết tắt gần giống nhau và đều tính bằng thời gian.
    fix_vi: "RTO là Time — bao lâu mới chạy lại. RPO là Point — lùi về mốc nào, tức mất bao nhiêu dữ liệu."
    detect_phoneme_missing: []

memory_trick_vi: >
  HA = một máy chết. DR = cả vùng chết. Hỏi về vùng thì trả lời bằng hai số:
  RTO (bao lâu chạy lại) và RPO (mất bao nhiêu dữ liệu). Chưa thử thì phải nói chưa thử.
