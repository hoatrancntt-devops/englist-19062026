reading:
  kind: note
  context_vi: >
    Bảng tóm tắt khả năng chịu lỗi gửi cho ban lãnh đạo. Đọc và tìm chỗ
    tác giả thừa nhận điều chưa kiểm chứng.
  text_en: |
    Resilience summary - order service

    What we survive without anyone waking up
    One application node failing. We run three nodes behind a load balancer
    and the health check pulls a bad node out in about thirty seconds.
    One database disk failing. The storage layer is mirrored.

    What wakes someone up but keeps the data safe
    The primary database failing. The standby is promoted manually because
    an automatic promotion once split the cluster in two. RTO for this is
    twenty minutes, and it has been tested three times this year.

    What we are not ready for
    Losing the whole region. We ship backups to a second region every
    fifteen minutes, so our RPO there is fifteen minutes. The written plan
    puts RTO at four hours, but that number is an estimate. We have never
    run a full region failover, so treat four hours as untested.

    What this costs
    The three nodes and the standby cost about two hundred dollars a month.
    A warm second region would cut the four hours to under one hour and
    would cost roughly nine hundred a month. That decision is not ours to
    make - it depends on how much one hour of downtime costs the business.
  text_vi: |
    Tóm tắt khả năng chịu lỗi - dịch vụ đơn hàng

    Những gì mình chịu được mà không ai phải dậy
    Một node ứng dụng hỏng. Bọn mình chạy ba node sau bộ cân tải và
    kiểm tra sức khoẻ sẽ loại node hỏng ra trong khoảng ba mươi giây.
    Một ổ đĩa của cơ sở dữ liệu hỏng. Lớp lưu trữ có gương.

    Những gì làm ai đó phải dậy nhưng dữ liệu vẫn an toàn
    Cơ sở dữ liệu chính hỏng. Bản dự phòng được nâng lên bằng tay vì
    một lần nâng tự động đã làm cụm tách làm đôi. RTO cho việc này là
    hai mươi phút, và đã thử ba lần trong năm nay.

    Những gì mình chưa sẵn sàng
    Mất cả vùng. Bọn mình đẩy bản sao lưu sang vùng thứ hai mỗi
    mười lăm phút, nên RPO ở đó là mười lăm phút. Kế hoạch viết sẵn
    ghi RTO bốn tiếng, nhưng con số đó là ước lượng. Bọn mình chưa bao giờ
    chạy thử chuyển vùng toàn phần, nên hãy coi bốn tiếng là chưa kiểm chứng.

    Chi phí
    Ba node và bản dự phòng tốn khoảng hai trăm đô một tháng.
    Một vùng thứ hai luôn sẵn sàng sẽ rút bốn tiếng xuống dưới một tiếng và
    tốn khoảng chín trăm một tháng. Quyết định đó không thuộc bọn mình -
    nó tuỳ vào một tiếng ngừng chạy làm doanh nghiệp mất bao nhiêu.
  questions:
    - kind: mcq_read
      prompt_en: "Why is the database standby promoted manually?"
      choices: ["To save money", "The team prefers manual work", "An automatic promotion once split the cluster in two"]
      answer: 2
      difficulty: 3
      reading_skill: scan
      skill: Reading
    - kind: mcq_read
      prompt_en: "Which number is explicitly marked as untested?"
      choices: ["The four-hour RTO for a region loss", "The twenty-minute RTO", "The fifteen-minute RPO"]
      answer: 0
      difficulty: 3
      reading_skill: scan
      skill: Reading
    - kind: mcq_read
      prompt_en: "Why does the author say the warm-region decision is not theirs?"
      choices: ["They lack permission to spend", "It depends on what an hour of downtime costs the business", "The vendor decides"]
      answer: 1
      difficulty: 3
      reading_skill: skim
      skill: Reading

writing:
  kind: GuidedEmail
  prompt_vi: >
    Viết ba câu trả lời câu hỏi "nếu mất cả vùng thì sao": nêu cách khôi phục,
    nêu RTO và RPO, và nói rõ phần nào chưa thử.
  prompt_en: "Answer what happens if we lose the whole region."
  required_points:
    - "restore"
    - "rto"
    - "never tested"
  hint_vi: "Đừng nhắc HA ở đây — câu hỏi này không phải về HA."
  sample_en: "If we lose the whole region we restore in the second region from backups that ship every fifteen minutes. Our RPO is fifteen minutes and the written RTO is four hours. That RTO is an estimate because we have never tested a full region failover, so I would like to schedule one this quarter."

