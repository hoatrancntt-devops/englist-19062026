vocabulary:
  - term: "high availability"
    ipa: "/haɪ əˌveɪləˈbɪləti/"
    meaning_vi: "sẵn sàng cao — chịu được hỏng lẻ mà không gián đoạn"
    chunk: "High availability handles a single node failure."
    emoji: "🔁"
    mnemonic_vi: "Viết tắt \"HA\". Lo chuyện MỘT máy chết trong khi các máy khác vẫn chạy. Phạm vi nhỏ, tự động, không ai phải thức dậy."
    tags: [cloud, core]
  - term: "disaster recovery"
    ipa: "/dɪˈzɑːstər rɪˈkʌvəri/"
    meaning_vi: "khôi phục thảm hoạ — khi mất cả một vùng"
    chunk: "Disaster recovery is for losing the whole region."
    emoji: "🌊"
    mnemonic_vi: "Viết tắt \"DR\". Cặp đối với HA: HA lo một máy chết, DR lo CẢ TRUNG TÂM DỮ LIỆU chìm. Lẫn hai khái niệm này là lỗi phổ biến nhất khi thiết kế."
    tags: [cloud, core]
  - term: "fail over"
    ipa: "/feɪl ˈoʊvər/"
    meaning_vi: "chuyển sang hệ dự phòng"
    chunk: "It fails over to the second node automatically."
    emoji: "🔀"
    mnemonic_vi: "Ôn lại: HỎNG THÌ NGÃ SANG bên kia. Viết rời là động từ, viết liền \"failover\" là danh từ."
    tags: [cloud, core]
  - term: "RTO"
    ipa: "/ɑːr tiː ˈoʊ/"
    meaning_vi: "thời gian tối đa được phép chết trước khi chạy lại"
    chunk: "Our RTO is four hours."
    emoji: "⏱️"
    mnemonic_vi: "Ôn lại: chữ T là TIME, nhìn về tương lai — bao lâu nữa thì chạy lại."
    tags: [cloud, core]
  - term: "RPO"
    ipa: "/ɑːr piː ˈoʊ/"
    meaning_vi: "lượng dữ liệu tối đa được phép mất, tính bằng thời gian"
    chunk: "Our RPO is fifteen minutes."
    emoji: "💾"
    mnemonic_vi: "Ôn lại: chữ P là POINT, nhìn về quá khứ — mất dữ liệu của bao nhiêu phút vừa rồi."
    tags: [cloud, core]
  - term: "we have never tested it"
    ipa: "/wiː hæv ˈnevər ˈtestɪd ɪt/"
    meaning_vi: "bọn tôi chưa bao giờ thử nó"
    chunk: "We have a DR plan, but we have never tested it."
    emoji: "😬"
    mnemonic_vi: "Câu khó nói nhất nhưng đáng giá nhất trong bài. Nói ra sớm thì còn kịp sửa; giấu tới lúc thảm hoạ thật thì bản kế hoạch chỉ là tờ giấy."
    tags: [honesty, core]

sentence_patterns:
  - pattern: "Our RTO is {time} and our RPO is {time2}."
    meaning_vi: "RTO của bọn tôi là {time} và RPO là {time2}."
    slots:
      time: ["four hours", "one hour", "thirty minutes"]
      time2: ["fifteen minutes", "five minutes", "one hour"]
  - pattern: "{Feature} protects us from {failure}, not from {other}."
    meaning_vi: "{Feature} bảo vệ mình khỏi {failure}, không phải khỏi {other}."
    slots:
      Feature: ["High availability", "The standby replica", "The nightly backup"]
      failure: ["a single node failure", "one disk dying"]
      other: ["losing the whole region", "someone deleting the data"]

dialogue:
  context_vi: >
    Giám đốc hỏi về khả năng chịu lỗi của hệ thống mới. Bạn phải phân biệt
    rõ HA và DR, và phải trung thực về phần chưa thử.
  turns:
    - speaker: "Giám đốc"
      en: "If a server dies at midnight, does the system keep running?"
      vi: "Nếu một máy chủ chết lúc nửa đêm, hệ thống vẫn chạy chứ?"
    - speaker: "You"
      en: "Yes. We run two nodes behind a load balancer. It fails over in about thirty seconds and nobody has to wake up."
      vi: "Vâng. Bọn em chạy hai node sau bộ cân tải. Nó tự chuyển trong khoảng ba mươi giây và không ai phải dậy."
    - speaker: "Giám đốc"
      en: "And if the whole data centre goes down?"
      vi: "Còn nếu cả trung tâm dữ liệu sập thì sao?"
    - speaker: "You"
      en: "That's a different problem. High availability protects us from one node failing, not from losing the region."
      vi: "Đó là vấn đề khác. HA bảo vệ mình khỏi một node hỏng, không phải khỏi mất cả vùng."
    - speaker: "Giám đốc"
      en: "So what happens then?"
      vi: "Vậy lúc đó thì sao?"
    - speaker: "You"
      en: "We restore in the second region from backups. Our RTO is four hours and our RPO is fifteen minutes."
      vi: "Bọn em khôi phục ở vùng thứ hai từ bản sao lưu. RTO là bốn tiếng và RPO là mười lăm phút."
    - speaker: "Giám đốc"
      en: "Four hours. Have you actually done that?"
      vi: "Bốn tiếng. Các em đã thực sự làm thử chưa?"
    - speaker: "You"
      en: "We have the plan written down, but we have never tested a full region failover. I'd like to schedule one this quarter."
      vi: "Bọn em có kế hoạch viết sẵn, nhưng chưa bao giờ thử chuyển vùng toàn phần. Em muốn xếp lịch thử trong quý này."

listening:
  context_vi: >
    Nghe hai câu trả lời cho cùng một câu hỏi. Chú ý câu nào trả lời đúng
    câu được hỏi và câu nào trả lời sang chuyện khác.
  speed: 1.1
  voice: en_US_female
  transcript_en: "The question was: what happens if we lose the whole region? Answer one: we have high availability, we run three nodes, so we are fine. Answer two: high availability does not help there, it only covers a single node failing. For a region loss we restore from backups in the second region. That takes about four hours, and we may lose up to fifteen minutes of data."
  transcript_vi: "Câu hỏi là: chuyện gì xảy ra nếu mất cả vùng? Trả lời một: bọn tôi có HA, chạy ba node, nên không sao. Trả lời hai: HA không giúp được ở đây, nó chỉ lo trường hợp một node hỏng. Mất cả vùng thì bọn tôi khôi phục từ bản sao lưu ở vùng thứ hai. Việc đó mất khoảng bốn tiếng, và có thể mất tới mười lăm phút dữ liệu."
  questions:
    - kind: mcq_listen
      prompt_vi: "Câu trả lời nào trả lời đúng câu được hỏi?"
      choices: ["Trả lời hai", "Trả lời một", "Cả hai đều đúng"]
      answer: 0
      difficulty: 2
      skill: Listening
    - kind: mcq_listen
      prompt_vi: "Hai con số nào được nêu trong câu trả lời thứ hai?"
      choices: ["Ba node và hai vùng", "Ba mươi giây và một tiếng", "Bốn tiếng và mười lăm phút"]
      answer: 2
      difficulty: 2
      skill: Listening
    - kind: mcq_listen
      prompt_vi: "Vì sao câu trả lời một sai?"
      choices: ["Vì nói quá ngắn", "Vì lấy HA ra trả lời cho câu hỏi về mất cả vùng", "Vì không nêu tên nhà cung cấp"]
      answer: 1
      difficulty: 3
      skill: Listening

