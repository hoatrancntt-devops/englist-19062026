schema_version: 1
code: CLD-03
slug: noi-ve-scaling-va-chi-phi
title_vi: "Nói về scaling và chi phí — khi kế toán hỏi hoá đơn tăng"
title_en: "Talking about scaling and cost"

layer: Professional
track: Cloud
level: B1
unit_code: U-CLD1
order_index: 3
estimated_minutes: 12
is_checkpoint: false

illustration: scale-graph

objective_vi: >
  Giải thích được vì sao hoá đơn cloud tăng, bằng cách chỉ ra thứ gây tốn
  chứ không bằng cách hứa sẽ tiết kiệm.

objective_observable: >
  Đạt từ 75 điểm trên cả bốn trục kỹ năng, không trục nào dưới 60.

mastery_weights:
  Listening: 0.25
  Speaking: 0.30
  Reading: 0.25
  Writing: 0.20

prerequisites:
  - lesson: CLD-01
    min_mastery: 70
    kind: Hard
  - lesson: OFF-04
    min_mastery: 65
    kind: Soft

vocabulary:
  - term: "scale out"
    ipa: "/skeɪl aʊt/"
    meaning_vi: "thêm máy chạy song song"
    chunk: "We scale out to six instances at peak."
    emoji: "↔️"
    mnemonic_vi: "\"out\" là RA NGANG — bày thêm nhiều máy nằm cạnh nhau. Như mở thêm quầy thu ngân trong siêu thị."
    tags: [cloud, core]
  - term: "scale up"
    ipa: "/skeɪl ʌp/"
    meaning_vi: "làm máy hiện tại to hơn"
    chunk: "Scaling up is simpler but hits a ceiling."
    emoji: "↕️"
    mnemonic_vi: "\"up\" là LÊN CAO — một máy to dần lên. Như thuê một thu ngân làm nhanh gấp đôi. Dễ làm hơn nhưng có TRẦN: máy to nhất cũng chỉ tới thế."
    tags: [cloud, core]
  - term: "peak"
    ipa: "/piːk/"
    meaning_vi: "giờ cao điểm"
    chunk: "Traffic peaks between nine and eleven."
    emoji: "⛰️"
    mnemonic_vi: "\"peak\" là ĐỈNH NÚI. Điểm cao nhất của đồ thị lưu lượng. Dùng được cả làm danh từ lẫn động từ."
    tags: [cloud, core]
  - term: "the biggest line item"
    ipa: "/ðə ˈbɪɡɪst laɪn ˈaɪtəm/"
    meaning_vi: "khoản lớn nhất trong hoá đơn"
    chunk: "The biggest line item is egress traffic."
    emoji: "🧾"
    mnemonic_vi: "\"line item\" là MỘT DÒNG trong hoá đơn. Muốn cắt chi phí thì nhìn dòng to nhất trước, đừng ngồi tối ưu mấy dòng lẻ."
    tags: [cost, core]
  - term: "egress"
    ipa: "/ˈiːɡres/"
    meaning_vi: "dữ liệu đi ra khỏi nhà cung cấp, thường bị tính tiền"
    chunk: "Egress costs more than storage here."
    emoji: "📤"
    mnemonic_vi: "Cùng gốc với \"exit\" — LỐI RA. Bẫy tiền lớn nhất của điện toán đám mây: đưa dữ liệu VÀO thì miễn phí, lấy RA mới tính tiền."
    tags: [cost, core]
  - term: "idle"
    ipa: "/ˈaɪdl/"
    meaning_vi: "chạy không, không làm gì mà vẫn tính tiền"
    chunk: "Four machines sit idle overnight."
    emoji: "😴"
    mnemonic_vi: "\"idle\" nghe giống \"idol\" (thần tượng) nhưng nghĩa ngược hẳn: ngồi không. Như xe nổ máy đứng yên vẫn tốn xăng."
    tags: [cost, core]
  - term: "we can cut X by Y"
    ipa: "/wiː kæn kʌt/"
    meaning_vi: "chúng tôi có thể giảm X đi Y"
    chunk: "We can cut the bill by about thirty percent."
    emoji: "✂️"
    mnemonic_vi: "Giới từ \"by\" chỉ MỨC GIẢM (giảm đi 30%), còn \"to\" chỉ MỨC CÒN LẠI (giảm xuống còn 30%). Nhầm hai chữ này là sai gấp đôi con số."
    tags: [cost, core]

sentence_patterns:
  - pattern: "The biggest line item is {item}, about {percent} of the bill."
    meaning_vi: "Khoản lớn nhất là {item}, khoảng {percent} hoá đơn."
    slots:
      item: ["egress traffic", "idle compute", "storage snapshots"]
      percent: ["forty percent", "half", "a third"]
  - pattern: "We can cut {thing} by {amount} if we {action}."
    meaning_vi: "Bọn tôi giảm được {thing} đi {amount} nếu {action}."
    slots:
      thing: ["the bill", "idle time", "egress"]
      amount: ["thirty percent", "half", "two hundred dollars a month"]
      action: ["shut down test machines at night", "cache responses at the edge"]

dialogue:
  context_vi: >
    Chị Hằng ở phòng kế toán thấy hoá đơn cloud tháng này tăng bốn mươi phần trăm
    và muốn hiểu vì sao. Chị không rành kỹ thuật.
  turns:
    - speaker: "Hằng"
      en: "The cloud bill went up forty percent last month. What happened?"
      vi: "Hoá đơn cloud tháng trước tăng bốn mươi phần trăm. Có chuyện gì vậy em?"
    - speaker: "You"
      en: "Two things. I looked at the breakdown this morning. The biggest line item is egress traffic."
      vi: "Có hai chuyện ạ. Sáng nay em xem bảng chi tiết rồi. Khoản lớn nhất là lưu lượng đi ra."
    - speaker: "Hằng"
      en: "Egress? What is that in plain words?"
      vi: "Egress là gì, nói dễ hiểu giúp chị."
    - speaker: "You"
      en: "Data leaving the provider. We started sending the daily report file to a partner, and each file is four gigabytes."
      vi: "Là dữ liệu đi ra khỏi nhà cung cấp. Bọn em bắt đầu gửi file báo cáo hằng ngày cho đối tác, mỗi file bốn gigabyte."
    - speaker: "Hằng"
      en: "And the second thing?"
      vi: "Còn chuyện thứ hai?"
    - speaker: "You"
      en: "Test machines. We scaled out for the load test in March and four machines stayed running. They sit idle every night."
      vi: "Máy thử nghiệm. Bọn em thêm máy để chạy kiểm thử tải hồi tháng Ba, và bốn máy cứ chạy tiếp. Đêm nào chúng cũng chạy không."
    - speaker: "Hằng"
      en: "Can you fix both?"
      vi: "Em xử lý được cả hai không?"
    - speaker: "You"
      en: "The idle machines yes, this week. We can cut the bill by about a quarter. The egress needs a decision — we can compress the file, but the partner has to accept the new format."
      vi: "Máy chạy không thì được ạ, tuần này. Giảm được khoảng một phần tư hoá đơn. Còn egress thì cần quyết định — nén file được, nhưng đối tác phải chấp nhận định dạng mới."

listening:
  context_vi: >
    Nghe hai cách trả lời câu hỏi vì sao hoá đơn tăng. Chú ý cách nào
    cho người nghe cơ sở để quyết định.
  speed: 1.1
  voice: en_US_female
  transcript_en: "Answer one: the cloud is expensive and prices went up, but we will try to optimize and reduce it next month. Answer two: forty percent of the increase is egress traffic from a new daily file we send to a partner, and a quarter is four test machines left running since March. I can shut the test machines down this week. The file needs the partner to accept a compressed format."
  transcript_vi: "Trả lời một: cloud đắt và giá tăng, nhưng bọn tôi sẽ cố tối ưu và giảm xuống tháng sau. Trả lời hai: bốn mươi phần trăm phần tăng là lưu lượng đi ra từ một file hằng ngày mới gửi cho đối tác, và một phần tư là bốn máy thử nghiệm để chạy từ tháng Ba. Tôi có thể tắt máy thử nghiệm trong tuần này. Còn cái file thì cần đối tác chấp nhận định dạng nén."
  questions:
    - kind: mcq_listen
      prompt_vi: "Câu trả lời nào cho người nghe cơ sở để quyết định?"
      choices: ["Trả lời hai", "Trả lời một", "Cả hai như nhau"]
      answer: 0
      difficulty: 1
      skill: Listening
    - kind: mcq_listen
      prompt_vi: "Phần nào người nói tự xử lý được ngay?"
      choices: ["File gửi đối tác", "Cả hai", "Bốn máy thử nghiệm chạy không"]
      answer: 2
      difficulty: 2
      skill: Listening
    - kind: mcq_listen
      prompt_vi: "Vì sao phần egress cần người khác quyết?"
      choices: ["Vì tốn nhiều tiền hơn", "Vì đối tác phải chấp nhận định dạng nén", "Vì cần mua thêm băng thông"]
      answer: 1
      difficulty: 3
      skill: Listening

