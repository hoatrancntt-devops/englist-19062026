explanation:
  why_vi: >
    Khi bị hỏi về hoá đơn, phản xạ thường là hứa: "để em tối ưu lại". Câu đó
    nghe có trách nhiệm nhưng không cho người nghe thứ gì. Kế toán và quản lý
    không cần lời hứa — họ cần biết tiền đi đâu, ai cắt được, và cắt được bao nhiêu.
    Hứa mà không có con số thì tháng sau bị hỏi lại đúng câu cũ.
  how_vi: >
    Ba câu. Câu một: khoản lớn nhất là gì, kèm số tiền hoặc phần trăm.
    Câu hai: việc bạn tự làm được, kèm số tiền tiết kiệm và mốc thời gian.
    Câu ba: việc cần người khác quyết, và nói rõ ai quyết. Tách hai loại việc này
    là phần quan trọng nhất — nó cho người nghe biết chỗ nào cần họ.
  contrast_vi: >
    "Cloud đắt, để em tối ưu" đẩy vấn đề sang tháng sau. "Bốn mươi phần trăm
    phần tăng là egress từ file gửi đối tác; em cắt được 320 đô tuần này bằng cách
    gỡ bốn máy chạy không; nén file tiết kiệm thêm 560 nhưng cần đối tác đồng ý"
    cho người nghe ba quyết định rõ ràng ngay trong cuộc nói chuyện.

common_mistakes:
  - mistake: "Trả lời bằng lời hứa tối ưu thay vì bằng khoản chi cụ thể"
    why_vi: >
      Nói ra con số cảm giác như nhận lỗi, nên người ta né sang lời hứa.
      Nhưng lời hứa không kiểm chứng được và tháng sau vẫn bị hỏi lại.
    fix_vi: "Mở bằng \"The biggest line item is ...\" kèm số tiền."
    detect_phoneme_missing: []
  - mistake: "Gộp việc mình làm được với việc cần người khác quyết"
    why_vi: >
      Trong đầu người nói cả hai đều là "việc phải làm". Nhưng người nghe
      chỉ hành động khi biết rõ chỗ nào cần đến họ.
    fix_vi: "Nói rõ: cái này em làm tuần này, cái kia cần đối tác hoặc sếp đồng ý."
    detect_phoneme_missing: []
  - mistake: "Cắt khoản chi liên quan tới tuân thủ mà chưa hỏi lại yêu cầu"
    why_vi: >
      Khoản đó thường dễ cắt về mặt kỹ thuật nên nhìn như quả ngọt.
      Nhưng tiết kiệm vài trăm đô không bù được một phát hiện kiểm toán.
    fix_vi: "Xin yêu cầu bằng văn bản trước, rồi mới cắt."
    detect_phoneme_missing: []

memory_trick_vi: >
  Ba câu: KHOẢN LỚN NHẤT LÀ GÌ — EM CẮT ĐƯỢC BAO NHIÊU, KHI NÀO — CÁI GÌ CẦN NGƯỜI KHÁC QUYẾT.
  "Để em tối ưu lại" không phải câu trả lời, đó là lời hoãn.
