reading:
  kind: note
  context_vi: >
    Bản phân tích hoá đơn gửi kèm email cho quản lý. Đọc và tìm khoản nào
    tốn nhất mà lại dễ cắt nhất.
  text_en: |
    Cloud bill review - March to April

    Total went from 3,100 to 4,350 dollars. Three things moved.

    Egress traffic: 180 to 720 dollars
    We began sending the daily settlement file to the partner on 4 April.
    Each file is 4 GB and goes out once a day, so 120 GB a month leaves
    the provider. Compressing the file would bring it to roughly 900 MB,
    which would cut this line to about 160 dollars. The partner's system
    must accept gzip first, so this needs their sign-off, not just our change.

    Idle compute: 240 to 560 dollars
    Four machines were added for the March load test and never removed.
    They run twenty-four hours a day and do nothing. Removing them is a
    one-line change and saves 320 dollars a month with no discussion needed.

    Snapshots: 90 to 310 dollars
    The nightly snapshot retention was changed from 7 days to 90 days in
    February to satisfy an audit question. Nobody has restored from a
    snapshot older than 4 days in two years. Before cutting this, we should
    ask whether the audit answer actually required 90 days or whether
    someone picked a safe-looking number.

    Recommendation
    Remove the idle machines this week. Raise the gzip question with the
    partner. Do not touch snapshot retention until we have the audit
    requirement in writing - saving 200 dollars is not worth guessing
    about a compliance answer.
  text_vi: |
    Rà soát hoá đơn cloud - tháng Ba sang tháng Tư

    Tổng tăng từ 3.100 lên 4.350 đô. Có ba khoản thay đổi.

    Lưu lượng đi ra: 180 lên 720 đô
    Bọn mình bắt đầu gửi file đối soát hằng ngày cho đối tác từ 4 tháng Tư.
    Mỗi file 4 GB, ngày một lần, nên 120 GB mỗi tháng rời khỏi nhà cung cấp.
    Nén file lại còn khoảng 900 MB, đưa khoản này xuống chừng 160 đô.
    Hệ thống đối tác phải chấp nhận gzip trước, nên việc này cần họ đồng ý,
    không chỉ là bọn mình đổi.

    Máy chạy không: 240 lên 560 đô
    Bốn máy được thêm cho đợt kiểm thử tải tháng Ba và không bị gỡ.
    Chúng chạy hai tư tiếng mỗi ngày mà không làm gì. Gỡ đi là sửa một dòng
    và tiết kiệm 320 đô một tháng, không cần bàn bạc gì.

    Ảnh chụp: 90 lên 310 đô
    Thời gian giữ ảnh chụp hằng đêm được đổi từ 7 ngày lên 90 ngày hồi
    tháng Hai để trả lời một câu hỏi kiểm toán. Hai năm nay chưa ai khôi phục
    từ ảnh chụp cũ hơn 4 ngày. Trước khi cắt, nên hỏi xem câu trả lời kiểm toán
    có thực sự yêu cầu 90 ngày không, hay ai đó chọn một con số nhìn cho an toàn.

    Đề xuất
    Gỡ máy chạy không trong tuần này. Nêu chuyện gzip với đối tác.
    Đừng động vào thời gian giữ ảnh chụp cho tới khi có yêu cầu kiểm toán
    bằng văn bản - tiết kiệm 200 đô không đáng để đoán mò về một câu trả lời tuân thủ.
  questions:
    - kind: mcq_read
      prompt_en: "Which change saves money with no discussion needed?"
      choices: ["Compressing the partner file", "Cutting snapshot retention", "Removing the four idle machines"]
      answer: 2
      difficulty: 2
      reading_skill: scan
      skill: Reading
    - kind: mcq_read
      prompt_en: "Why does the author refuse to cut snapshot retention now?"
      choices: ["The audit requirement is not in writing yet", "It saves too little", "Snapshots cannot be changed"]
      answer: 0
      difficulty: 3
      reading_skill: skim
      skill: Reading
    - kind: mcq_read
      prompt_en: "What must happen before the file can be compressed?"
      choices: ["The provider must lower prices", "The partner's system must accept gzip", "The file must be split"]
      answer: 1
      difficulty: 2
      reading_skill: scan
      skill: Reading

writing:
  kind: GuidedEmail
  prompt_vi: >
    Viết ba câu trả lời câu hỏi vì sao hoá đơn tăng: nêu khoản lớn nhất,
    nêu việc bạn cắt được ngay kèm số tiền, và nêu việc cần người khác quyết.
  prompt_en: "Explain a cloud bill increase in three sentences."
  required_points:
    - "biggest line item"
    - "we can cut"
    - "needs"
  hint_vi: "Đừng hứa \"sẽ tối ưu\". Nêu đúng thứ gây tốn và số tiền cắt được."
  sample_en: "The biggest line item is egress traffic, which went from 180 to 720 dollars after we started sending a 4 GB file to the partner every day. We can cut 320 dollars a month this week by removing four test machines that have been idle since March. Compressing the partner file would save another 560, but it needs the partner to accept gzip, so I have asked them."

