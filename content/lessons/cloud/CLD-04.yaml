schema_version: 1
code: CLD-04
slug: du-buoi-review-kien-truc
title_vi: "Dự buổi review kiến trúc — trả lời câu hỏi khó mà không chống chế"
title_en: "Taking part in an architecture review"

layer: Professional
track: Cloud
level: B1
unit_code: U-CLD2
order_index: 4
estimated_minutes: 12
is_checkpoint: true

illustration: architecture-review

objective_vi: >
  Trình bày thiết kế của mình trong buổi review, nêu đánh đổi theo ít nhất
  hai trụ cột, và trả lời câu hỏi phản biện mà không chuyển sang chống chế.

objective_observable: >
  Đạt từ 80 điểm trên cả bốn trục kỹ năng, không trục nào dưới 65.

mastery_weights:
  Listening: 0.25
  Speaking: 0.35
  Reading: 0.20
  Writing: 0.20

prerequisites:
  - lesson: CLD-03
    min_mastery: 70
    kind: Hard
  - lesson: CLD-02
    min_mastery: 70
    kind: Hard
  - lesson: OFF-10
    min_mastery: 65
    kind: Soft

vocabulary:
  - term: "that's a fair point"
    ipa: "/ðæts ə fer pɔɪnt/"
    meaning_vi: "ý đó xác đáng"
    chunk: "That's a fair point, I hadn't measured that."
    tags: [review, core]
  - term: "I hadn't considered"
    ipa: "/aɪ ˈhædnt kənˈsɪdərd/"
    meaning_vi: "tôi chưa tính tới"
    chunk: "I hadn't considered the backup window."
    tags: [review, core]
  - term: "let me check and come back"
    ipa: "/let miː tʃek ænd kʌm bæk/"
    meaning_vi: "để tôi kiểm rồi trả lời lại"
    chunk: "I don't know. Let me check and come back to you."
    tags: [review, core]
  - term: "the constraint is"
    ipa: "/ðə kənˈstreɪnt ɪz/"
    meaning_vi: "ràng buộc ở đây là"
    chunk: "The constraint is the vendor's API rate limit."
    tags: [review, core]
  - term: "we ruled out"
    ipa: "/wiː ruːld aʊt/"
    meaning_vi: "chúng tôi đã loại phương án"
    chunk: "We ruled out Kubernetes because nobody can run it on call."
    tags: [review, core]
  - term: "reversible"
    ipa: "/rɪˈvɜːrsəbl/"
    meaning_vi: "quay lại được nếu sai"
    chunk: "This decision is reversible in one sprint."
    tags: [review, core]

sentence_patterns:
  - pattern: "We ruled out {option} because {reason}."
    meaning_vi: "Bọn tôi loại {option} vì {reason}."
    slots:
      option: ["Kubernetes", "a managed database", "a second region"]
      reason: ["nobody can run it on call", "the budget was fixed", "the data must stay in country"]
  - pattern: "That's a fair point. {Response}"
    meaning_vi: "Ý đó xác đáng. {Response}"
    slots:
      Response: ["I hadn't measured that.", "Let me check and come back to you.", "That changes the second option."]

dialogue:
  context_vi: >
    Bạn trình bày thiết kế trong buổi review. Chị Nga hỏi một câu bạn chưa
    nghĩ tới. Đây là lúc quyết định người ta có tin bạn hay không.
  turns:
    - speaker: "You"
      en: "We chose a managed database over running our own. The trade-off is higher monthly cost against no patching work for the team."
      vi: "Bọn em chọn cơ sở dữ liệu có quản lý thay vì tự chạy. Đánh đổi là chi phí hằng tháng cao hơn, đổi lấy việc nhóm không phải vá."
    - speaker: "Nga"
      en: "What happens to your backup window when the table grows past a terabyte?"
      vi: "Khi bảng vượt một terabyte thì cửa sổ sao lưu của em thế nào?"
    - speaker: "You"
      en: "That's a fair point. I hadn't measured that — I sized it against today's two hundred gigabytes."
      vi: "Ý đó xác đáng ạ. Em chưa đo cái đó — em tính theo hai trăm gigabyte hiện tại."
    - speaker: "Nga"
      en: "So the design might not hold in a year."
      vi: "Vậy thiết kế này có thể không trụ được sau một năm."
    - speaker: "You"
      en: "It might not. Let me check the growth rate and come back tomorrow with the number."
      vi: "Có thể không ạ. Để em kiểm tốc độ tăng rồi mai quay lại với con số."
    - speaker: "Nga"
      en: "Good. And why not Kubernetes for the application side?"
      vi: "Tốt. Còn phía ứng dụng sao không dùng Kubernetes?"
    - speaker: "You"
      en: "We ruled it out because nobody on the team can run it on call. That's a people constraint, not a technical one."
      vi: "Bọn em loại vì không ai trong nhóm trực được Kubernetes. Đó là ràng buộc con người, không phải kỹ thuật."
    - speaker: "Nga"
      en: "I can accept that. Is the choice reversible?"
      vi: "Chị chấp nhận được. Lựa chọn này quay lại được không?"
    - speaker: "You"
      en: "Yes. The application is packaged as a container either way, so moving it later is a deployment change, not a rewrite."
      vi: "Được ạ. Ứng dụng đóng gói dạng container ở cả hai đường, nên sau này chuyển là đổi cách triển khai chứ không phải viết lại."

listening:
  context_vi: >
    Nghe hai cách phản ứng khi bị hỏi một câu chưa nghĩ tới.
    Chú ý cách nào giữ được uy tín.
  speed: 1.2
  voice: en_US_female
  transcript_en: "The question was about the backup window at one terabyte. Reaction one: well, that is an edge case, and we can always add more storage, and honestly most systems never reach that size. Reaction two: that is a fair point, I had not measured that. I sized it against today's two hundred gigabytes. Let me check the growth rate and come back tomorrow with the number."
  transcript_vi: "Câu hỏi là về cửa sổ sao lưu ở mức một terabyte. Phản ứng một: à, đó là trường hợp hiếm, với lại lúc nào cũng thêm được dung lượng, mà thật ra phần lớn hệ thống chẳng bao giờ đạt tới cỡ đó. Phản ứng hai: ý đó xác đáng, tôi chưa đo cái đó. Tôi tính theo hai trăm gigabyte hiện tại. Để tôi kiểm tốc độ tăng rồi mai quay lại với con số."
  questions:
    - kind: mcq_listen
      prompt_vi: "Phản ứng một làm gì với câu hỏi?"
      choices: ["Hạ thấp câu hỏi thành trường hợp hiếm", "Trả lời trực tiếp", "Xin thêm thời gian"]
      answer: 0
      difficulty: 2
      skill: Listening
    - kind: mcq_listen
      prompt_vi: "Phản ứng hai kết thúc bằng gì?"
      choices: ["Một lời xin lỗi", "Một câu hỏi ngược", "Một cam kết cụ thể kèm thời hạn"]
      answer: 2
      difficulty: 2
      skill: Listening
    - kind: mcq_listen
      prompt_vi: "Vì sao phản ứng hai giữ được uy tín hơn?"
      choices: ["Vì dùng từ khó hơn", "Vì thừa nhận đúng phần chưa biết rồi cam kết kiểm lại", "Vì ngắn hơn"]
      answer: 1
      difficulty: 3
      skill: Listening

