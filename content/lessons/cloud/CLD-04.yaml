    ipa: "/ðæts ə fer pɔɪnt aɪ ˈhædnt ˈmeʒərd/"
    focus_phonemes: ["ð", "ʒ"]
  - kind: read_aloud
    expected_text: "Let me check the growth rate and come back tomorrow with the number."
    prompt_vi: "Không biết thì hẹn lại kèm mốc thời gian, đừng đoán."
    ipa: "/let miː tʃek ðə ɡroʊθ reɪt/"
