explanation:
  why_vi: >
    Buổi review không phải kỳ thi thiết kế. Người chủ trì đã biết thiết kế nào cũng
    có lỗ hổng — thứ họ đo là bạn phản ứng thế nào khi lỗ hổng bị chỉ ra.
    Người chống chế làm cả nhóm mất niềm tin vào mọi con số khác trong bài trình bày,
    kể cả những con số đúng.
  how_vi: >
    Ba câu, dùng được cho mọi câu hỏi khó: "That's a fair point" — công nhận.
    "I hadn't measured that" hoặc "I hadn't considered that" — nói đúng phần mình thiếu.
    "Let me check and come back to you by ..." — hẹn kèm thời hạn cụ thể.
    Ba câu này mất mười giây và giữ nguyên uy tín cho phần còn lại của bài trình bày.
  contrast_vi: >
    "Đó là trường hợp hiếm, với lại lúc nào cũng thêm dung lượng được" là chống chế:
    nó phủ nhận câu hỏi thay vì trả lời. "Ý đó xác đáng, em chưa đo, mai em quay lại
    với con số" là thừa nhận có giới hạn rõ ràng — và nó biến câu hỏi thành một việc
    có người chịu trách nhiệm.

common_mistakes:
  - mistake: "Hạ thấp câu hỏi thành trường hợp hiếm"
    why_vi: >
      Bị hỏi trúng chỗ chưa nghĩ tới thì phản xạ tự vệ bật lên trước lý trí.
      Nhưng người hỏi thường hỏi vì đã thấy tình huống đó xảy ra thật.
    fix_vi: "Dừng lại, nói \"That's a fair point\", rồi mới nghĩ tiếp."
    detect_phoneme_missing: []
  - mistake: "Đoán một con số cho có"
    why_vi: >
      Im lặng trong phòng họp rất khó chịu nên người ta lấp bằng con số ước chừng.
      Nhưng con số sai đi vào biên bản và thành cơ sở cho quyết định sau đó.
    fix_vi: "Nói thẳng \"I don't know\" rồi hẹn thời hạn. Không ai trừ điểm vì câu đó."
    detect_phoneme_missing: []
  - mistake: "Xin lỗi dài dòng thay vì trả lời"
    why_vi: >
      Văn hoá xin lỗi trước khi trình bày làm người nói mở đầu bằng hai ba câu tự trách.
      Trong buổi review, việc đó tiêu tốn thời gian và làm người nghe mất kiên nhẫn.
    fix_vi: "Bỏ phần xin lỗi. Vào thẳng: câu hỏi của anh chị là gì, con số của em là gì."
    detect_phoneme_missing: []

memory_trick_vi: >
  Ba câu cứu mạng trong review: THAT'S A FAIR POINT — I HADN'T MEASURED THAT —
  LET ME CHECK AND COME BACK BY [ngày]. Chống chế một câu là mất niềm tin cả bài.
