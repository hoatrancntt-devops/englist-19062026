      - "come back"

reading:
  kind: note
  context_vi: >
    Biên bản buổi review. Đọc và phân biệt câu hỏi nào đã được trả lời
    và câu nào còn treo.
  text_en: |
    Architecture review - order service - 14 May

    Present: Nga (chair), Dung, Minh, and the service owner.

    Decision presented
    Managed database instead of self-hosted. Containers on the shared
    cluster instead of Kubernetes. Single region with backups to a second.

    Questions raised

    1. Backup window past one terabyte.
    Not answered. The design was sized against today's 200 GB. Owner will
    measure the growth rate and return by 15 May. This blocks approval of
    the database choice only, not the rest.

    2. Why not Kubernetes.
    Answered and accepted. No one on the team can run it on call. The chair
    noted this is a people constraint that may change when the platform
    team grows, and asked that the decision record say so explicitly.

    3. Is the choice reversible.
    Answered. The application ships as a container either way, so a later
    move is a deployment change. The chair rated this low-risk.

    4. Cost at peak.
    Partially answered. The owner gave the steady-state figure but not the
    peak-hour figure. Nga accepted the steady-state number for now because
    the service has no seasonal peak.

    Outcome
    Approved with one condition: the growth-rate number by 15 May. If the
    backup window exceeds two hours at projected size, the database choice
    comes back to this group.
  text_vi: |
    Buổi review kiến trúc - dịch vụ đơn hàng - 14 tháng Năm

    Có mặt: Nga (chủ trì), Dũng, Minh và chủ dịch vụ.

    Quyết định trình bày
    Cơ sở dữ liệu có quản lý thay vì tự dựng. Container trên cụm dùng chung
    thay vì Kubernetes. Một vùng, sao lưu sang vùng thứ hai.

    Câu hỏi nêu ra

    1. Cửa sổ sao lưu khi vượt một terabyte.
    Chưa trả lời. Thiết kế tính theo 200 GB hiện tại. Chủ dịch vụ sẽ đo
    tốc độ tăng và trả lời trước 15 tháng Năm. Việc này chỉ chặn phê duyệt
    phần cơ sở dữ liệu, không chặn phần còn lại.

    2. Vì sao không dùng Kubernetes.
    Đã trả lời và được chấp nhận. Không ai trong nhóm trực được. Chủ trì lưu ý
    đây là ràng buộc con người, có thể thay đổi khi nhóm nền tảng lớn lên,
    và đề nghị ghi rõ điều đó vào bản ghi quyết định.

    3. Lựa chọn có quay lại được không.
    Đã trả lời. Ứng dụng đóng gói dạng container ở cả hai đường, nên chuyển sau
    là đổi cách triển khai. Chủ trì đánh giá rủi ro thấp.

    4. Chi phí lúc cao điểm.
    Trả lời một phần. Chủ dịch vụ đưa con số ở trạng thái ổn định nhưng chưa có
    con số giờ cao điểm. Chị Nga tạm chấp nhận con số ổn định vì dịch vụ này
    không có cao điểm theo mùa.

    Kết quả
    Duyệt kèm một điều kiện: con số tốc độ tăng trước 15 tháng Năm. Nếu cửa sổ
    sao lưu vượt hai tiếng ở kích thước dự kiến, lựa chọn cơ sở dữ liệu quay lại nhóm này.
  questions:
    - kind: mcq_read
      prompt_en: "Which question is still open?"
      choices: ["Why not Kubernetes", "Whether the choice is reversible", "The backup window at one terabyte"]
      answer: 2
      difficulty: 2
      reading_skill: scan
      skill: Reading
    - kind: mcq_read
      prompt_en: "What did the chair ask to be written into the decision record?"
      choices: ["That the Kubernetes rejection is a people constraint", "The peak cost figure", "The vendor name"]
      answer: 0
      difficulty: 3
      reading_skill: scan
      skill: Reading
    - kind: mcq_read
      prompt_en: "Why was the missing peak-cost figure accepted?"
      choices: ["It was too hard to calculate", "The service has no seasonal peak", "The chair forgot about it"]
      answer: 1
      difficulty: 3
      reading_skill: skim
      skill: Reading
    - kind: mcq_read
      prompt_en: "What would send the database choice back to the group?"
      choices: ["A cost increase", "A new team member", "A backup window over two hours at projected size"]
      answer: 2
      difficulty: 3
      reading_skill: scan
      skill: Reading

writing:
  kind: GuidedEmail
  prompt_vi: >
    Viết email trả lời sau buổi review: nhắc lại câu hỏi còn treo, đưa con số
    bạn đã đo, và nói rõ điều đó ảnh hưởng thế nào tới quyết định.
  prompt_en: "Follow up on an open architecture review question."
  required_points:
    - "fair point"
    - "measured"
    - "reversible"
  hint_vi: "Mở bằng câu hỏi họ nêu, không mở bằng lời xin lỗi dài."
  sample_en: "You raised a fair point about the backup window past one terabyte. I have now measured the growth rate: the table adds about 18 GB a month, so we reach one terabyte in roughly three and a half years, and the backup window at that size is 70 minutes. That stays inside our two-hour limit, and the choice is reversible in one sprint if the growth rate changes."

