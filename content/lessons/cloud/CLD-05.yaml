explanation:
  why_vi: >
    Sáu tháng sau, không ai nhớ vì sao lại chọn phương án đó. Người mới vào nhìn
    thiết kế thấy kém, đề xuất làm lại, và đề xuất đó bị chặn bởi cùng những ràng buộc
    cũ mà không ai còn nhớ để nói ra. Bản ghi quyết định tồn tại để cắt vòng lặp này.
    Nó không phải tài liệu thiết kế — nó là bản ghi bối cảnh.
  how_vi: >
    Bốn mục, một trang: BỐI CẢNH (ràng buộc lúc đó — người, thời gian, tiền, luật),
    QUYẾT ĐỊNH (một đoạn), PHƯƠNG ÁN ĐÃ LOẠI kèm lý do loại,
    HỆ QUẢ kèm con số, và MỐC XEM LẠI là một ngưỡng đo được.
    Quan trọng nhất là mục bối cảnh, vì đó là thứ duy nhất người đọc sau này không tự suy ra được.
  contrast_vi: >
    "Bọn tôi quyết dùng hàng đợi một node" ghi lại cái gì, không ghi vì sao —
    sáu tháng sau nó vô dụng. Thêm "at the time we had one engineer and two weeks"
    biến nó thành một quyết định có thể hiểu và có thể đánh giá lại đúng lúc.

common_mistakes:
  - mistake: "Chỉ ghi quyết định, không ghi bối cảnh"
    why_vi: >
      Lúc viết thì bối cảnh đang hiển nhiên với mọi người trong phòng,
      nên nó có vẻ thừa. Sáu tháng sau nó là thứ duy nhất còn giá trị.
    fix_vi: "Luôn mở bằng \"At the time, ...\" kèm ràng buộc về người, thời gian hoặc luật."
    detect_phoneme_missing: []
  - mistake: "Đặt mốc xem lại mơ hồ như \"sau này\" hoặc \"khi có điều kiện\""
    why_vi: >
      Viết mốc cụ thể cảm giác như tự đặt hạn cho mình. Nhưng mốc mơ hồ
      nghĩa là không bao giờ xem lại.
    fix_vi: "Đặt một ngưỡng đo được: số tin mỗi giây, số người trong nhóm, ngày nhà cung cấp mở vùng."
    detect_phoneme_missing: []
  - mistake: "Xoá bản ghi cũ khi có quyết định mới"
    why_vi: >
      Bản cũ nhìn như thông tin sai nên bị dọn đi. Nhưng nó giải thích
      vì sao hệ thống từng như vậy, và dữ liệu cũ trong hệ thống vẫn mang dấu vết đó.
    fix_vi: "Giữ lại, đổi trạng thái thành \"superseded by note X\"."
    detect_phoneme_missing: []

memory_trick_vi: >
  Bốn mục: BỐI CẢNH LÚC ĐÓ — QUYẾT ĐỊNH — ĐÃ LOẠI GÌ VÌ SAO — HỆ QUẢ + MỐC XEM LẠI.
  Mục quan trọng nhất là bối cảnh, vì nó là thứ duy nhất người sau không tự đoán ra được.
