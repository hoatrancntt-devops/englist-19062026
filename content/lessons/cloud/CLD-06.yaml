schema_version: 1
code: CLD-06
slug: viet-ke-hoach-migration
title_vi: "Viết kế hoạch migration — và đường lui cho từng đợt"
title_en: "Writing a migration plan"

layer: Professional
track: Cloud
level: B1
unit_code: U-CLD2
order_index: 6
estimated_minutes: 12
is_checkpoint: true

illustration: cloud-migration

objective_vi: >
  Viết kế hoạch chuyển hệ thống theo từng đợt, mỗi đợt có tiêu chí thành công
  và đường lui — thay vì một lần chuyển hết rồi cầu may.

objective_observable: >
  Đạt từ 80 điểm trên cả bốn trục kỹ năng, không trục nào dưới 65.

