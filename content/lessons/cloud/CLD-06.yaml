vocabulary:
  - term: "cut over"
    ipa: "/kʌt ˈoʊvər/"
    meaning_vi: "chuyển hẳn sang hệ mới"
    chunk: "We cut over on a Saturday morning."
    tags: [migration, core]
  - term: "roll back"
    ipa: "/roʊl bæk/"
    meaning_vi: "quay lại hệ cũ"
    chunk: "We can roll back in under ten minutes."
    tags: [migration, core]
  - term: "run in parallel"
    ipa: "/rʌn ɪn ˈpærəlel/"
    meaning_vi: "chạy song song hai hệ"
    chunk: "Both systems run in parallel for one week."
    tags: [migration, core]
  - term: "wave"
    ipa: "/weɪv/"
    meaning_vi: "đợt chuyển"
    chunk: "Wave one is the read-only services."
    tags: [migration, core]
  - term: "success criteria"
    ipa: "/səkˈses kraɪˈtɪriə/"
    meaning_vi: "tiêu chí coi là thành công"
    chunk: "Success criteria: error rate stays under one percent."
    tags: [migration, core]
  - term: "point of no return"
    ipa: "/pɔɪnt ɒv noʊ rɪˈtɜːrn/"
    meaning_vi: "điểm không quay lại được nữa"
    chunk: "The point of no return is the DNS change."
    tags: [migration, core]

sentence_patterns:
  - pattern: "Wave {n} moves {scope}, and we roll back by {action}."
    meaning_vi: "Đợt {n} chuyển {scope}, và quay lui bằng cách {action}."
    slots:
      n: ["one", "two", "three"]
      scope: ["the read-only services", "the reporting jobs", "the payment path"]
      action: ["pointing DNS back", "re-enabling the old queue", "restoring the snapshot"]
  - pattern: "Success criteria: {metric} stays {threshold} for {duration}."
    meaning_vi: "Tiêu chí thành công: {metric} giữ {threshold} trong {duration}."
    slots:
      metric: ["the error rate", "p95 latency", "the daily reconciliation difference"]
      threshold: ["under one percent", "under 400 milliseconds", "at zero"]
      duration: ["48 hours", "one week", "three business days"]

dialogue:
  context_vi: >
    Anh Tuấn duyệt kế hoạch chuyển hệ thống lên cloud. Anh không hỏi về công nghệ —
    anh hỏi về đường lui.
  turns:
    - speaker: "Tuấn"
      en: "You want to move everything on one weekend. What if it goes wrong at 3 a.m.?"
      vi: "Em muốn chuyển hết trong một cuối tuần. Nếu ba giờ sáng hỏng thì sao?"
    - speaker: "You"
      en: "I've split it into three waves. Wave one is the read-only reporting services — nothing writes, so rollback is just pointing DNS back."
      vi: "Em chia làm ba đợt rồi ạ. Đợt một là các dịch vụ báo cáo chỉ đọc — không ghi gì, nên quay lui chỉ là trỏ DNS về."
    - speaker: "Tuấn"
      en: "And the payment path?"
      vi: "Còn luồng thanh toán?"
    - speaker: "You"
      en: "Wave three, four weeks later. Both systems run in parallel for a week first and we compare the daily totals."
      vi: "Đợt ba, bốn tuần sau. Trước đó hai hệ chạy song song một tuần và bọn em đối chiếu tổng hằng ngày."
    - speaker: "Tuấn"
      en: "What's the point of no return?"
      vi: "Điểm không quay lại được là chỗ nào?"
    - speaker: "You"
      en: "When we stop writing to the old database. Before that, everything is reversible in about ten minutes."
      vi: "Là lúc bọn em ngừng ghi vào cơ sở dữ liệu cũ. Trước đó thì mọi thứ quay lui được trong khoảng mười phút."
    - speaker: "Tuấn"
      en: "Who decides to roll back, and when?"
      vi: "Ai quyết quay lui, và lúc nào?"
    - speaker: "You"
      en: "The on-call engineer, alone, if the error rate goes over one percent for fifteen minutes. No meeting needed at 3 a.m."
      vi: "Kỹ sư trực, tự quyết, nếu tỷ lệ lỗi vượt một phần trăm trong mười lăm phút. Ba giờ sáng không cần họp."

listening:
  context_vi: >
    Nghe hai kế hoạch chuyển hệ thống. Chú ý kế hoạch nào nói rõ ai được
    quyết quay lui và quyết theo ngưỡng nào.
  speed: 1.2
  voice: en_US_male
  transcript_en: "Plan one: we migrate over the weekend, the team will be on standby, and if there are problems we will assess the situation and decide what to do. Plan two: wave one moves the read-only services on Saturday. Success criteria: error rate under one percent for forty-eight hours. If it goes above that for fifteen minutes, the on-call engineer rolls back alone by pointing DNS at the old load balancer. No approval call needed."
  transcript_vi: "Kế hoạch một: bọn tôi chuyển vào cuối tuần, cả nhóm trực sẵn, và nếu có vấn đề thì bọn tôi đánh giá tình hình rồi quyết. Kế hoạch hai: đợt một chuyển các dịch vụ chỉ đọc vào thứ Bảy. Tiêu chí thành công: tỷ lệ lỗi dưới một phần trăm trong bốn mươi tám tiếng. Nếu vượt ngưỡng đó trong mười lăm phút, kỹ sư trực tự quay lui bằng cách trỏ DNS về bộ cân tải cũ. Không cần gọi ai duyệt."
  questions:
    - kind: mcq_listen
      prompt_vi: "Kế hoạch hai nói rõ điều gì mà kế hoạch một không?"
      choices: ["Ngưỡng quay lui và ai được quyết", "Tên nhà cung cấp", "Chi phí"]
      answer: 0
      difficulty: 2
      skill: Listening
    - kind: mcq_listen
      prompt_vi: "Ai được quyết quay lui trong kế hoạch hai?"
      choices: ["Cả nhóm sau khi họp", "Giám đốc kỹ thuật", "Kỹ sư trực, tự quyết"]
      answer: 2
      difficulty: 2
      skill: Listening
    - kind: mcq_listen
      prompt_vi: "Vì sao \"đánh giá tình hình rồi quyết\" là điểm yếu?"
      choices: ["Nghe không chuyên nghiệp", "Lúc ba giờ sáng không ai biết ngưỡng nào là đủ xấu để quay lui", "Quá dài dòng"]
      answer: 1
      difficulty: 3
      skill: Listening

