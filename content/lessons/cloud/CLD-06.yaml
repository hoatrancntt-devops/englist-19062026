explanation:
  why_vi: >
    Kế hoạch migration bị chặn không phải vì thiếu chi tiết kỹ thuật, mà vì
    người duyệt không thấy đường lui. Câu hỏi họ luôn hỏi là "nếu hỏng lúc ba giờ sáng
    thì sao" — và câu trả lời "bọn em sẽ đánh giá tình hình" nghĩa là lúc đó
    không ai biết ngưỡng nào là đủ xấu để dừng lại.
  how_vi: >
    Mỗi đợt viết bốn dòng: PHẠM VI, TIÊU CHÍ THÀNH CÔNG là số đo được kèm khoảng
    thời gian, CÁCH QUAY LUI kèm thời gian thực hiện, và AI ĐƯỢC QUYẾT.
    Xếp đợt theo chi phí quay lui: dịch vụ chỉ đọc đi trước vì trỏ lại DNS là xong,
    luồng ghi đi cuối. Và nêu rõ ĐIỂM KHÔNG QUAY LẠI trong kế hoạch, không phải phát hiện ra lúc đang chuyển.
  contrast_vi: >
    "Bọn em chuyển cuối tuần, cả nhóm trực sẵn" nghe an tâm nhưng không cho ai
    cơ sở để dừng. "Tỷ lệ lỗi vượt 1% trong mười lăm phút thì kỹ sư trực tự trỏ DNS về,
    mất bốn phút" cho người trực quyền quyết ngay lúc cần, không phải đi đánh thức người khác.

common_mistakes:
  - mistake: "Viết tiêu chí thành công theo cảm nhận — \"chạy ổn định\""
    why_vi: >
      Lúc viết thì ai cũng nghĩ mình nhận ra được thế nào là ổn.
      Lúc ba giờ sáng, mệt và áp lực, không ai phân biệt được ổn với sắp hỏng.
    fix_vi: "Một con số và một khoảng thời gian: dưới 1% trong 48 tiếng."
    detect_phoneme_missing: []
  - mistake: "Không nói ai được quyết quay lui"
    why_vi: >
      Mặc định người ta nghĩ sẽ hội ý. Nhưng hội ý lúc nửa đêm mất hàng giờ,
      và mỗi giờ đó là sự cố kéo dài.
    fix_vi: "Ghi tên vai trò và ngưỡng: kỹ sư trực tự quyết khi vượt ngưỡng X."
    detect_phoneme_missing: []
  - mistake: "Chuyển luồng ghi trước vì đó là phần quan trọng nhất"
    why_vi: >
      Phần quan trọng nhất được ưu tiên là phản xạ đúng ở nhiều việc khác,
      nhưng ở migration thì ngược lại — nó là phần khó quay lui nhất.
    fix_vi: "Xếp thứ tự theo chi phí quay lui, không theo mức quan trọng."
    detect_phoneme_missing: []

memory_trick_vi: >
  Mỗi đợt bốn dòng: PHẠM VI — TIÊU CHÍ CÓ SỐ — CÁCH QUAY LUI CÓ THỜI GIAN — AI QUYẾT.
  Xếp đợt theo chi phí quay lui: rẻ nhất đi trước. Và ghi rõ điểm không quay lại được.
