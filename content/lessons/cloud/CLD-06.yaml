  - kind: read_aloud
    expected_text: "Wave one moves the read-only services, and we roll back by pointing DNS back."
    prompt_vi: "Mỗi đợt gắn liền với một cách quay lui."
    ipa: "/weɪv wʌn muːvz ðə riːd ˈoʊnli/"
    focus_phonemes: ["w", "v"]
  - kind: read_aloud
    expected_text: "Success criteria: the error rate stays under one percent for forty-eight hours."
    prompt_vi: "Tiêu chí phải là số đo được kèm khoảng thời gian."
    ipa: "/səkˈses kraɪˈtɪriə ðə ˈerər reɪt/"
    focus_phonemes: ["kr", "s"]
  - kind: shadow
    expected_text: "The point of no return is when we stop writing to the old database."
    prompt_vi: "Nói rõ mốc hết đường lui. Ai duyệt cũng hỏi câu này."
    ipa: "/ðə pɔɪnt ɒv noʊ rɪˈtɜːrn/"
    focus_phonemes: ["ɔɪ", "ɜːr"]
  - kind: shadow
    expected_text: "The on-call engineer rolls back alone. No meeting needed at 3 a.m."
    prompt_vi: "Giao quyền trước, không giao lúc đang cháy."
    ipa: "/ðə ɒn kɔːl ˌendʒɪˈnɪr roʊlz bæk/"
    focus_phonemes: ["dʒ", "l"]
  - kind: respond
    prompt_en: "What if it goes wrong at 3 a.m.?"
    prompt_vi: "Nêu ngưỡng quay lui, ai quyết, và mất bao lâu."
    accept_patterns:
      - "roll back"
      - "on-call"
      - "percent"

reading:
  kind: note
  context_vi: >
    Kế hoạch chuyển hệ thống theo ba đợt. Đọc và tìm đợt nào không có
    đường lui thật sự.
  text_en: |
    Migration plan - order platform to cloud

    Wave 1 - reporting services - Saturday 6 June
    Scope: four read-only services. No writes, no state.
    Success criteria: error rate under 1% and p95 latency under 400 ms
    for 48 hours.
    Rollback: point DNS at the old load balancer. Takes about 4 minutes.
    Decision: on-call engineer, alone, no approval needed.

    Wave 2 - background jobs - Saturday 4 July
    Scope: nightly reconciliation and the partner file export.
    Success criteria: three consecutive nightly runs produce output
    identical to the old system, compared automatically.
    Rollback: re-enable the old scheduler. The new job is idempotent, so a
    double run is safe. Takes about 10 minutes.
    Decision: on-call engineer, alone.

    Wave 3 - order write path - Saturday 1 August
    Scope: order creation and payment confirmation.
    Preparation: both systems run in parallel from 18 July. The old system
    stays authoritative; the new one shadows every write and we compare
    daily totals. Wave 3 does not start unless the difference is zero for
    seven days.
    Success criteria: error rate under 0.5% for 24 hours and zero
    reconciliation difference on the first nightly run.
    Rollback: switch writes back to the old database. This works only
    until we run the schema change that drops the legacy columns.
    Point of no return: the schema change, scheduled for 15 August, two
    weeks after cut-over. Nothing is deleted before that date.
    Decision: rollback in the first 24 hours is the on-call engineer's
    call. After that it needs the service owner, because re-syncing two
    weeks of orders is a bigger operation than the outage it prevents.
  text_vi: |
    Kế hoạch chuyển - nền tảng đơn hàng lên cloud

    Đợt 1 - dịch vụ báo cáo - thứ Bảy 6 tháng Sáu
    Phạm vi: bốn dịch vụ chỉ đọc. Không ghi, không giữ trạng thái.
    Tiêu chí thành công: tỷ lệ lỗi dưới 1% và p95 độ trễ dưới 400 ms
    trong 48 tiếng.
    Quay lui: trỏ DNS về bộ cân tải cũ. Mất khoảng 4 phút.
    Người quyết: kỹ sư trực, tự quyết, không cần duyệt.

    Đợt 2 - job nền - thứ Bảy 4 tháng Bảy
    Phạm vi: đối soát hằng đêm và xuất file cho đối tác.
    Tiêu chí thành công: ba đêm liên tiếp cho kết quả giống hệt hệ cũ,
    đối chiếu tự động.
    Quay lui: bật lại bộ lập lịch cũ. Job mới chạy lại nhiều lần vẫn cho cùng kết quả
    nên chạy trùng không sao. Mất khoảng 10 phút.
    Người quyết: kỹ sư trực, tự quyết.

    Đợt 3 - luồng ghi đơn hàng - thứ Bảy 1 tháng Tám
    Phạm vi: tạo đơn và xác nhận thanh toán.
    Chuẩn bị: hai hệ chạy song song từ 18 tháng Bảy. Hệ cũ vẫn là hệ chính thức;
    hệ mới ghi bóng theo mọi lệnh ghi và bọn mình đối chiếu tổng hằng ngày.
    Đợt 3 không bắt đầu nếu chênh lệch chưa về không trong bảy ngày.
    Tiêu chí thành công: tỷ lệ lỗi dưới 0,5% trong 24 tiếng và chênh lệch đối soát
    bằng không ở lần chạy đêm đầu tiên.
    Quay lui: chuyển lệnh ghi về cơ sở dữ liệu cũ. Cách này chỉ còn dùng được
    cho tới khi chạy lệnh đổi lược đồ xoá các cột cũ.
    Điểm không quay lại: lệnh đổi lược đồ, xếp lịch 15 tháng Tám, hai tuần sau
    khi chuyển hẳn. Không xoá gì trước ngày đó.
    Người quyết: quay lui trong 24 tiếng đầu là quyền kỹ sư trực. Sau đó cần
    chủ dịch vụ, vì đồng bộ lại hai tuần đơn hàng là việc lớn hơn cả sự cố nó tránh được.
  questions:
    - kind: mcq_read
      prompt_en: "What must be true for seven days before wave 3 starts?"
      choices: ["The error rate is zero", "All staff are trained", "The daily reconciliation difference is zero"]
      answer: 2
      difficulty: 3
      reading_skill: scan
      skill: Reading
    - kind: mcq_read
      prompt_en: "Why is a double run of the wave 2 job safe?"
      choices: ["The job is idempotent", "It writes nothing", "It runs on a copy"]
      answer: 0
      difficulty: 3
      reading_skill: scan
      skill: Reading
    - kind: mcq_read
      prompt_en: "Why does rollback need the service owner after 24 hours?"
      choices: ["The engineer goes off shift", "Re-syncing two weeks of orders is bigger than the outage it prevents", "Company policy"]
      answer: 1
      difficulty: 3
      reading_skill: skim
      skill: Reading
    - kind: mcq_read
      prompt_en: "When does the plan lose its rollback path?"
      choices: ["At cut-over on 1 August", "After 48 hours", "At the schema change on 15 August"]
      answer: 2
      difficulty: 2
      reading_skill: scan
      skill: Reading

writing:
  kind: GuidedEmail
  prompt_vi: >
    Viết mô tả một đợt chuyển: phạm vi, tiêu chí thành công đo được,
    cách quay lui kèm thời gian, và ai được quyết.
  prompt_en: "Describe one migration wave."
  required_points:
    - "success criteria"
    - "roll back"
    - "on-call"
  hint_vi: "Tiêu chí phải là con số. \"Chạy ổn\" không phải tiêu chí."
  sample_en: "Wave one moves the four read-only reporting services on Saturday 6 June. Success criteria: error rate under one percent and p95 latency under 400 milliseconds for 48 hours. We roll back by pointing DNS at the old load balancer, which takes about four minutes. The on-call engineer makes that call alone, with no approval needed."

