    answer: 1
    difficulty: 1
    skill: Speaking

explanation:
  why_vi: >
    Nhánh Hạ tầng xoay quanh một thói quen duy nhất: nói bằng dữ kiện chứ không bằng cảm nhận.
    Mỗi bài đều là một dạng của cùng thói quen đó — con số trong standup,
    trạng thái và mốc thời gian khi báo sự cố, bằng chứng khi loại trừ nguyên nhân,
    và phương án quay lui khi xin duyệt.
  how_vi: >
    Bài này không dạy gì mới. Nó kiểm tra bạn chuyển được giữa bốn tình huống
    trong một ca trực, và dùng đúng từ ở mỗi tình huống. Bí ở đâu thì quay lại đúng bài đó:
    trạng thái dịch vụ ở INF-02, nhịp cập nhật ở INF-03, quay lui ở INF-04,
    khoanh vùng mạng ở INF-06.
  contrast_vi: >
    "Mạng hỏng, đang xem" là một câu. "Degraded từ 11 giờ, tám người, DNS đã loại trừ,
    hỏng ở chặng ba" là bốn dữ kiện — và bốn dữ kiện đó cho phép người khác hành động
    mà không cần hỏi thêm câu nào.

common_mistakes:
  - mistake: "Dùng từ trạng thái sai vì đang căng thẳng"
    why_vi: >
      Lúc sự cố, phản xạ là nói cho nhanh. Nhưng down và degraded điều động
      hai mức nguồn lực khác nhau, và nói sai là gọi nhầm người dậy lúc 3 giờ sáng.
    fix_vi: "Trước khi mở miệng, hỏi mình: có truy cập được không? Được mà kém thì là degraded."
    detect_phoneme_missing: []
  - mistake: "Báo cáo bằng cảm nhận thay vì dữ kiện"
    why_vi: >
      “Có vẻ ổn hơn rồi” là cảm nhận của người đang xử lý, không phải trạng thái đo được.
      Người nghe không biết nên hành động hay chờ.
    fix_vi: "Mỗi câu báo cáo phải có ít nhất một con số hoặc một mốc thời gian."
    detect_phoneme_missing: []
  - mistake: "Quên mốc cập nhật tiếp theo"
    why_vi: >
      Nghĩ rằng sẽ báo khi có tin mới. Nhưng khách hàng không biết “khi nào” là bao giờ,
      nên họ hỏi lại mỗi mười lăm phút.
    fix_vi: "Mọi cập nhật đều kết bằng một mốc giờ cụ thể. Đó là cam kết duy nhất bạn luôn giữ được."
    detect_phoneme_missing: []

memory_trick_vi: >
  Cả nhánh Hạ tầng gói trong một thói quen: NÓI BẰNG DỮ KIỆN.
  Con số trong standup, trạng thái và giờ khi báo sự cố, bằng chứng khi loại trừ,
  và phương án quay lui khi xin duyệt.
