  - kind: mcq
    prompt_vi: "Phần nào bắt buộc có trong mọi bản cập nhật sự cố?"
    choices: ["Mốc cập nhật tiếp theo", "Lời xin lỗi", "Tên người xử lý"]
    answer: 0
