    skill: Speaking

explanation:
  why_vi: >
    Học từng bài rời rạc thì nhớ được từng câu, nhưng đời thật không đến từng bài một.
    Một buổi sáng bình thường đã gộp chào hỏi, đổi hẹn, báo kẹt xe và rủ ăn trưa —
    bốn bài khác nhau trong sáu mươi giây.
  how_vi: >
    Bài này không dạy gì mới. Nó kiểm tra bạn chuyển được giữa các tình huống mà không
    phải dừng lại nghĩ xem "câu này thuộc bài nào". Nếu có chỗ bí, quay lại đúng bài đó
    thay vì học lại cả tầng.
  contrast_vi: >
    Nhớ một câu khác với dùng được một câu. Nhớ là khi có người nhắc; dùng được là khi
    câu đó tự bật ra giữa lúc bạn đang lo việc khác.

common_mistakes:
  - mistake: "Dừng lại giữa chừng để nhớ xem câu này học ở bài nào"
    why_vi: >
      Học theo bài nên trí nhớ được tổ chức theo bài, còn đời thật không có nhãn bài nào cả.
      Khoảng dừng đó chính là lúc cuộc trò chuyện chết.
    fix_vi: "Luyện chuyển tình huống liên tục, như đúng bài checkpoint này, chứ không luyện từng bài riêng."
    detect_phoneme_missing: []
  - mistake: "Bỏ qua bước xác nhận lại khi nghe không chắc"
    why_vi: >
      Càng học nhiều càng ngại dùng câu cứu hộ, vì cảm giác như thừa nhận mình chưa giỏi.
      Nhưng người bản xứ xác nhận lại suốt ngày.
    fix_vi: "\"Let me confirm\" là câu của người chuyên nghiệp, không phải của người kém tiếng Anh."
    detect_phoneme_missing: []
  - mistake: "Trả lời cụt khi đã hết ý"
    why_vi: >
      Vốn từ có hạn nên khi cạn ý thì trả lời một chữ, và cuộc trò chuyện đóng lại.
    fix_vi: "Quay về quy tắc của bài thời tiết: mỗi lượt đáp thêm đúng một thông tin."
    detect_phoneme_missing: []

memory_trick_vi: >
  Cả tầng Đời sống gói trong bốn công thức: BA NHỊP khi chào, BA Ý khi báo trễ,
  BA Ý khi đổi hẹn, và BA CỤM KHUNG khi kể lại. Nhớ bốn con số ba này là đủ đi làm.
