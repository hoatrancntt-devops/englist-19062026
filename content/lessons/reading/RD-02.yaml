schema_version: 1
code: RD-02
slug: doc-release-notes-va-changelog
title_vi: "Đọc release notes — tìm thứ sẽ làm hỏng hệ thống của bạn"
title_en: "Reading release notes and changelogs"

layer: Professional
track: Reading
level: B1
unit_code: U-RD1
order_index: 2
estimated_minutes: 12
is_checkpoint: false

illustration: release-notes

objective_vi: >
  Đọc ghi chú phát hành và tìm ra đúng phần quan trọng nhất: thay đổi phá vỡ
  tương thích và tính năng bị bỏ — hai thứ quyết định có nâng cấp được hay không.

objective_observable: >
  Đạt từ 75 điểm trên cả bốn trục kỹ năng, không trục nào dưới 60.

mastery_weights:
  Listening: 0.15
  Speaking: 0.20
  Reading: 0.45
  Writing: 0.20

prerequisites:
  - lesson: RD-01
    min_mastery: 70
    kind: Hard
  - lesson: INF-04
    min_mastery: 65
    kind: Soft

vocabulary:
  - term: "breaking change"
    ipa: "/ˈbreɪkɪŋ tʃeɪndʒ/"
    meaning_vi: "thay đổi phá vỡ tương thích"
    chunk: "There are two breaking changes in this release."
    tags: [reading, core]
  - term: "deprecated"
    ipa: "/ˈdeprəkeɪtɪd/"
    meaning_vi: "vẫn chạy nhưng sẽ bị bỏ"
    chunk: "The old endpoint is deprecated, not removed yet."
    tags: [reading, core]
  - term: "removed"
    ipa: "/rɪˈmuːvd/"
    meaning_vi: "đã bị bỏ hẳn"
    chunk: "The flag was removed in this version."
    tags: [reading, core]
  - term: "no longer"
    ipa: "/noʊ ˈlɒŋɡər/"
    meaning_vi: "không còn"
    chunk: "The API no longer accepts plain text."
    tags: [reading, core]
  - term: "upgrade path"
    ipa: "/ˈʌpɡreɪd pɑːθ/"
    meaning_vi: "đường nâng cấp — phải qua phiên bản nào"
    chunk: "The upgrade path goes through version 15 first."
    tags: [reading, core]
  - term: "backwards compatible"
    ipa: "/ˈbækwərdz kəmˈpætəbl/"
    meaning_vi: "vẫn tương thích với bản cũ"
    chunk: "This change is backwards compatible."
    tags: [reading, core]

sentence_patterns:
  - pattern: "There {are} {n} breaking {changes} in this release."
    meaning_vi: "Bản này có {n} thay đổi phá vỡ tương thích."
    slots:
      are: ["are", "is"]
      n: ["two", "one", "no"]
      changes: ["changes", "change"]
  - pattern: "{Feature} is deprecated but still works until {version}."
    meaning_vi: "{Feature} bị đánh dấu sẽ bỏ nhưng vẫn chạy tới {version}."
    slots:
      Feature: ["The old endpoint", "The text format", "The legacy flag"]
      version: ["version 18", "the next major release", "March 2027"]

dialogue:
  context_vi: >
    Chị Vy hỏi bạn có nên nâng cấp thư viện lên bản mới không.
    Bạn phải đọc release notes trước khi trả lời.
  turns:
    - speaker: "Vy"
      en: "Version 17 is out. Can we upgrade this sprint?"
      vi: "Bản 17 ra rồi. Sprint này nâng cấp được không em?"
    - speaker: "You"
      en: "Let me read the release notes first. I'm looking for the breaking changes section, not the new features."
      vi: "Để em đọc ghi chú phát hành đã. Em tìm mục thay đổi phá vỡ tương thích, không phải mục tính năng mới."
    - speaker: "Vy"
      en: "What did you find?"
      vi: "Em thấy gì?"
    - speaker: "You"
      en: "Two things. The API no longer accepts plain text bodies, and the retry flag was removed — not deprecated, removed."
      vi: "Hai thứ ạ. API không còn nhận nội dung dạng văn bản thuần, và cờ retry đã bị bỏ hẳn — không phải đánh dấu sẽ bỏ, mà bỏ luôn."
    - speaker: "Vy"
      en: "Do we use either of those?"
      vi: "Mình có dùng cái nào trong hai cái đó không?"
    - speaker: "You"
      en: "We use the retry flag in the export job. That one line stops working the moment we upgrade."
      vi: "Bọn mình dùng cờ retry trong job xuất dữ liệu. Đúng một dòng đó sẽ ngừng hoạt động ngay khi nâng cấp."
    - speaker: "Vy"
      en: "So we can't upgrade?"
      vi: "Vậy không nâng cấp được à?"
    - speaker: "You"
      en: "We can, but the export job needs a change first. And there's an upgrade path note — we have to go through 16 before 17."
      vi: "Được ạ, nhưng phải sửa job xuất trước. Với lại có ghi chú về đường nâng cấp — phải qua bản 16 rồi mới lên 17."
    - speaker: "Vy"
      en: "How long is that?"
      vi: "Mất bao lâu?"
    - speaker: "You"
      en: "Half a day for the code change, and two upgrades instead of one. I'd put it in next sprint, not this one."
      vi: "Nửa ngày cho phần sửa code, và nâng cấp hai lần thay vì một. Em đề nghị để sprint sau, không phải sprint này."

listening:
  context_vi: >
    Nghe hai người tóm tắt cùng một bản phát hành. Chú ý ai đọc phần
    quan trọng với hệ thống của mình.
  speed: 1.2
  voice: en_US_female
  transcript_en: "Summary one: version 17 adds a new dashboard, better performance and improved logging, so we should upgrade soon. Summary two: version 17 has two breaking changes. The API no longer accepts plain text bodies, which we do not use, and the retry flag was removed, which we do use in the export job. There is also an upgrade path note: you must go through 16 first. Half a day of work, and I would schedule it for next sprint."
  transcript_vi: "Tóm tắt một: bản 17 thêm bảng điều khiển mới, hiệu năng tốt hơn và ghi log tốt hơn, nên mình nâng cấp sớm đi. Tóm tắt hai: bản 17 có hai thay đổi phá vỡ tương thích. API không còn nhận nội dung văn bản thuần, cái đó bọn mình không dùng, và cờ retry đã bị bỏ, cái đó bọn mình có dùng trong job xuất. Còn có ghi chú về đường nâng cấp: phải qua bản 16 trước. Nửa ngày công, và tôi đề nghị xếp vào sprint sau."
  questions:
    - kind: mcq_listen
      prompt_vi: "Tóm tắt hai đọc mục nào trước?"
      choices: ["Thay đổi phá vỡ tương thích", "Tính năng mới", "Sửa lỗi"]
      answer: 0
      difficulty: 1
      skill: Listening
    - kind: mcq_listen
      prompt_vi: "Thay đổi nào ảnh hưởng tới hệ thống của họ?"
      choices: ["API không nhận văn bản thuần", "Bảng điều khiển mới", "Cờ retry bị bỏ"]
      answer: 2
      difficulty: 2
      skill: Listening
    - kind: mcq_listen
      prompt_vi: "Ghi chú về đường nâng cấp nói gì?"
      choices: ["Nâng thẳng lên 17 được", "Phải qua bản 16 trước", "Không nâng cấp được"]
      answer: 1
      difficulty: 2
      skill: Listening

