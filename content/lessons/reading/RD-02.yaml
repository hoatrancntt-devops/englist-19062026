    ipa: "/ði ˈʌpɡreɪd pɑːθ ɡoʊz θruː/"
    focus_phonemes: ["θ", "ɡr"]
  - kind: respond
    prompt_en: "Version 17 is out. Can we upgrade this sprint?"
    prompt_vi: "Nêu số thay đổi phá vỡ tương thích và cái nào ảnh hưởng tới mình."
    accept_patterns:
      - "breaking change"
      - "we use"
      - "upgrade path"

reading:
  kind: release_notes
  context_vi: >
    Ghi chú phát hành thật. Đọc và tìm hai thứ: thay đổi phá vỡ tương thích,
    và tính năng đã bị bỏ hẳn.
  text_en: |
    Release 17.0.0

    New features
    - A new dashboard showing queue depth per consumer group.
    - Structured logging in JSON, opt-in through the log-format setting.
    - Connection pooling is now enabled by default.

    Breaking changes
    - The API no longer accepts plain text request bodies. All requests
      must send JSON with a content-type header. Requests without the
      header return 415 instead of being guessed.
    - The retry-on-timeout flag has been REMOVED. It was deprecated in
      16.2 with a warning in the logs. Code that passes this flag will
      fail to start, not fail silently.

    Deprecated (still works, will be removed in 19.0)
    - The v1 metrics endpoint. Use /v2/metrics, which returns the same
      fields plus two new ones.
    - The legacy config file format. The tool will read it and print a
      warning on every start.

    Upgrade path
    You cannot upgrade directly from 15.x to 17.0. The schema migration
    in 16.0 must run first. The supported path is 15.x to 16.x to 17.0.
    Upgrading from 16.x to 17.0 is a single step.

    Fixed
    - Connections were not returned to the pool after a cancelled request.
      This is the cause of the slow leak reported by several users in 16.3.

    Known issues
    - On Windows, the new dashboard does not render queue names containing
      non-ASCII characters. A fix is planned for 17.0.1.
  text_vi: |
    Bản phát hành 17.0.0

    Tính năng mới
    - Bảng điều khiển mới hiện độ sâu hàng đợi theo từng nhóm tiêu thụ.
    - Ghi log có cấu trúc dạng JSON, bật bằng thiết lập log-format.
    - Gộp kết nối nay được bật mặc định.

    Thay đổi phá vỡ tương thích
    - API không còn nhận nội dung yêu cầu dạng văn bản thuần. Mọi yêu cầu
      phải gửi JSON kèm header content-type. Yêu cầu thiếu header sẽ trả về
      415 thay vì được đoán như trước.
    - Cờ retry-on-timeout đã BỊ BỎ. Nó được đánh dấu sẽ bỏ từ bản 16.2 kèm
      cảnh báo trong log. Code truyền cờ này sẽ không khởi động được,
      chứ không phải hỏng âm thầm.

    Đánh dấu sẽ bỏ (vẫn chạy, sẽ bỏ ở bản 19.0)
    - Điểm cuối metrics v1. Dùng /v2/metrics, trả về đúng các trường cũ
      cộng thêm hai trường mới.
    - Định dạng file cấu hình cũ. Công cụ vẫn đọc được và in cảnh báo
      mỗi lần khởi động.

    Đường nâng cấp
    Không nâng thẳng từ 15.x lên 17.0 được. Bản chuyển đổi lược đồ ở 16.0
    phải chạy trước. Đường được hỗ trợ là 15.x lên 16.x rồi lên 17.0.
    Nâng từ 16.x lên 17.0 thì đi một bước.

    Đã sửa
    - Kết nối không được trả về pool sau khi yêu cầu bị huỷ.
      Đây là nguyên nhân của rò rỉ chậm mà vài người dùng báo ở bản 16.3.

    Vấn đề đã biết
    - Trên Windows, bảng điều khiển mới không hiện được tên hàng đợi có
      ký tự ngoài ASCII. Dự kiến sửa ở bản 17.0.1.
  questions:
    - kind: mcq_read
      prompt_en: "What happens to code that passes the retry-on-timeout flag?"
      choices: ["It is ignored silently", "It prints a warning", "It fails to start"]
      answer: 2
      difficulty: 2
      reading_skill: scan
      skill: Reading
    - kind: mcq_read
      prompt_en: "What is the difference between the retry flag and the v1 metrics endpoint?"
      choices: ["The flag is removed, the endpoint is only deprecated", "Both are removed", "Both are deprecated"]
      answer: 0
      difficulty: 3
      reading_skill: skim
      skill: Reading
    - kind: mcq_read
      prompt_en: "You are on 15.4. What is the supported upgrade path?"
      choices: ["Directly to 17.0", "15.x to 16.x to 17.0", "Wait for 17.0.1"]
      answer: 1
      difficulty: 2
      reading_skill: scan
      skill: Reading
    - kind: mcq_read
      prompt_en: "Which fixed item explains a problem users already reported?"
      choices: ["The dashboard rendering", "Structured logging", "Connections not returned to the pool after a cancelled request"]
      answer: 2
      difficulty: 3
      reading_skill: scan
      skill: Reading
    - kind: mcq_read
      prompt_en: "A request sends plain text with no content-type. What does 17.0 return?"
      choices: ["415", "200, guessing the format", "500"]
      answer: 0
      difficulty: 3
      reading_skill: scan
      skill: Reading

writing:
  kind: GuidedEmail
  prompt_vi: >
    Viết ba câu tóm tắt một bản phát hành cho nhóm: số thay đổi phá vỡ tương thích,
    cái nào ảnh hưởng tới hệ thống của mình, và đề nghị lịch nâng cấp.
  prompt_en: "Summarise a release for your team."
  required_points:
    - "breaking change"
    - "we use"
    - "upgrade path"
  hint_vi: "Bỏ qua mục tính năng mới. Nhóm cần biết cái gì sẽ hỏng."
  sample_en: "Release 17.0 has two breaking changes: the API no longer accepts plain text bodies, and the retry-on-timeout flag has been removed. We use that flag in the export job, so that job will fail to start the moment we upgrade, and it needs about half a day of work first. The upgrade path also goes through 16.x, so I would schedule this for next sprint rather than this one."

