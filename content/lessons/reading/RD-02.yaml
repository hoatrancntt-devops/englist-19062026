    prompt_vi: "Câu mở đầu khi tóm tắt một bản phát hành cho nhóm."
    ipa: "/ðer ɑːr tuː ˈbreɪkɪŋ ˈtʃeɪndʒɪz/"
    focus_phonemes: ["br", "dʒ"]
  - kind: read_aloud
    expected_text: "The flag was removed, not deprecated."
    prompt_vi: "Phân biệt hai từ này. Chúng khác nhau hoàn toàn về mức gấp."
    ipa: "/ðə flæɡ wɒz rɪˈmuːvd nɒt ˈdeprəkeɪtɪd/"
    focus_phonemes: ["fl", "pr"]
  - kind: shadow
    expected_text: "We use that flag in the export job, so it stops working when we upgrade."
    prompt_vi: "Nối thay đổi của người ta với hệ thống của mình."
    ipa: "/wiː juːz ðæt flæɡ ɪn ði ˈekspɔːrt dʒɒb/"
    focus_phonemes: ["ks", "dʒ"]
  - kind: shadow
