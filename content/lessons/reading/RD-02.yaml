explanation:
  why_vi: >
    Release notes viết theo thứ tự tiếp thị: tính năng mới ở trên cùng vì đó là
    thứ nhà cung cấp muốn khoe. Nhưng thứ quyết định bạn nâng cấp được hay không
    nằm ở giữa trang, dưới mục breaking changes. Đọc từ trên xuống thì bạn hào hứng
    trước và phát hiện vấn đề sau — thường là sau khi đã nâng cấp trên môi trường thật.
  how_vi: >
    Đọc ngược thứ tự trang. Một: mục BREAKING CHANGES — có bao nhiêu, và cái nào
    dính tới code của mình. Hai: mục DEPRECATED — chưa gấp nhưng ghi vào việc tồn đọng.
    Ba: mục UPGRADE PATH — nhiều bản bắt phải qua bản trung gian. Bốn: KNOWN ISSUES.
    Mục tính năng mới đọc cuối cùng, nếu còn thời gian.
  contrast_vi: >
    "Bản 17 có bảng điều khiển mới, hiệu năng tốt hơn, nên nâng cấp đi" là đọc mục đầu.
    "Có hai thay đổi phá vỡ tương thích, cờ retry bị bỏ và bọn mình đang dùng nó trong
    job xuất" là đọc mục thứ hai — và đó là câu duy nhất giúp nhóm quyết định được.

common_mistakes:
  - mistake: "Đọc mục tính năng mới trước"
    why_vi: >
      Mục đó nằm trên cùng và viết hấp dẫn nhất. Nhưng nó không cho biết
      cái gì sẽ hỏng, mà đó mới là câu hỏi thật.
    fix_vi: "Cuộn thẳng xuống mục breaking changes. Tính năng mới đọc sau cùng."
    detect_phoneme_missing: []
  - mistake: "Coi deprecated và removed là một"
    why_vi: >
      Cả hai đều mang nghĩa cũ và sắp bỏ trong đầu người đọc.
      Nhưng deprecated là còn thời gian, removed là hỏng ngay hôm nâng cấp.
    fix_vi: "Removed thì phải sửa trước khi nâng. Deprecated thì ghi vào việc tồn đọng."
    detect_phoneme_missing: []
  - mistake: "Không đối chiếu thay đổi với code của chính mình"
    why_vi: >
      Đọc xong thấy danh sách dài và kết luận chung là rủi ro cao hoặc thấp.
      Nhưng phần lớn thay đổi không liên quan gì tới mình.
    fix_vi: "Với mỗi breaking change, tìm trong code xem có dùng không. Chỉ cái có dùng mới là việc."
    detect_phoneme_missing: []

memory_trick_vi: >
  Đọc ngược trang: BREAKING CHANGES trước — DEPRECATED — UPGRADE PATH — KNOWN ISSUES.
  Tính năng mới đọc cuối. Và mỗi breaking change phải tự hỏi: mình có dùng không?
