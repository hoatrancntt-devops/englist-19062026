reading:
  kind: api_doc
  context_vi: >
    Một trang tài liệu API. Đọc và trả lời bốn câu hỏi:
    cần gì, trả về gì, lỗi gì, giới hạn bao nhiêu.
  text_en: |
    POST /v2/orders

    Creates an order.

    Request body
    customer_id     string   required
    items           array    required, at least one item
    currency        string   optional, defaults to VND
    note            string   optional, max 200 characters
    delivery_date   string   optional, ISO date. If omitted, the order is
                             created without a delivery date and can be
                             updated later. Sending a past date returns 400.

    Headers
    Idempotency-Key  string  optional but strongly recommended. If you send
                             the same key twice within 24 hours, the second
                             call returns the first order instead of creating
                             a new one. Without it, a retry after a timeout
                             creates a duplicate order.

    Success response
    201 Created. Returns the full order object, including the generated
    order_id and a status field, which is always "pending" on creation.

    Errors
    400  A field is missing or invalid. The response body names the field.
    401  The token is missing or expired.
    409  The Idempotency-Key was reused with a different request body.
    422  The customer exists but is blocked from ordering.
    429  Rate limit exceeded. The Retry-After header gives the number of
         seconds to wait. Retrying before that returns 429 again and the
         attempt still counts against your limit.

    Rate limit
    60 requests per minute per token, measured in a rolling window.
    Bulk imports should use POST /v2/orders/batch, which accepts up to
    500 orders in one call and counts as a single request.

    Pagination
    Not applicable to this endpoint. GET /v2/orders returns 50 per page
    and provides next_cursor. An empty next_cursor means the last page.
  text_vi: |
    POST /v2/orders

    Tạo một đơn hàng.

    Nội dung yêu cầu
    customer_id     chuỗi   bắt buộc
    items           mảng    bắt buộc, ít nhất một mục
    currency        chuỗi   không bắt buộc, mặc định VND
    note            chuỗi   không bắt buộc, tối đa 200 ký tự
    delivery_date   chuỗi   không bắt buộc, dạng ngày ISO. Nếu bỏ trống thì
                            đơn được tạo mà không có ngày giao và cập nhật
                            được sau. Gửi ngày trong quá khứ trả về 400.

    Header
    Idempotency-Key  chuỗi  không bắt buộc nhưng rất nên dùng. Nếu gửi cùng
                            một khoá hai lần trong 24 giờ, lần thứ hai trả về
                            đơn đã tạo lần đầu thay vì tạo đơn mới. Không có
                            khoá này thì gọi lại sau timeout sẽ tạo đơn trùng.

    Phản hồi thành công
    201 Created. Trả về toàn bộ đối tượng đơn hàng, gồm order_id được sinh ra
    và trường status, lúc tạo luôn là "pending".

    Lỗi
    400  Thiếu hoặc sai một trường. Nội dung phản hồi ghi rõ tên trường.
    401  Thiếu token hoặc token hết hạn.
    409  Idempotency-Key bị dùng lại với nội dung yêu cầu khác.
    422  Khách hàng tồn tại nhưng đang bị chặn đặt hàng.
    429  Vượt giới hạn gọi. Header Retry-After cho biết số giây phải chờ.
         Gọi lại trước thời hạn đó vẫn trả về 429 và lần gọi đó vẫn bị tính
         vào hạn mức.

    Giới hạn gọi
    60 yêu cầu mỗi phút cho mỗi token, tính theo cửa sổ trượt.
    Nhập hàng loạt nên dùng POST /v2/orders/batch, nhận tối đa 500 đơn
    trong một lần gọi và chỉ tính là một yêu cầu.

    Chia trang
    Không áp dụng cho endpoint này. GET /v2/orders trả 50 đơn mỗi trang
    và cung cấp next_cursor. next_cursor rỗng nghĩa là đã tới trang cuối.
  questions:
    - kind: mcq_read
      prompt_en: "Which fields are required?"
      choices: ["All of them", "customer_id, items and currency", "customer_id and items"]
      answer: 2
      difficulty: 1
      reading_skill: scan
      skill: Reading
    - kind: mcq_read
      prompt_en: "You time out and retry without an Idempotency-Key. What happens?"
      choices: ["A duplicate order is created", "The first order is returned", "You get 409"]
      answer: 0
      difficulty: 3
      reading_skill: scan
      skill: Reading
    - kind: mcq_read
      prompt_en: "You get 429 and retry immediately. What does the doc say?"
      choices: ["It succeeds", "You get 429 again and the attempt still counts against the limit", "The limit resets"]
      answer: 1
      difficulty: 3
      reading_skill: scan
      skill: Reading
    - kind: mcq_read
      prompt_en: "You need to import 400 orders. What is the right call?"
      choices: ["400 calls to POST /v2/orders", "Wait 400 minutes", "One call to POST /v2/orders/batch"]
      answer: 2
      difficulty: 2
      reading_skill: skim
      skill: Reading
    - kind: mcq_read
      prompt_en: "What does 422 mean here, as opposed to 400?"
      choices: ["The customer exists but is blocked from ordering", "A field is malformed", "The token expired"]
      answer: 0
      difficulty: 3
      reading_skill: scan
      skill: Reading

writing:
  kind: GuidedEmail
  prompt_vi: >
    Viết ba câu tóm tắt một endpoint cho đồng nghiệp sắp tích hợp:
    trường bắt buộc, giới hạn gọi, và cách xử lý gọi lại an toàn.
  prompt_en: "Summarise an API endpoint for a colleague."
  required_points:
    - "required"
    - "rate limit"
    - "returns"
  hint_vi: "Ba câu này tiết kiệm cho người đọc một ngày dò lỗi."
  sample_en: "POST /v2/orders requires customer_id and items; currency is optional and defaults to VND. The rate limit is 60 requests per minute per token, so use the batch endpoint for anything over about fifty orders because it counts as a single request. Always send an Idempotency-Key: without it a retry after a timeout creates a duplicate order, and it returns 429 with a Retry-After header when you go over the limit."

