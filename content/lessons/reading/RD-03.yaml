schema_version: 1
code: RD-03
slug: doc-tai-lieu-api
title_vi: "Đọc tài liệu API — hiểu đúng trước khi gõ dòng code đầu tiên"
title_en: "Reading API documentation"

layer: Professional
track: Reading
level: B1
unit_code: U-RD2
order_index: 3
estimated_minutes: 12
is_checkpoint: false

illustration: api-doc

objective_vi: >
  Đọc trang tài liệu một API và trả lời được bốn câu: cần gì để gọi, trả về gì,
  lỗi thì trả gì, và bị giới hạn bao nhiêu lần một phút.

objective_observable: >
  Đạt từ 75 điểm trên cả bốn trục kỹ năng, không trục nào dưới 60.

mastery_weights:
  Listening: 0.15
  Speaking: 0.20
  Reading: 0.45
  Writing: 0.20

prerequisites:
  - lesson: RD-02
    min_mastery: 70
    kind: Hard
  - lesson: RD-01
    min_mastery: 65
    kind: Soft

vocabulary:
  - term: "required"
    ipa: "/rɪˈkwaɪərd/"
    meaning_vi: "bắt buộc"
    chunk: "The customer id is required."
    emoji: "❗"
    mnemonic_vi: "Ôn lại \"request\" cùng gốc — thứ hệ thống ĐÒI phải có. Thiếu nó thì gọi API trả lỗi ngay, chưa kịp làm gì."
    tags: [reading, core]
  - term: "optional"
    ipa: "/ˈɒpʃənl/"
    meaning_vi: "không bắt buộc"
    chunk: "The date range is optional and defaults to today."
    emoji: "🔘"
    mnemonic_vi: "\"option\" là LỰA CHỌN. Nhưng cẩn thận: bỏ trống không có nghĩa là không có giá trị — nó rơi về mặc định, và mặc định có thể không như bạn tưởng."
    tags: [reading, core]
  - term: "defaults to"
    ipa: "/dɪˈfɔːlts tuː/"
    meaning_vi: "mặc định là"
    chunk: "The page size defaults to 50."
    emoji: "⚙️"
    mnemonic_vi: "Dòng đáng đọc nhất trong tài liệu API. Không đọc mặc định thì rất dễ tưởng mình lấy hết dữ liệu trong khi chỉ lấy được 50 dòng đầu."
    tags: [reading, core]
  - term: "rate limit"
    ipa: "/reɪt ˈlɪmɪt/"
    meaning_vi: "giới hạn số lần gọi"
    chunk: "The rate limit is 60 requests per minute."
    emoji: "🚦"
    mnemonic_vi: "\"rate\" là NHỊP ĐỘ, như nhịp tim. Vượt nhịp cho phép thì bị chặn — đây là thứ làm hỏng những đoạn script chạy vòng lặp không nghỉ."
    tags: [reading, core]
  - term: "returns"
    ipa: "/rɪˈtɜːrnz/"
    meaning_vi: "trả về"
    chunk: "It returns 404 if the order does not exist."
    emoji: "↩️"
    mnemonic_vi: "Đọc kỹ phần \"returns\" cho trường hợp LỖI, không chỉ trường hợp thành công. Phần lớn lỗi lập trình nằm ở nhánh không ai đọc."
    tags: [reading, core]
  - term: "idempotent"
    ipa: "/aɪˈdempətənt/"
    meaning_vi: "gọi lại nhiều lần vẫn cho cùng kết quả"
    chunk: "The endpoint is idempotent, so a retry is safe."
    emoji: "🔂"
    mnemonic_vi: "\"idem\" tiếng Latin là NHƯ TRÊN, y hệt. Như nút bấm thang máy: bấm mười lần cũng chỉ gọi một lần thang. Có tính chất này thì thử lại mới an toàn."
    tags: [reading, core]
  - term: "pagination"
    ipa: "/ˌpædʒɪˈneɪʃn/"
    meaning_vi: "chia trang kết quả"
    chunk: "Use the next_cursor field for pagination."
    emoji: "📄"
    mnemonic_vi: "\"page\" là TRANG. Dữ liệu quá nhiều thì chia trang mà trả. Không xử lý phần này là chỉ lấy được trang đầu mà tưởng đã lấy hết."
    tags: [reading, core]

sentence_patterns:
  - pattern: "{Field} is {status} and defaults to {value}."
    meaning_vi: "{Field} là {status} và mặc định là {value}."
    slots:
      Field: ["The page size", "The date range", "The currency"]
      status: ["required", "optional"]
      value: ["50", "today", "VND"]
  - pattern: "It returns {code} when {condition}."
    meaning_vi: "Nó trả về {code} khi {condition}."
    slots:
      code: ["404", "429", "409"]
      condition: ["the order does not exist", "you exceed the rate limit", "the same key was already used"]

dialogue:
  context_vi: >
    Anh Hải sắp viết code gọi API của đối tác. Bạn nhắc anh đọc trước
    bốn chỗ quan trọng nhất.
  turns:
    - speaker: "Hải"
      en: "I've got the endpoint URL. I'll just start coding and see what happens."
      vi: "Anh có địa chỉ endpoint rồi. Anh cứ viết code rồi xem sao."
    - speaker: "You"
      en: "Read four things first. It saves a day. What's required, what it returns, what the errors are, and the rate limit."
      vi: "Anh đọc bốn chỗ trước đã, tiết kiệm được một ngày. Cái gì bắt buộc, nó trả về gì, lỗi là gì, và giới hạn số lần gọi."
    - speaker: "Hải"
      en: "The rate limit matters that much?"
      vi: "Giới hạn gọi quan trọng thế à?"
    - speaker: "You"
      en: "It's the one that bites in production. Sixty per minute is fine in testing with ten records and breaks with four thousand."
      vi: "Đó là cái cắn mình lúc chạy thật. Sáu mươi lần một phút thì thử với mười bản ghi không sao, chạy bốn nghìn bản ghi là hỏng."
    - speaker: "Hải"
      en: "Fair. What about errors?"
      vi: "Hợp lý. Còn lỗi thì sao?"
    - speaker: "You"
      en: "Look for 429 and 409 specifically. 429 means slow down. 409 usually means you sent the same thing twice."
      vi: "Tìm riêng 429 và 409. 429 nghĩa là chậm lại. 409 thường nghĩa là anh gửi trùng hai lần."
    - speaker: "Hải"
      en: "And if I retry after a timeout, do I create two orders?"
      vi: "Nếu timeout rồi anh gọi lại thì có tạo hai đơn không?"
    - speaker: "You"
      en: "That's the idempotency question. Check whether the endpoint takes an idempotency key. If it does, a retry is safe."
      vi: "Đó chính là câu hỏi về idempotency. Kiểm xem endpoint có nhận khoá idempotency không. Có thì gọi lại an toàn."

listening:
  context_vi: >
    Nghe hai người chuẩn bị tích hợp API. Chú ý ai hỏi được câu
    ngăn được sự cố lúc chạy thật.
  speed: 1.2
  voice: en_US_male
  transcript_en: "Developer one: I have the URL and an example request from the docs, that is enough to start. Developer two: before I write anything I check four things. Which fields are required, what the success response looks like, which error codes exist, and the rate limit. The rate limit is the one that never shows up in testing and always shows up in production."
  transcript_vi: "Lập trình viên một: tôi có địa chỉ và một yêu cầu mẫu trong tài liệu, thế là đủ để bắt đầu. Lập trình viên hai: trước khi viết gì tôi kiểm bốn thứ. Trường nào bắt buộc, phản hồi thành công trông thế nào, có những mã lỗi nào, và giới hạn số lần gọi. Giới hạn gọi là thứ không bao giờ lộ ra lúc thử và luôn lộ ra lúc chạy thật."
  questions:
    - kind: mcq_listen
      prompt_vi: "Lập trình viên hai kiểm mấy thứ trước khi viết code?"
      choices: ["Bốn", "Hai", "Sáu"]
      answer: 0
      difficulty: 1
      skill: Listening
    - kind: mcq_listen
      prompt_vi: "Thứ nào được nói là không lộ ra lúc thử?"
      choices: ["Trường bắt buộc", "Mã lỗi", "Giới hạn số lần gọi"]
      answer: 2
      difficulty: 2
      skill: Listening
    - kind: mcq_listen
      prompt_vi: "Vì sao yêu cầu mẫu trong tài liệu không đủ?"
      choices: ["Vì nó sai", "Vì nó không cho biết lỗi, giới hạn và trường bắt buộc", "Vì nó quá dài"]
      answer: 1
      difficulty: 3
      skill: Listening

