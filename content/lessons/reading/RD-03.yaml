    answer: 2
    difficulty: 2
    skill: Writing

explanation:
  why_vi: >
    Ai cũng đọc phần yêu cầu mẫu rồi bắt đầu viết code, vì phần đó copy dán được ngay.
    Nhưng yêu cầu mẫu chỉ mô tả trường hợp thuận lợi. Ba thứ làm hỏng việc lúc chạy thật —
    giới hạn số lần gọi, mã lỗi, và chuyện gọi lại có tạo bản ghi trùng không —
    đều nằm ở phần không ai đọc.
  how_vi: >
    Bốn câu hỏi, theo đúng thứ tự này, trước khi gõ dòng code đầu tiên.
    Một: trường nào BẮT BUỘC, trường nào có giá trị mặc định. Hai: phản hồi thành công
    TRẢ VỀ gì. Ba: có những MÃ LỖI nào, đặc biệt là 429 và 409. Bốn: GIỚI HẠN GỌI
    bao nhiêu một phút, và có endpoint gọi theo lô không.
    Câu thứ tư là câu tiết kiệm nhiều thời gian nhất, vì lỗi đó chỉ lộ ra ở môi trường thật.
  contrast_vi: >
    "Có URL và yêu cầu mẫu là đủ để bắt đầu" dẫn tới một ngày dò lỗi khi dữ liệu thật
    gấp bốn trăm lần dữ liệu thử. "Sáu mươi lần một phút, nên với bốn trăm đơn thì
    dùng endpoint gọi theo lô" là thông tin đọc mất ba mươi giây và tránh được cả ngày đó.

common_mistakes:
  - mistake: "Chỉ đọc yêu cầu mẫu rồi bắt đầu viết code"
    why_vi: >
      Yêu cầu mẫu copy dán được ngay nên cảm giác như đã đủ.
      Nhưng nó chỉ mô tả đường thuận lợi, không mô tả lúc hỏng.
    fix_vi: "Đọc thêm ba mục: mã lỗi, giới hạn gọi, và phần idempotency."
    detect_phoneme_missing: []
  - mistake: "Bỏ qua giới hạn số lần gọi vì lúc thử không chạm ngưỡng"
    why_vi: >
      Môi trường thử có mười bản ghi nên không bao giờ vượt sáu mươi lần một phút.
      Dữ liệu thật có bốn nghìn và vượt ngay trong phút đầu.
