reading:
  kind: postmortem
  context_vi: >
    Bản postmortem viết theo mẫu của Google SRE. Đọc và tách cho được
    nguyên nhân gốc, thứ châm ngòi, và cách phát hiện.
  text_en: |
    Postmortem: order service unavailable, 12 June

    Date: 12 June 2026
    Authors: platform team
    Status: final, action items tracked

    Summary
    The order service was unavailable for 1 hour 12 minutes after the
    database volume filled to 100%.

    Impact
    About 2,400 orders could not be created between 02:41 and 03:53.
    Roughly 900 were retried successfully by partners afterwards; the
    remaining 1,500 were lost and had to be re-entered by hand over the
    following two days.

    Root cause
    No alert existed for disk space on the database data volume. The
    volume had been filling since the retention change on 28 April, at
    roughly 1.4 GB a day, and reached capacity on 12 June. No dashboard
    displayed this volume either, so the growth was invisible for six weeks.

    Trigger
    The nightly export job at 02:00 wrote a 6 GB temporary file to the
    same volume. This was normal behaviour and had run every night since
    March without incident. It consumed the last free space.

    Contributing factors
    The runbook for "database out of disk" pointed to a directory that was
    moved in a 2025 refactor, so the on-call engineer spent 20 minutes
    looking in the wrong place.
    The retention change in April was reviewed and approved, but the review
    did not ask what it would do to disk growth.

    Detection
    A partner called the service desk at 02:41. No monitor fired. Detection
    took 47 minutes from the first failed write.

    Resolution
    The on-call engineer deleted the temporary export file at 03:49, which
    freed 6 GB and brought the service back at 03:53. Retention was reduced
    to 30 days the same morning, freeing 340 GB.

    Lessons learned
    What went well: once the cause was found, recovery took four minutes.
    What went badly: a six-week-long condition was invisible, and the
    runbook was wrong.
    Where we got lucky: the export file was still on disk. Had it been
    cleaned up automatically, we would have had no quick space to free.

    Action items
    1. Alert on disk usage above 80% for all database volumes. Owner:
       platform team. Due 19 June. This is the item that prevents recurrence.
    2. Add every mounted volume to the capacity dashboard. Owner: platform
       team. Due 26 June.
    3. Add a disk-growth question to the change review checklist. Owner:
       change manager. Due 30 June.
    4. Fix the runbook path and add a quarterly runbook test. Owner:
       on-call rota. Due 15 July.
    Moving the export job was considered and rejected: it would hide the
    condition rather than fix it.
  text_vi: |
    Postmortem: dịch vụ đơn hàng ngừng chạy, 12 tháng Sáu

    Ngày: 12 tháng Sáu 2026
    Người viết: nhóm nền tảng
    Trạng thái: bản cuối, việc cần làm đang được theo dõi

    Tóm tắt
    Dịch vụ đơn hàng ngừng chạy 1 giờ 12 phút sau khi phân vùng của
    cơ sở dữ liệu đầy 100%.

    Tác động
    Khoảng 2.400 đơn không tạo được trong khoảng 02:41 tới 03:53.
    Chừng 900 đơn được đối tác gửi lại thành công sau đó; 1.500 đơn còn lại
    bị mất và phải nhập tay trong hai ngày kế tiếp.

    Nguyên nhân gốc
    Không có cảnh báo dung lượng đĩa cho phân vùng dữ liệu của cơ sở dữ liệu.
    Phân vùng này đầy dần từ lần đổi thời gian lưu ngày 28 tháng Tư, khoảng
    1,4 GB mỗi ngày, và chạm trần ngày 12 tháng Sáu. Cũng không bảng điều khiển
    nào hiển thị phân vùng này, nên mức tăng vô hình suốt sáu tuần.

    Thứ châm ngòi
    Job xuất dữ liệu hằng đêm lúc 02:00 ghi một file tạm 6 GB vào cùng phân vùng.
    Đây là hành vi bình thường và đã chạy mỗi đêm từ tháng Ba mà không có sự cố.
    Nó dùng nốt phần trống cuối cùng.

    Yếu tố góp phần
    Sổ tay xử lý "cơ sở dữ liệu hết đĩa" trỏ tới một thư mục đã bị dời trong đợt
    tái cấu trúc năm 2025, nên kỹ sư trực mất 20 phút tìm nhầm chỗ.
    Lần đổi thời gian lưu hồi tháng Tư có được duyệt, nhưng buổi duyệt không hỏi
    việc đó ảnh hưởng thế nào tới mức tăng dung lượng đĩa.

    Phát hiện
    Một đối tác gọi tới service desk lúc 02:41. Không bộ giám sát nào kêu.
    Mất 47 phút từ lần ghi hỏng đầu tiên mới phát hiện ra.

    Khắc phục
    Kỹ sư trực xoá file tạm của job xuất lúc 03:49, giải phóng 6 GB và đưa dịch vụ
    trở lại lúc 03:53. Thời gian lưu được giảm về 30 ngày ngay sáng hôm đó,
    giải phóng 340 GB.

    Bài học rút ra
    Điều làm tốt: khi đã tìm ra nguyên nhân thì khôi phục chỉ mất bốn phút.
    Điều làm chưa tốt: một tình trạng kéo dài sáu tuần mà vô hình, và sổ tay xử lý sai.
    Chỗ mình gặp may: file xuất vẫn còn trên đĩa. Nếu nó đã bị dọn tự động thì
    sẽ không có chỗ trống nào để giải phóng nhanh.

    Việc cần làm
    1. Cảnh báo khi dung lượng đĩa vượt 80% trên mọi phân vùng cơ sở dữ liệu.
       Người chịu trách nhiệm: nhóm nền tảng. Hạn 19 tháng Sáu.
       Đây là việc ngăn sự cố lặp lại.
    2. Đưa mọi phân vùng đang gắn vào bảng theo dõi dung lượng.
       Người chịu trách nhiệm: nhóm nền tảng. Hạn 26 tháng Sáu.
    3. Thêm câu hỏi về mức tăng dung lượng đĩa vào danh mục duyệt thay đổi.
       Người chịu trách nhiệm: quản lý thay đổi. Hạn 30 tháng Sáu.
    4. Sửa đường dẫn trong sổ tay và thêm bài kiểm tra sổ tay hằng quý.
       Người chịu trách nhiệm: nhóm trực. Hạn 15 tháng Bảy.
    Phương án dời job xuất đã được cân nhắc và bị loại: nó che tình trạng đi
    chứ không sửa được.
