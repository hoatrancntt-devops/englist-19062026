explanation:
  why_vi: >
    Thứ châm ngòi luôn dễ thấy: nó xảy ra đúng hôm đó, có dấu thời gian, có tên.
    Nguyên nhân gốc thì vô hình, vì nó là một thứ VẮNG MẶT — thiếu cảnh báo,
    thiếu giới hạn, thiếu một câu hỏi trong buổi duyệt. Nhóm nào sửa thứ châm ngòi
    thì sự cố quay lại sau vài tháng dưới một hình dạng khác, và lần đó không ai
    nhận ra là cùng một vấn đề.
  how_vi: >
    Phép thử một câu: "nếu bỏ thứ này đi, sự cố có xảy ra được nữa không?"
    Bỏ job xuất — đĩa vẫn đầy, chỉ là chậm hơn vài ngày, nên job xuất là châm ngòi.
    Bỏ việc thiếu cảnh báo — nghĩa là có cảnh báo — thì đĩa đầy được phát hiện từ
    sáu tuần trước, nên đó là nguyên nhân gốc.
    Đọc postmortem thì luôn đọc ba mục theo thứ tự: Root cause, Trigger, Detection.
    Mục Detection cho biết bạn có phát hiện được lần sau hay không.
  contrast_vi: >
    "Job xuất làm đầy đĩa nên dời nó sang cuối tuần" sửa được đúng đêm mười hai.
    "Không có cảnh báo dung lượng nên đĩa đầy dần sáu tuần mà vô hình" sửa được
    mọi lần đĩa đầy trong tương lai — và bản postmortem này còn ghi rõ phương án dời job
    đã bị loại vì nó che tình trạng đi chứ không sửa.

common_mistakes:
  - mistake: "Lấy sự kiện gần nhất làm nguyên nhân gốc"
    why_vi: >
      Sự kiện đó có dấu thời gian trùng với lúc hỏng nên nhìn như thủ phạm.
      Nhưng nó thường đã lặp lại vô hại hàng trăm lần trước đó.
    fix_vi: "Hỏi: thứ này chạy bao lâu rồi mà không sao? Lâu thì nó là châm ngòi."
    detect_phoneme_missing: []
  - mistake: "Bỏ qua mục Detection"
    why_vi: >
      Mọi người tập trung vào nguyên nhân và cách sửa. Nhưng nếu lần sau vẫn
      phải chờ khách hàng gọi thì thời gian ngừng chạy vẫn dài như cũ.
    fix_vi: "Luôn hỏi: lần sau mình biết trước hay lại chờ khách hàng gọi?"
    detect_phoneme_missing: []
  - mistake: "Viết việc cần làm không có người và không có hạn"
    why_vi: >
      Trong buổi họp thì cả nhóm đều gật, nên viết chung chung thấy đủ.
      Ba tháng sau không ai nhớ mình nhận việc gì.
    fix_vi: "Mỗi việc một tên người và một ngày. Không có hai thứ đó thì đó là mong muốn, không phải việc."
    detect_phoneme_missing: []

memory_trick_vi: >
  Phép thử: BỎ THỨ NÀY ĐI THÌ SỰ CỐ CÒN XẢY RA ĐƯỢC KHÔNG?
  Còn — đó là châm ngòi. Không còn — đó là nguyên nhân gốc.
  Và nguyên nhân gốc gần như luôn là một thứ VẮNG MẶT, không phải một sự kiện.
