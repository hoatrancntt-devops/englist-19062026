schema_version: 1
code: RD-04
slug: doc-postmortem
title_vi: "Đọc postmortem — phân biệt nguyên nhân gốc với thứ châm ngòi"
title_en: "Reading a postmortem"

layer: Professional
track: Reading
level: B1
unit_code: U-RD2
order_index: 4
estimated_minutes: 12
is_checkpoint: true

illustration: postmortem-timeline

objective_vi: >
  Đọc một bản postmortem và chỉ đúng đâu là nguyên nhân gốc, đâu chỉ là
  thứ châm ngòi — hai thứ hay bị lẫn và dẫn tới sửa nhầm chỗ.

objective_observable: >
  Đạt từ 80 điểm trên cả bốn trục kỹ năng, không trục nào dưới 65.

mastery_weights:
  Listening: 0.15
  Speaking: 0.20
  Reading: 0.45
  Writing: 0.20

prerequisites:
