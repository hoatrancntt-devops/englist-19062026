writing:
  kind: GuidedEmail
  prompt_vi: >
    Viết ba câu tóm tắt một postmortem: nguyên nhân gốc, thứ châm ngòi,
    và việc cần làm ngăn được lần sau.
  prompt_en: "Summarise a postmortem in three sentences."
  required_points:
    - "root cause"
    - "trigger"
    - "action item"
  hint_vi: "Nguyên nhân gốc thường là một thứ vắng mặt, không phải một sự kiện."
  sample_en: "The root cause was that no alert existed for disk space on the database volume, which had been filling at 1.4 GB a day since the April retention change and was invisible for six weeks. The trigger was the nightly export writing a 6 GB temporary file on 12 June, which had run without incident since March. The action item that prevents recurrence is an alert at 80% disk usage on every database volume, due 19 June; moving the export was rejected because it would hide the condition rather than fix it."

