    min_mastery: 65
    kind: Soft

vocabulary:
  - term: "root cause"
    ipa: "/ruːt kɔːz/"
    meaning_vi: "nguyên nhân gốc — điều kiện khiến sự cố có thể xảy ra"
    chunk: "The root cause was a missing disk alert."
    tags: [reading, core]
  - term: "trigger"
    ipa: "/ˈtrɪɡər/"
    meaning_vi: "thứ châm ngòi — sự kiện làm nó bùng ra hôm đó"
    chunk: "The trigger was a large export at 02:00."
    tags: [reading, core]
  - term: "detection"
    ipa: "/dɪˈtekʃn/"
    meaning_vi: "cách phát hiện ra sự cố"
    chunk: "Detection: a customer called, not an alert."
    tags: [reading, core]
  - term: "blameless"
    ipa: "/ˈbleɪmləs/"
    meaning_vi: "không quy trách nhiệm cá nhân"
    chunk: "This is a blameless postmortem."
    tags: [reading, core]
  - term: "action item"
    ipa: "/ˈækʃn ˈaɪtəm/"
    meaning_vi: "việc phải làm, có người và có hạn"
    chunk: "Each action item has an owner and a date."
    tags: [reading, core]
  - term: "contributing factor"
    ipa: "/kənˈtrɪbjuːtɪŋ ˈfæktər/"
    meaning_vi: "yếu tố góp phần"
    chunk: "A contributing factor was the stale runbook."
    tags: [reading, core]

sentence_patterns:
  - pattern: "The root cause was {cause}, and the trigger was {trigger}."
    meaning_vi: "Nguyên nhân gốc là {cause}, còn thứ châm ngòi là {trigger}."
    slots:
      cause: ["a missing disk-space alert", "an unbounded retry loop", "no limit on the export size"]
      trigger: ["a large export at 02:00", "a routine deploy", "one slow partner API"]
  - pattern: "Detection took {time} because {reason}."
    meaning_vi: "Mất {time} mới phát hiện vì {reason}."
    slots:
      time: ["47 minutes", "two hours", "eleven minutes"]
      reason: ["no alert existed for that condition", "the alert went to an unused mailbox"]

dialogue:
  context_vi: >
    Anh Nam đọc xong bản postmortem và rút ra một kết luận. Bạn chỉ ra
    anh đang lẫn nguyên nhân gốc với thứ châm ngòi.
  turns:
    - speaker: "Nam"
      en: "So the cause was the big export job. We should stop running it at night."
      vi: "Vậy nguyên nhân là cái job xuất dữ liệu lớn. Mình nên thôi chạy nó ban đêm."
    - speaker: "You"
      en: "That was the trigger, not the root cause. The export ran every night for a year without a problem."
      vi: "Đó là thứ châm ngòi, không phải nguyên nhân gốc. Job đó chạy mỗi đêm suốt một năm mà không sao."
    - speaker: "Nam"
      en: "Then what's the root cause?"
      vi: "Thế nguyên nhân gốc là gì?"
    - speaker: "You"
      en: "There was no alert for disk space on that volume. The disk had been filling for weeks and nobody could see it."
      vi: "Không có cảnh báo dung lượng đĩa trên phân vùng đó. Đĩa đầy dần suốt mấy tuần mà không ai nhìn thấy."
    - speaker: "Nam"
      en: "But it only broke on the night of the export."
      vi: "Nhưng nó chỉ hỏng đúng đêm chạy job xuất."
    - speaker: "You"
      en: "Right. If we only move the export, the disk still fills. Something else triggers it next month and we're back here."
      vi: "Đúng ạ. Nếu chỉ dời job xuất thì đĩa vẫn đầy. Tháng sau một thứ khác châm ngòi và mình lại ngồi đây."
    - speaker: "Nam"
      en: "So the action item is the alert."
      vi: "Vậy việc cần làm là cái cảnh báo."
    - speaker: "You"
      en: "The alert first. Moving the export is fine too, but that one only buys time."
      vi: "Cảnh báo trước ạ. Dời job xuất cũng được, nhưng cái đó chỉ mua thêm thời gian."

listening:
  context_vi: >
    Nghe hai người tóm tắt cùng một bản postmortem. Chú ý ai tách được
    nguyên nhân gốc khỏi thứ châm ngòi.
  speed: 1.2
  voice: en_US_female
  transcript_en: "Summary one: the export job filled the disk and took the service down, so we move the export to the weekend. Summary two: the trigger was the export job on the night of the twelfth. The root cause was that no alert existed for disk space on that volume, so it had been filling for six weeks unseen. A contributing factor was that detection took forty-seven minutes because a customer called before any monitor noticed. Moving the export buys time. The alert is the fix."
  transcript_vi: "Tóm tắt một: job xuất dữ liệu làm đầy đĩa và làm sập dịch vụ, nên bọn tôi dời job xuất sang cuối tuần. Tóm tắt hai: thứ châm ngòi là job xuất đêm mười hai. Nguyên nhân gốc là không có cảnh báo dung lượng đĩa trên phân vùng đó, nên nó đầy dần suốt sáu tuần mà không ai thấy. Một yếu tố góp phần là mất bốn mươi bảy phút mới phát hiện, vì khách hàng gọi trước khi có bộ giám sát nào nhận ra. Dời job xuất chỉ mua thêm thời gian. Cảnh báo mới là cách sửa."
  questions:
    - kind: mcq_listen
      prompt_vi: "Theo tóm tắt hai, nguyên nhân gốc là gì?"
      choices: ["Không có cảnh báo dung lượng đĩa", "Job xuất dữ liệu", "Khách hàng gọi muộn"]
      answer: 0
      difficulty: 2
      skill: Listening
    - kind: mcq_listen
      prompt_vi: "Mất bao lâu mới phát hiện sự cố?"
      choices: ["Sáu tuần", "Mười hai phút", "Bốn mươi bảy phút"]
      answer: 2
      difficulty: 2
      skill: Listening
    - kind: mcq_listen
      prompt_vi: "Vì sao dời job xuất chưa đủ?"
      choices: ["Vì cuối tuần cũng bận", "Vì đĩa vẫn đầy, chỉ là thứ khác sẽ châm ngòi", "Vì job đó quan trọng"]
      answer: 1
      difficulty: 3
      skill: Listening

