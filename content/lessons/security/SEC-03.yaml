schema_version: 1
code: SEC-03
slug: lo-hong-va-ban-va
title_vi: "Lỗ hổng và bản vá"
title_en: "Vulnerabilities and patching"

layer: Professional
track: Security
level: B1
unit_code: U-SEC2
order_index: 3
estimated_minutes: 12

illustration: shield-lock

objective_vi: >
  Trao đổi về một lỗ hổng: mức nghiêm trọng, có bị khai thác thật không,
  và vì sao đôi khi phải chấp nhận rủi ro thay vì vá ngay.

objective_observable: >
  Giải thích được vì sao điểm CVSS cao chưa chắc là ưu tiên cao nhất, kèm ví dụ.

mastery_weights:
  Listening: 0.25
  Speaking: 0.30
  Reading: 0.25
  Writing: 0.20

prerequisites:
  - lesson: SEC-02
    min_mastery: 65
    kind: Hard

vocabulary:
  - term: "vulnerability"
    ipa: "/ˌvʌlnərəˈbɪləti/"
    meaning_vi: "lỗ hổng"
    chunk: "The vulnerability affects our web tier."
    tags: [security, core]
  - term: "actively exploited"
    ipa: "/ˈæktɪvli ɪkˈsplɔɪtɪd/"
    meaning_vi: "đang bị khai thác thật ngoài thực tế"
    chunk: "This one is being actively exploited."
    tags: [security, core]
  - term: "exposed to the internet"
    ipa: "/ɪkˈspoʊzd tuː ði ˈɪntərnet/"
    meaning_vi: "có mở ra Internet"
    chunk: "Only two servers are exposed to the internet."
    tags: [security, core]
  - term: "patch window"
    ipa: "/pætʃ ˈwɪndoʊ/"
    meaning_vi: "khung giờ được phép vá"
    chunk: "The next patch window is Saturday."
    tags: [security, core]
  - term: "compensating control"
    ipa: "/ˈkɒmpenseɪtɪŋ kənˈtroʊl/"
    meaning_vi: "biện pháp bù — giảm rủi ro khi chưa vá được"
    chunk: "A firewall rule is our compensating control."
    tags: [security]
  - term: "accept the risk"
    ipa: "/əkˈsept ðə rɪsk/"
    meaning_vi: "chấp nhận rủi ro (có người ký nhận)"
    chunk: "The business accepted the risk until December."
    tags: [security, core]

sentence_patterns:
  - pattern: "It's rated {severity}, but {qualifier}."
    meaning_vi: "Nó được xếp mức {severity}, nhưng {qualifier}."
    slots:
      severity: ["critical", "high", "medium"]
      qualifier: ["none of those servers are exposed to the internet", "it is being actively exploited"]
  - pattern: "Our compensating control is {control} until {when}."
    meaning_vi: "Biện pháp bù của bọn tôi là {control} cho tới {when}."
    slots:
      control: ["a firewall rule", "disabling that feature"]
      when: ["the December patch window", "the vendor fix arrives"]

dialogue:
  context_vi: >
    Có hai lỗ hổng mới. Một cái điểm cao hơn nhưng không nguy hiểm bằng cái kia.
    Giải thích được nghịch lý đó là kỹ năng cốt lõi của nghề bảo mật.
  turns:
    - speaker: "David"
      en: "I saw the advisory. Two criticals — are we exposed?"
      vi: "Tôi thấy bản cảnh báo. Hai lỗ hổng nghiêm trọng — bọn ta có bị ảnh hưởng không?"
    - speaker: "You"
      en: "Two findings, but they're not equal. CVE-2026-1147 is rated 9.8, the higher score. It affects our database servers."
      vi: "Hai phát hiện, nhưng không ngang nhau. CVE-2026-1147 được chấm 9.8, điểm cao hơn. Nó ảnh hưởng các máy chủ database của mình."
    - speaker: "David"
      en: "So that's the priority."
      vi: "Vậy đó là ưu tiên."
    - speaker: "You"
      en: "Actually no. Those servers aren't exposed to the internet — they only accept connections from the app tier. To exploit it, an attacker would already have to be inside."
      vi: "Thực ra không ạ. Mấy máy chủ đó không mở ra Internet — chúng chỉ nhận kết nối từ tầng ứng dụng. Muốn khai thác thì kẻ tấn công phải vào được bên trong rồi."
    - speaker: "David"
      en: "And the other one?"
      vi: "Còn cái kia?"
    - speaker: "You"
      en: "CVE-2026-1203, rated 7.5 — lower score. But it's on the public web tier, and it's being actively exploited in the wild since Tuesday."
      vi: "CVE-2026-1203, chấm 7.5 — điểm thấp hơn. Nhưng nó nằm ở tầng web công khai, và đang bị khai thác thật ngoài thực tế từ thứ Ba."
    - speaker: "David"
      en: "So we patch the lower-scoring one first."
      vi: "Vậy mình vá cái điểm thấp hơn trước."
    - speaker: "You"
      en: "That's my recommendation. Tonight as an emergency change. The 9.8 can wait for Saturday's patch window."
      vi: "Đó là đề xuất của em. Tối nay dạng emergency change. Cái 9.8 chờ được tới khung giờ vá thứ Bảy."

listening:
  context_vi: >
    Nghe cách xếp ưu tiên hai lỗ hổng. Chú ý ba yếu tố được cân nhắc,
    không chỉ mỗi điểm số.
  speed: 1.0
  voice: en_US_female
  transcript_en: "We look at three things, not just the score. First, is it exposed to the internet. Second, is it being actively exploited. Third, what would an attacker actually get. A 7.5 on a public web server beats a 9.8 on an internal database every time."
  transcript_vi: "Bọn tôi nhìn ba thứ, không chỉ điểm số. Thứ nhất, nó có mở ra Internet không. Thứ hai, nó có đang bị khai thác thật không. Thứ ba, kẻ tấn công thực sự lấy được gì. Một cái 7.5 trên máy chủ web công khai luôn được ưu tiên hơn một cái 9.8 trên database nội bộ."
  questions:
    - kind: mcq_listen
      prompt_vi: "Có mấy yếu tố được cân nhắc ngoài điểm số?"
      choices: ["Ba", "Một", "Năm"]
      answer: 0
      difficulty: 2
      skill: Listening
    - kind: mcq_listen
      prompt_vi: "Vì sao 7.5 lại được ưu tiên hơn 9.8?"
      choices: ["Vì dễ vá hơn", "Vì mới hơn", "Vì nằm trên máy chủ công khai và đang bị khai thác"]
      answer: 2
      difficulty: 2
      skill: Listening

speaking_drills:
  - kind: read_aloud
    expected_text: "It's rated nine point eight, but it's not exposed to the internet."
    prompt_vi: "Đọc điểm số: nine point eight. Nêu điểm rồi nêu bối cảnh ngay."
    ipa: "/ɪts ˈreɪtɪd naɪn pɔɪnt eɪt/"
    focus_phonemes: ["tɪd", "nt"]
  - kind: read_aloud
    expected_text: "This one is being actively exploited in the wild."
    prompt_vi: "Cụm quyết định mức khẩn. Chú ý /kspl/ trong exploited."
    ipa: "/ðɪs wʌn ɪz ˈbiːɪŋ ˈæktɪvli ɪkˈsplɔɪtɪd/"
    focus_phonemes: ["kspl", "tɪd"]
  - kind: shadow
    expected_text: "Our compensating control is a firewall rule."
    prompt_vi: "Biện pháp bù khi chưa vá được. Nghe rồi nhắc lại."
    ipa: "/aʊər ˈkɒmpenseɪtɪŋ kənˈtroʊl/"
    focus_phonemes: ["mp", "tr"]
  - kind: shadow
    expected_text: "The next patch window is Saturday at two."
    prompt_vi: "Khung giờ được phép vá. Chú ý /tʃ/ cuối chữ patch."
    ipa: "/ðə nekst pætʃ ˈwɪndoʊ ɪz ˈsætərdeɪ/"
    focus_phonemes: ["tʃ", "nd"]
  - kind: respond
    prompt_en: "Two criticals - are we exposed?"
    prompt_vi: "Trả lời bằng ba yếu tố: có mở ra Internet không, có bị khai thác không, lấy được gì."
    accept_patterns:
      - "exposed"
      - "actively exploited"
      - "not equal"

reading:
  kind: email
  context_vi: >
    Bản đánh giá hai lỗ hổng gửi lãnh đạo. Để ý cách xếp ưu tiên không theo điểm số.
  text_en: |
    Subject: Vulnerability assessment - CVE-2026-1147 and CVE-2026-1203

    Hi David,

    Two findings from this week's advisory. They are not equally urgent.

    CVE-2026-1203 - score 7.5, PATCH TONIGHT
    Affects: the public web tier (2 servers, internet facing).
    Actively exploited in the wild since 11 August.
    An attacker needs no credentials. Recommend an emergency change tonight.
    Downtime: 5 minutes per server, rolling, so no user impact.

    CVE-2026-1147 - score 9.8, PATCH SATURDAY
    Affects: 4 database servers, internal only.
    No public exploit code available. The servers accept connections only
    from the app tier, so an attacker would already need internal access.
    Compensating control: existing firewall rules already block direct access.
    Recommend the normal Saturday patch window.

    In short: the lower score is the higher priority, because it is reachable
    from the internet and already being used by attackers.

    Minh
  text_vi: |
    Tiêu đề: Đánh giá lỗ hổng - CVE-2026-1147 và CVE-2026-1203

    Chào anh David,

    Hai phát hiện từ bản cảnh báo tuần này. Mức khẩn không ngang nhau.

    CVE-2026-1203 - điểm 7.5, VÁ TỐI NAY
    Ảnh hưởng: tầng web công khai (2 máy chủ, mở ra Internet).
    Đang bị khai thác thật ngoài thực tế từ 11 tháng 8.
    Kẻ tấn công không cần tài khoản. Đề xuất emergency change tối nay.
    Gián đoạn: 5 phút mỗi máy, chạy cuốn chiếu nên không ảnh hưởng người dùng.

    CVE-2026-1147 - điểm 9.8, VÁ THỨ BẢY
    Ảnh hưởng: 4 máy chủ database, chỉ nội bộ.
    Chưa có mã khai thác công khai. Các máy chủ chỉ nhận kết nối
    từ tầng ứng dụng, nên kẻ tấn công phải vào được nội bộ trước đã.
    Biện pháp bù: quy tắc tường lửa hiện có đã chặn truy cập trực tiếp.
    Đề xuất dùng khung giờ vá thông thường thứ Bảy.

    Tóm lại: điểm thấp hơn lại là ưu tiên cao hơn, vì nó tiếp cận được
    từ Internet và đã bị kẻ tấn công dùng thật.

    Minh
  questions:
    - kind: mcq_read
      prompt_en: "Which vulnerability is patched first?"
      choices: ["CVE-2026-1147 (9.8)", "CVE-2026-1203 (7.5)", "Both at the same time"]
      answer: 1
      difficulty: 2
      reading_skill: scan
      skill: Reading
    - kind: mcq_read
      prompt_en: "Why can CVE-2026-1147 wait?"
      choices: ["It is not real", "It is too hard to patch", "Internal only, no public exploit, firewall already blocks direct access"]
      answer: 2
      difficulty: 3
      reading_skill: skim
      skill: Reading
    - kind: mcq_read
      prompt_en: "Will users notice the tonight patch?"
      choices: ["No, it is rolling across two servers", "Yes, 5 minutes downtime", "Not stated"]
      answer: 0
      difficulty: 2
      reading_skill: scan
      skill: Reading

writing:
  kind: GuidedEmail
  prompt_vi: >
    Viết đánh giá một lỗ hổng. Phải có đủ ba ý: điểm số và hệ thống bị ảnh hưởng,
    lỗ hổng có mở ra Internet và có đang bị khai thác không, và đề xuất khung giờ vá.
  prompt_en: "Write a vulnerability assessment."
  required_points:
    - "rated"
    - "exposed to the internet"
    - "patch window"
  hint_vi: "Ba ý. Điểm số chỉ là một yếu tố — bối cảnh mới quyết định ưu tiên."
  sample_en: "CVE-2026-1203 is rated 7.5 and affects two web servers. They are exposed to the internet and the flaw is being actively exploited. I recommend an emergency change tonight rather than waiting for the Saturday patch window."

quiz:
  - kind: mcq
    prompt_vi: "Điểm CVSS cao có luôn nghĩa là ưu tiên cao nhất không?"
    choices: ["Có, luôn luôn", "Không — còn phụ thuộc có mở ra Internet và có bị khai thác thật không", "Không quan trọng"]
    answer: 1
    difficulty: 2
    skill: Reading
  - kind: mcq
    prompt_vi: "\"Actively exploited\" nghĩa là gì?"
    choices: ["Có thể bị khai thác trên lý thuyết", "Đã được vá", "Đang bị khai thác thật ngoài thực tế"]
    answer: 2
    difficulty: 1
    skill: Listening
  - kind: mcq
    prompt_vi: "\"Compensating control\" là gì?"
    choices: ["Biện pháp giảm rủi ro khi chưa vá được", "Bản vá thay thế", "Khoản bồi thường"]
    answer: 0
    difficulty: 2
    skill: Reading
  - kind: mcq
    prompt_vi: "\"Accept the risk\" nên đi kèm điều gì?"
    choices: ["Không cần gì thêm", "Có người có thẩm quyền ký nhận và một mốc xem lại", "Một bản vá"]
    answer: 1
    difficulty: 3
    skill: Writing

explanation:
  why_vi: >
    Người mới trong nghề bảo mật hay xếp ưu tiên theo điểm số, vì đó là con số duy nhất
    có sẵn. Nhưng điểm CVSS đo mức nghiêm trọng về kỹ thuật, không đo rủi ro thực tế
    với hệ thống của bạn. Một lỗ hổng 9.8 trên máy chủ không ai chạm tới được
    ít nguy hiểm hơn một lỗ hổng 7.5 đang bị khai thác trên máy chủ công khai.
  how_vi: >
    Ba yếu tố ngoài điểm số: CÓ MỞ RA INTERNET KHÔNG, CÓ ĐANG BỊ KHAI THÁC THẬT KHÔNG,
    và KẺ TẤN CÔNG LẤY ĐƯỢC GÌ nếu thành công. Khi chưa vá kịp,
    nêu BIỆN PHÁP BÙ — quy tắc tường lửa, tắt tính năng — và nếu quyết định
    hoãn hẳn thì phải có người ký CHẤP NHẬN RỦI RO kèm mốc xem lại.
  contrast_vi: >
    "Rated critical" là mức nghiêm trọng kỹ thuật.
    "Actively exploited and internet facing" là rủi ro thực tế đang xảy ra.
    Câu thứ hai mới là thứ quyết định bạn thức đêm vá hay chờ tới thứ Bảy.

common_mistakes:
  - mistake: "Xếp ưu tiên chỉ theo điểm CVSS"
    why_vi: >
      Điểm số là con số duy nhất có sẵn nên rất dễ bám vào. Nhưng nó không biết
      hệ thống của bạn đặt ở đâu và ai chạm tới được.
    fix_vi: "Luôn kiểm ba yếu tố: mở ra Internet, đang bị khai thác, lấy được gì."
    detect_phoneme_missing: []
  - mistake: "Nói \"chúng ta bị ảnh hưởng\" mà không nêu bối cảnh"
    why_vi: >
      Câu đó gây hoảng loạn ở cấp lãnh đạo mà không giúp họ quyết định gì,
      và thường dẫn tới yêu cầu vá tất cả ngay lập tức.
    fix_vi: "Luôn kèm bối cảnh: bao nhiêu máy, có công khai không, có biện pháp bù nào chưa."
    detect_phoneme_missing: []
  - mistake: "Hoãn vá mà không ghi nhận chấp nhận rủi ro"
    why_vi: >
      Quyết định miệng thì sáu tháng sau không ai nhớ ai đã đồng ý,
      và nếu xảy ra sự cố thì người kỹ thuật chịu trách nhiệm.
    fix_vi: "Ghi thành văn bản: ai chấp nhận, biện pháp bù là gì, và xem lại vào ngày nào."
    detect_phoneme_missing: []

memory_trick_vi: >
  Điểm số chỉ là một yếu tố. Ba câu hỏi quyết định ưu tiên:
  CÓ MỞ RA INTERNET KHÔNG, CÓ ĐANG BỊ KHAI THÁC KHÔNG, LẤY ĐƯỢC GÌ.
