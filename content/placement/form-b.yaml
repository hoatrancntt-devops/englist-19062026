# Đề song song với A: cùng số câu, cùng phân bổ kỹ năng, cùng bậc độ khó ở
# từng vị trí. Chỉ nội dung khác. Hai đề lệch độ khó thì người thi lại đề B
# sẽ ra bậc khác không phải vì trình độ đổi mà vì đề dễ hơn.

