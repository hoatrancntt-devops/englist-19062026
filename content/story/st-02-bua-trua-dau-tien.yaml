code: ST-02
number: 2
title_vi: "Bữa trưa đầu tiên"
track: Foundation
unlock_after_lesson: LIFE-09
hook_vi: "Họp thì bạn có thể im. Bữa trưa thì không — và đó mới là chỗ người ta quyết định bạn là ai."

new_characters:
  - "Chị Hạnh — phòng kế toán, người sẽ gửi cho bạn rất nhiều ticket sau này"

body_vi: |-
  Thứ Tư, Mai rủ bạn đi ăn cùng nhóm. Sáu người, hai người nước ngoài, một quán cơm cách công ty hai trăm mét.

  Bạn đã chuẩn bị tinh thần cho phần khó nhất: gọi món. Nhưng hoá ra gọi món là phần dễ nhất — bạn chỉ trỏ vào thực đơn. Phần khó nằm ở hai mươi phút sau đó, khi mọi người đã có đồ ăn và bắt đầu nói chuyện.

  Người ta hỏi bạn ở đâu tới. Bạn trả lời được. Người ta hỏi bạn đi làm bằng gì. Bạn trả lời được. Rồi có người hỏi bạn cuối tuần thường làm gì, và bạn nhận ra mình biết từ "weekend", biết từ "usually", nhưng không biết ghép chúng lại thành một câu trong lúc sáu người đang nhìn.

  Bạn nói: "I... play game." Rồi im.

  Không ai cười. Nhưng cũng không ai hỏi tiếp, vì bạn không đưa cho họ chỗ nào để hỏi tiếp.

  Chị Hạnh ở bàn bên cạnh ghé sang xin cái muỗng, nói tiếng Anh với một trong hai người nước ngoài, sai ngữ pháp gần hết câu, và cả bàn cười ầm lên vì một câu đùa của chị. Chị Hạnh làm kế toán, học tiếng Anh ở trung tâm ba tháng, và vừa nói chuyện với đồng nghiệp Úc lâu hơn bạn.

  Trên đường về Mai nói: "Không phải chị Hạnh giỏi hơn em đâu. Chị ấy chỉ nói dài hơn em một câu. Em nói 'I play game' rồi dừng. Chị ấy nói sai nhưng nói ba câu, nên người ta có chỗ để nói tiếp."

ends_vi: "Bữa trưa không phải bài kiểm tra ngữ pháp. Nó là chỗ để nói thêm một câu nữa — và những bài sắp tới dạy bạn đúng cái câu thứ hai đó."
