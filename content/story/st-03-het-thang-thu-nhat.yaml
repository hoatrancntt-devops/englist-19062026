code: ST-03
number: 3
title_vi: "Hết tháng thứ nhất"
track: Foundation
unlock_after_lesson: LIFE-16
hook_vi: "Một tháng. Bạn chưa nói được câu nào dài quá mười từ. Nhưng có một thứ đã đổi mà bạn chưa nhận ra."

body_vi: |-
  Cuối tháng, anh Quang gọi bạn vào phòng họp nhỏ. Mười lăm phút review thử việc.

  Anh mở laptop, đọc mấy dòng ghi chú, rồi hỏi: "Em thấy khó nhất là gì?"

  Bạn nói thật: tiếng Anh. Không phải kỹ thuật — kỹ thuật bạn làm được. Là cái cảm giác ngồi trong cuộc họp mà nghe câu được câu mất, rồi về chỗ mở lại bản ghi để nghe lần hai.

  Anh Quang gật đầu. Rồi anh nói một câu mà bạn không ngờ: "Tháng đầu anh không đánh giá em qua tiếng Anh. Anh đánh giá qua chỗ khác — em có hỏi lại khi không hiểu không."

  Anh xoay màn hình. Trong kênh chat nhóm, anh kéo lên ba chỗ bạn đã nhắn: "sorry, do you mean the staging one?", "can you confirm the ticket number?", "I will check and reply in 10 minutes".

  "Ba tin này," anh nói, "là lý do anh không lo. Tháng trước có bạn khác vào, tiếng Anh tốt hơn em nhiều. Nhưng bạn ấy không hỏi lại bao giờ. Bạn ấy gật, rồi làm sai, rồi sửa mất hai ngày."

  Bạn về chỗ, mở lại tờ giấy nhớ dán trên màn hình từ ngày đầu. Ba câu cứu hộ. Bạn đã dùng chúng nhiều tới mức không còn phải nhìn giấy nữa.

  Bạn gỡ tờ giấy xuống. Không phải vì hết cần — mà vì nó đã nằm trong đầu.

ends_vi: "Tầng Đời sống xong. Từ đây tiếng Anh của bạn rời khỏi quán ăn và bước vào văn phòng — nơi câu chữ bắt đầu có hậu quả."
