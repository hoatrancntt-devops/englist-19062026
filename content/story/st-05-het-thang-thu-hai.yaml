code: ST-05
number: 5
title_vi: "Hết tháng thứ hai"
track: Foundation
unlock_after_lesson: OFF-12
hook_vi: "Lần đầu tiên bạn nói trong cuộc họp mà không ai phải đỡ lời."

body_vi: |-
  Thứ Năm, standup. Tom hỏi vòng quanh. Tới lượt bạn.

  Bạn nói ba câu. Hôm qua làm gì, hôm nay làm gì, đang vướng gì. Đúng ba phần, không thừa một chữ, hết bốn mươi giây.

  Không có gì đặc biệt xảy ra. Tom gật, ghi chú, chuyển sang người tiếp theo.

  Chính chỗ "không có gì đặc biệt xảy ra" mới là điều đáng nói. Hai tháng trước, bạn nói một câu thì Mai phải đỡ một câu. Hôm nay bạn nói xong, cuộc họp đi tiếp, và không ai nhớ là bạn vừa nói — bởi vì nó bình thường.

  Trưa đó Mai đùa: "Em hết cần chị rồi."

  Bạn cười, nhưng về chỗ thì nghĩ lại. Bạn mở bản ghi cuộc họp tuần đầu tiên, tua tới đoạn có tên mình. Ba giây im lặng. Nghe lại vẫn thấy nóng mặt.

  Rồi bạn tua tới cuộc họp sáng nay. Bốn mươi giây, giọng còn run ở câu đầu, phát âm "deployment" vẫn chưa chuẩn.

  Nhưng trôi. Từ đầu tới cuối, trôi.

  Chiều, anh Quang nhắn: "Tháng sau em nhận ticket trực tiếp từ người dùng nhé. Không qua chị Mai nữa." Bạn nhìn dòng tin một lúc lâu trước khi trả lời "ok anh".

ends_vi: "Tầng Văn phòng xong. Từ đây bạn không còn nói chuyện với đồng nghiệp nữa — bạn nói chuyện với người đang cần bạn sửa một thứ gì đó."
