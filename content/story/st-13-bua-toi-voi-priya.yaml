code: ST-13
number: 13
title_vi: "Bữa tối với Priya"
track: Restaurant
unlock_after_lesson: REST-01
hook_vi: "Bạn đã gọi cho Priya mười một lần trong sáu tháng. Hôm nay chị ấy ngồi đối diện bạn, và bạn không biết nói gì."

body_vi: |-
  Priya sang Việt Nam công tác ba ngày. Anh Quang bảo bạn đặt bàn và đi cùng — "em nói chuyện với chị ấy nhiều nhất nhóm mà."

  Đúng là nhiều nhất. Mười một cuộc gọi hỗ trợ trong sáu tháng. Bạn biết giọng chị, biết chị hay nói "let me check that for you" trước khi im lặng gõ phím, biết chị làm ca đêm thứ Tư.

  Bạn không biết chị thích ăn gì.

  Bạn đặt bàn qua điện thoại — lần đầu đặt bàn bằng tiếng Anh, và bạn phát hiện ra mình sợ cuộc gọi này hơn cả cuộc gọi báo sự cố. Sự cố thì bạn có kịch bản. Đặt bàn thì không.

  Bảy giờ tối. Priya tới. Câu đầu tiên chị nói không phải về công việc: "So this is where all my 2 a.m. calls come from."

  Cả bàn cười. Băng vỡ.

  Bữa đó bạn nói ít hơn Priya nhiều, nhưng không phải vì bí. Bạn hỏi, chị kể — về Pune, về chuyện chị học kỹ thuật vì bố chị sửa radio, về việc chị cũng từng sợ nói tiếng Anh với khách vì giọng Ấn của mình.

  Lúc tính tiền có chút lúng túng: nhà hàng không chia hoá đơn được, ba người ba thẻ. Bạn xử lý bằng một câu đã học: "Could we split it three ways on one card, and I'll settle with them after?"

  Priya nhìn bạn, hơi ngạc nhiên: "Your English got a lot better since March."

ends_vi: "Tiếng Anh trên bàn ăn không dễ hơn tiếng Anh trong sự cố. Nó chỉ không có kịch bản — và đó mới là chỗ người ta nhớ về bạn."
