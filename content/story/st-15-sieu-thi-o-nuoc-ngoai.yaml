code: ST-15
number: 15
title_vi: "Siêu thị ở nước ngoài"
track: Shopping
unlock_after_lesson: SHOP-01
hook_vi: "Bạn trình bày kiến trúc cho tám người bằng tiếng Anh vào buổi sáng. Buổi tối bạn không mua nổi một hộp thuốc cảm."

body_vi: |-
  Ngày thứ ba ở Singapore. Buổi sáng bạn trình bày phương án hạ tầng cho nhóm của Kenji, tám người nghe, bốn mươi phút, hỏi đáp mười lăm phút. Trôi.

  Buổi tối bạn bị đau họng.

  Bạn vào siêu thị dưới khách sạn tìm thuốc. Và đứng giữa quầy, bạn nhận ra mình không biết nói cái mình cần.

  Bạn biết "medicine". Nhưng nhân viên hỏi lại: "For what symptoms?" — và bạn không biết "đau họng", không biết "rát", không biết "nuốt vướng". Sáng nay bạn nói được "horizontal scaling" và "latency threshold". Bây giờ bạn chỉ vào cổ mình.

  Nhân viên hiểu ngay, đưa bạn ba lựa chọn, hỏi bạn có dị ứng gì không. Bạn cũng không biết nói cái đó. Bạn nói "no" cho nhanh.

  Về phòng bạn ngồi tra từ điển mười phút. Sore throat. Swallowing hurts. Drowsy. Non-drowsy.

  Rồi bạn nghĩ tới chị Hạnh. Nghĩ tới cái hôm chị nói tiếng Anh sai gần hết câu ở quán cơm mà vẫn làm cả bàn cười.

  Chị Hạnh không biết "latency threshold". Nhưng chị chắc chắn biết nói mình đau ở đâu.

  Hôm sau bạn kể chuyện này cho Kenji. Anh cười lớn, rồi nói: "Everyone has that gap. Mine is the barber. Ten years here and I still can't explain a haircut."

ends_vi: "Tiếng Anh nghề nghiệp và tiếng Anh đời sống là hai cái vốn khác nhau. Giỏi cái này không tự động có cái kia — phải học riêng."
