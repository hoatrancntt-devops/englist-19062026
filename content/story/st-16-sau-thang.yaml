code: ST-16
number: 16
title_vi: "Sáu tháng"
track: Hobbies
unlock_after_lesson: HOBBY-01
hook_vi: "Có người mới vào nhóm. Anh Quang giao bạn kèm cậu ấy tuần đầu."

body_vi: |-
  Sáu tháng sau ngày bạn ngồi ở sảnh HT Group tập lại một câu trong đầu.

  Có người mới. Tên Đức, mới ra trường, ngồi đúng chỗ bạn từng ngồi. Anh Quang giao bạn kèm cậu ấy tuần đầu — đúng cái việc Mai từng làm cho bạn.

  Sáng thứ Hai, chín giờ, standup. Bạn nói với Đức trước khi vào: "Em cứ nghe thôi, chưa cần nói gì."

  Rồi có người hỏi Đức một câu.

  Ba giây im lặng.

  Bạn đỡ lời. Cuộc họp đi tiếp.

  Buổi trưa bạn nói với Đức đúng cái câu Mai từng nói với bạn, gần như nguyên văn: "Lúc nãy em chỉ cần nói 'Sorry, could you say that again?' là xong. Cái làm người ta khó xử là im lặng, không phải là nghe không kịp."

  Đức gật, ghi vào giấy nhớ, dán lên màn hình.

  Chiều đó Priya gọi. Sự cố thường lệ, mười lăm phút. Bạn xử lý, chào chị, cúp máy.

  Đức ngồi bên cạnh nhìn bạn, và bạn nhận ra ánh mắt đó — chính là ánh mắt bạn từng nhìn Mai sáu tháng trước, cái ánh mắt nghĩ rằng người kia sinh ra đã nói được như vậy.

  Bạn định giải thích. Rồi thôi.

  Sáu tháng nữa cậu ấy sẽ tự biết.

ends_vi: "Bạn không học xong tiếng Anh. Bạn chỉ vừa đi hết đoạn khó nhất — đoạn mà mỗi câu nói ra đều phải nghĩ trước trong đầu."
