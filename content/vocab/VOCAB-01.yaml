code: VOCAB-01
title_vi: "100 từ dựng câu"
context_vi: >-
  Nhóm từ thông dụng nhất tiếng Anh. Riêng nhóm này đã chiếm khoảng một nửa số từ bạn gặp
  trong lời nói hàng ngày, nên thuộc nó là bước nhảy lớn nhất về khả năng nghe hiểu.
  Phần lớn là động từ và danh từ dựng được câu ngay, không phải từ chuyên ngành.
band: 1

words:
  - term: "be"
    ipa: "/biː/"
    meaning_vi: "thì, là, ở (động từ quan trọng nhất tiếng Anh)"
    chunk: "I want to be ready."
    emoji: "🔷"
    mnemonic_vi: "Động từ biến hình nhiều nhất: am, is, are, was, were, been. Nhớ theo bộ chứ đừng nhớ từng cái rời."
  - term: "have"
    ipa: "/hæv/"
    meaning_vi: "có; đã (dùng dựng thì hoàn thành)"
    chunk: "I have two questions."
    emoji: "🤲"
    mnemonic_vi: "Hai việc trong một từ: sở hữu (I have a car) và dựng thì (I have been here). Việc thứ hai mới là việc dùng nhiều nhất."
  - term: "do"
    ipa: "/duː/"
    meaning_vi: "làm; dùng để hỏi và phủ định"
    chunk: "What do you do?"
    emoji: "🔨"
    mnemonic_vi: "Trong câu \"what do you do\", chữ do đầu là để HỎI, chữ do sau là LÀM. Hiểu chỗ này là hiểu nửa ngữ pháp cơ bản."
  - term: "say"
    ipa: "/seɪ/"
    meaning_vi: "nói (nội dung lời nói)"
    chunk: "What did he say?"
    emoji: "💬"
    mnemonic_vi: "\"say\" nghe như \"xây\" — xây nên câu chữ. Nói NỘI DUNG gì thì dùng say, còn nói VỚI AI thì dùng tell."
  - term: "go"
    ipa: "/ɡoʊ/"
    meaning_vi: "đi"
    chunk: "I go to work at eight."
    emoji: "🚶"
    mnemonic_vi: "Quá khứ là \"went\", hoàn toàn không theo quy tắc — phải nhớ thuộc như một từ khác hẳn."
  - term: "get"
    ipa: "/ɡet/"
    meaning_vi: "lấy được, trở nên, tới nơi (từ đa nghĩa nhất)"
    chunk: "I'll get the file for you."
    emoji: "📥"
    mnemonic_vi: "Từ vạn năng: get a coffee (lấy), get tired (trở nên), get home (tới). Nghe ngữ cảnh chứ đừng dịch cứng một nghĩa."
  - term: "make"
    ipa: "/meɪk/"
    meaning_vi: "làm ra, tạo ra"
    chunk: "Let's make a plan."
    emoji: "🛠️"
    mnemonic_vi: "Phân biệt với \"do\": make là TẠO RA thứ mới (make a cake), do là THỰC HIỆN việc có sẵn (do the work)."
  - term: "know"
    ipa: "/noʊ/"
    meaning_vi: "biết"
    chunk: "I don't know yet."
    emoji: "🧠"
    mnemonic_vi: "Chữ K CÂM — đọc là \"nâu\", giống hệt \"no\". Cùng họ câm K với knee, knife, knock."
  - term: "think"
    ipa: "/θɪŋk/"
    meaning_vi: "nghĩ, cho rằng"
    chunk: "I think we should wait."
    emoji: "💭"
    mnemonic_vi: "Âm \"th\" phải THÈ LƯỠI ra giữa hai hàm răng. Đọc thành \"tink\" hay \"sink\" là hai từ khác nghĩa hẳn."
  - term: "take"
    ipa: "/teɪk/"
    meaning_vi: "cầm lấy, mất (thời gian)"
    chunk: "It takes ten minutes."
    emoji: "✋"
    mnemonic_vi: "Nghĩa NGỐN THỜI GIAN là nghĩa hay gặp nhất ở công sở: \"it takes two hours\"."
  - term: "see"
    ipa: "/siː/"
    meaning_vi: "thấy; hiểu"
    chunk: "I see what you mean."
    emoji: "👁️"
    mnemonic_vi: "\"I see\" trong hội thoại thường nghĩa là TÔI HIỂU RỒI, không phải tôi nhìn thấy."
  - term: "come"
    ipa: "/kʌm/"
    meaning_vi: "đến, tới"
    chunk: "Come to my desk."
    emoji: "🚪"
    mnemonic_vi: "Cặp đối với \"go\": go là đi RA XA người nói, come là tới GẦN người nói."
  - term: "want"
    ipa: "/wɒnt/"
    meaning_vi: "muốn"
    chunk: "I want to learn faster."
    emoji: "🎯"
    mnemonic_vi: "Ở công sở nên thay bằng \"I'd like\" — \"I want\" nghe như đòi hỏi, hơi thô với người trên."
  - term: "look"
    ipa: "/lʊk/"
    meaning_vi: "nhìn; trông có vẻ"
    chunk: "It looks fine to me."
    emoji: "👀"
    mnemonic_vi: "\"look\" là CHỦ ĐỘNG nhìn, \"see\" là thấy được. Nhìn mà không thấy: I looked but didn't see it."
  - term: "use"
    ipa: "/juːz/"
    meaning_vi: "dùng, sử dụng"
    chunk: "We use this every day."
    emoji: "⚙️"
    mnemonic_vi: "Bẫy phát âm: động từ đọc \"iu-Z\" có tiếng z, danh từ đọc \"iu-X\" tiếng s. Cùng chữ, khác âm cuối."
  - term: "find"
    ipa: "/faɪnd/"
    meaning_vi: "tìm thấy"
    chunk: "I can't find the file."
    emoji: "🔍"
    mnemonic_vi: "\"find\" là TÌM RA ĐƯỢC, còn \"look for\" mới là đang tìm. Tìm mãi không ra: I looked for it but couldn't find it."
  - term: "give"
    ipa: "/ɡɪv/"
    meaning_vi: "đưa, cho"
    chunk: "Give me a minute."
    emoji: "🎁"
    mnemonic_vi: "Quá khứ \"gave\", phân từ \"given\" — bất quy tắc. \"Give me a minute\" là câu xin thêm thời gian gọn nhất."
  - term: "tell"
    ipa: "/tel/"
    meaning_vi: "nói cho ai biết"
    chunk: "Tell me when you're ready."
    emoji: "🗣️"
    mnemonic_vi: "Cặp với \"say\": tell luôn kèm NGƯỜI NGHE (tell me), say kèm NỘI DUNG (say something)."
  - term: "call"
    ipa: "/kɔːl/"
    meaning_vi: "gọi (điện thoại); gọi tên là"
    chunk: "I'll call you back."
    emoji: "📞"
    mnemonic_vi: "Hai nghĩa: gọi điện, và gọi tên (what do you call this?). Nghĩa thứ hai rất hữu ích khi bạn quên tên một vật."
  - term: "ask"
    ipa: "/ɑːsk/"
    meaning_vi: "hỏi; nhờ"
    chunk: "Can I ask a question?"
    emoji: "🙋"
    mnemonic_vi: "Vừa là hỏi vừa là nhờ: ask a question (hỏi), ask for help (nhờ). Chữ \"for\" quyết định nghĩa nào."
  - term: "feel"
    ipa: "/fiːl/"
    meaning_vi: "cảm thấy"
    chunk: "I feel much better now."
    emoji: "💗"
    mnemonic_vi: "Sau \"feel\" dùng tính từ, không dùng trạng từ: \"I feel good\" chứ không phải \"I feel well\" khi nói cảm xúc."
  - term: "leave"
    ipa: "/liːv/"
    meaning_vi: "rời đi; để lại"
    chunk: "I leave the office at six."
    emoji: "🚪"
    mnemonic_vi: "Hai nghĩa ngược nhau tuỳ ngữ cảnh: rời đi (leave now) và để lại (leave it here). Cũng là danh từ \"nghỉ phép\"."
  - term: "put"
    ipa: "/pʊt/"
    meaning_vi: "đặt, để"
    chunk: "Put it on my desk."
    emoji: "📦"
    mnemonic_vi: "Bất quy tắc kiểu lười: put - put - put, ba thì như một. Đọc \"pút\" ngắn, không phải \"pat\"."
  - term: "keep"
    ipa: "/kiːp/"
    meaning_vi: "giữ; tiếp tục"
    chunk: "Keep me updated."
    emoji: "🤝"
    mnemonic_vi: "Nghĩa TIẾP TỤC rất hay dùng: \"keep going\" là cứ tiếp đi. \"Keep me updated\" là câu công sở dùng hằng ngày."
  - term: "let"
    ipa: "/let/"
    meaning_vi: "để cho, cho phép"
    chunk: "Let me check that."
    emoji: "👐"
    mnemonic_vi: "\"Let me\" mở đầu vô số câu lịch sự: let me check, let me know, let me finish. Học nguyên khuôn này."
  - term: "start"
    ipa: "/stɑːrt/"
    meaning_vi: "bắt đầu"
    chunk: "When do we start?"
    emoji: "▶️"
    mnemonic_vi: "Đồng nghĩa \"begin\" nhưng thân mật hơn. Máy móc thì chỉ dùng start được: start the car."
  - term: "stop"
    ipa: "/stɒp/"
    meaning_vi: "dừng lại"
    chunk: "Please stop the process."
    emoji: "🛑"
    mnemonic_vi: "Bẫy nghĩa: \"stop doing\" là ngừng hẳn việc đó, còn \"stop to do\" là dừng lại ĐỂ làm việc đó. Hai nghĩa khác hẳn."
  - term: "help"
    ipa: "/help/"
    meaning_vi: "giúp đỡ"
    chunk: "Can you help me with this?"
    emoji: "🆘"
    mnemonic_vi: "Sau \"help\" có thể bỏ chữ to: \"help me do it\" và \"help me to do it\" đều đúng."
  - term: "show"
    ipa: "/ʃoʊ/"
    meaning_vi: "cho xem, chỉ ra"
    chunk: "Show me the error."
    emoji: "👉"
    mnemonic_vi: "\"Show me\" hiệu quả hơn nhiều so với hỏi mô tả — đặc biệt khi hỗ trợ kỹ thuật qua điện thoại."
  - term: "hear"
    ipa: "/hɪr/"
    meaning_vi: "nghe thấy"
    chunk: "I can't hear you well."
    emoji: "👂"
    mnemonic_vi: "\"hear\" là nghe THẤY một cách bị động, \"listen\" là CHỦ ĐỘNG lắng nghe. Cặp giống look và see."
  - term: "run"
    ipa: "/rʌn/"
    meaning_vi: "chạy; vận hành"
    chunk: "The server runs all night."
    emoji: "🏃"
    mnemonic_vi: "Trong ngành IT nghĩa VẬN HÀNH mới là nghĩa chính: run a script, run a server. Không liên quan gì tới chạy bộ."
  - term: "move"
    ipa: "/muːv/"
    meaning_vi: "di chuyển, chuyển đi"
    chunk: "We moved the meeting to Friday."
    emoji: "↔️"
    mnemonic_vi: "Dùng cho cả lịch hẹn: \"move the meeting\" là dời cuộc họp — đồng nghĩa với \"push it to\"."
  - term: "live"
    ipa: "/lɪv/"
    meaning_vi: "sống, ở"
    chunk: "I live in Da Nang."
    emoji: "🏠"
    mnemonic_vi: "Bẫy phát âm: động từ \"sống\" đọc \"lív\" ngắn; tính từ \"trực tiếp\" (live stream) đọc \"laiv\" dài."
  - term: "bring"
    ipa: "/brɪŋ/"
    meaning_vi: "mang tới"
    chunk: "Bring your laptop tomorrow."
    emoji: "🎒"
    mnemonic_vi: "Cặp đối với \"take\": bring là mang TỚI chỗ người nói, take là mang ĐI khỏi đó."
  - term: "write"
    ipa: "/raɪt/"
    meaning_vi: "viết"
    chunk: "I'll write it down."
    emoji: "✍️"
    mnemonic_vi: "Chữ W CÂM, đọc y hệt \"right\". Ba từ đồng âm: write, right, rite."
  - term: "sit"
    ipa: "/sɪt/"
    meaning_vi: "ngồi"
    chunk: "Please sit down."
    emoji: "🪑"
    mnemonic_vi: "Nguyên âm ngắn \"i\". Kéo dài thành \"seat\" là danh từ chỗ ngồi — nghĩa khác hẳn."
  - term: "stand"
    ipa: "/stænd/"
    meaning_vi: "đứng; chịu được"
    chunk: "I can't stand the noise."
    emoji: "🧍"
    mnemonic_vi: "Nghĩa thứ hai bất ngờ: \"I can't stand it\" là tôi CHỊU KHÔNG NỔI, không liên quan tới đứng."
  - term: "lose"
    ipa: "/luːz/"
    meaning_vi: "mất; thua"
    chunk: "We can't lose this data."
    emoji: "💨"
    mnemonic_vi: "Bẫy chính tả: \"lose\" một chữ o là MẤT, \"loose\" hai chữ o là LỎNG. Lỗi viết sai phổ biến nhất tiếng Anh."
  - term: "pay"
    ipa: "/peɪ/"
    meaning_vi: "trả tiền"
    chunk: "Can I pay by card?"
    emoji: "💳"
    mnemonic_vi: "Quá khứ là \"paid\", không phải \"payed\". Cùng kiểu với say - said."
  - term: "meet"
    ipa: "/miːt/"
    meaning_vi: "gặp"
    chunk: "Let's meet at two."
    emoji: "🤝"
    mnemonic_vi: "Đọc y hệt \"meat\" (thịt). Còn nghĩa ĐÁP ỨNG: meet the deadline, meet the requirement."
  - term: "learn"
    ipa: "/lɜːrn/"
    meaning_vi: "học"
    chunk: "I'm learning English for work."
    emoji: "📚"
    mnemonic_vi: "Phân biệt với \"study\": learn là TIẾP THU được, study là ngồi học. Học mãi mà chưa vào: I studied but didn't learn much."
  - term: "understand"
    ipa: "/ˌʌndərˈstænd/"
    meaning_vi: "hiểu"
    chunk: "I don't understand this part."
    emoji: "💡"
    mnemonic_vi: "Ghép \"under\" + \"stand\" — đứng dưới mà nhìn lên thì thấy được cấu tạo. Quá khứ là \"understood\"."
  - term: "watch"
    ipa: "/wɒtʃ/"
    meaning_vi: "xem, theo dõi"
    chunk: "Watch the disk space."
    emoji: "📺"
    mnemonic_vi: "Xem thứ CHUYỂN ĐỘNG thì dùng watch (watch a film), nhìn thứ đứng yên thì look at (look at a photo)."
  - term: "follow"
    ipa: "/ˈfɒloʊ/"
    meaning_vi: "đi theo; làm theo"
    chunk: "Follow these steps."
    emoji: "👣"
    mnemonic_vi: "Nghĩa LÀM THEO hay gặp trong tài liệu kỹ thuật: follow the guide, follow the process."
  - term: "speak"
    ipa: "/spiːk/"
    meaning_vi: "nói (khả năng ngôn ngữ)"
    chunk: "Do you speak English?"
    emoji: "🗣️"
    mnemonic_vi: "Dùng cho NGÔN NGỮ: speak English, speak Vietnamese. Còn trò chuyện thì dùng talk."
  - term: "read"
    ipa: "/riːd/"
    meaning_vi: "đọc"
    chunk: "Read the error message."
    emoji: "📖"
    mnemonic_vi: "Bẫy lớn: hiện tại đọc \"RÍT\", quá khứ viết Y HỆT nhưng đọc \"RÉT\" như màu đỏ. Chữ giống, âm khác."
  - term: "spend"
    ipa: "/spend/"
    meaning_vi: "tiêu (tiền); dành (thời gian)"
    chunk: "I spend an hour on it."
    emoji: "⏳"
    mnemonic_vi: "Dùng cho cả tiền lẫn thời gian — tiếng Anh coi thời gian như tiền. Sau nó là động từ đuôi -ing."
  - term: "open"
    ipa: "/ˈoʊpən/"
    meaning_vi: "mở; đang mở"
    chunk: "Open the settings page."
    emoji: "📂"
    mnemonic_vi: "Vừa là động từ vừa là tính từ: open the door (mở), the ticket is open (đang mở)."
  - term: "walk"
    ipa: "/wɔːk/"
    meaning_vi: "đi bộ"
    chunk: "It's a five minute walk."
    emoji: "🚶"
    mnemonic_vi: "Chữ L CÂM — đọc \"wọk\", không đọc \"won-cờ\". Cùng họ câm L với talk, half, could."
  - term: "buy"
    ipa: "/baɪ/"
    meaning_vi: "mua"
    chunk: "I need to buy a new laptop."
    emoji: "🛒"
    mnemonic_vi: "Đồng âm với \"by\" và \"bye\". Quá khứ là \"bought\", đọc \"bót\"."
  - term: "send"
    ipa: "/send/"
    meaning_vi: "gửi"
    chunk: "Send me the link."
    emoji: "📤"
    mnemonic_vi: "Quá khứ \"sent\" — đổi d thành t. Cùng kiểu với build - built, spend - spent."
  - term: "stay"
    ipa: "/steɪ/"
    meaning_vi: "ở lại"
    chunk: "Stay on the line, please."
    emoji: "📍"
    mnemonic_vi: "\"Stay on the line\" là câu tổng đài nói suốt: xin đừng cúp máy."
  - term: "wait"
    ipa: "/weɪt/"
    meaning_vi: "chờ"
    chunk: "Wait a moment, please."
    emoji: "⏳"
    mnemonic_vi: "Đồng âm với \"weight\" (cân nặng). Đi với \"for\" khi chờ ai: wait for me."
  - term: "check"
    ipa: "/tʃek/"
    meaning_vi: "kiểm tra"
    chunk: "Let me check and get back to you."
    emoji: "✔️"
    mnemonic_vi: "Từ dùng nhiều nhất trong ngành IT sau \"fix\". Cũng là danh từ hoá đơn ở Mỹ."
  - term: "fix"
    ipa: "/fɪks/"
    meaning_vi: "sửa (cái hỏng)"
    chunk: "We fixed it this morning."
    emoji: "🔧"
    mnemonic_vi: "\"fix\" là sửa cái HỎNG, \"repair\" trang trọng hơn, \"edit\" là sửa nội dung. Ba chữ khác nhau, đừng lẫn."
  - term: "try"
    ipa: "/traɪ/"
    meaning_vi: "thử"
    chunk: "Try turning it off and on."
    emoji: "🔁"
    mnemonic_vi: "Sau \"try\" dùng -ing khi thử một cách (try restarting), dùng \"to\" khi cố gắng (try to finish)."
  - term: "need"
    ipa: "/niːd/"
    meaning_vi: "cần"
    chunk: "You need to restart it."
    emoji: "❗"
    mnemonic_vi: "\"need to\" là cách nói nghĩa vụ nhẹ hơn \"must\" — dùng nhiều ở công sở phương Tây."
  - term: "hope"
    ipa: "/hoʊp/"
    meaning_vi: "hy vọng"
    chunk: "I hope this helps."
    emoji: "🤞"
    mnemonic_vi: "\"I hope this helps\" là câu khép email hỗ trợ chuẩn mực nhất — nhã nhặn mà không hứa hẹn gì."
  - term: "mean"
    ipa: "/miːn/"
    meaning_vi: "có nghĩa là"
    chunk: "What does that mean?"
    emoji: "❓"
    mnemonic_vi: "Câu cứu mạng khi nghe từ lạ: \"what does that mean?\". Còn là tính từ nghĩa KEO KIỆT, XẤU TÍNH."
  - term: "happen"
    ipa: "/ˈhæpən/"
    meaning_vi: "xảy ra"
    chunk: "When did it happen?"
    emoji: "⚡"
    mnemonic_vi: "Không có dạng bị động — sự việc tự xảy ra. Nói \"it was happened\" là sai."
  - term: "change"
    ipa: "/tʃeɪndʒ/"
    meaning_vi: "thay đổi; tiền thối"
    chunk: "Nothing changed since yesterday."
    emoji: "🔄"
    mnemonic_vi: "Hai nghĩa xa nhau: thay đổi, và tiền thối. Nghĩa thứ hai từ chỗ tờ tiền bị ĐỔI thành tiền lẻ."
  - term: "add"
    ipa: "/æd/"
    meaning_vi: "thêm vào"
    chunk: "Add me to the group."
    emoji: "➕"
    mnemonic_vi: "Đọc \"ét\" ngắn, hai chữ d không kéo dài âm. Đồng âm gần với \"ad\" (quảng cáo)."
  - term: "remove"
    ipa: "/rɪˈmuːv/"
    meaning_vi: "gỡ bỏ"
    chunk: "Remove the old file."
    emoji: "🗑️"
    mnemonic_vi: "Ghép \"re\" + \"move\" — dời ra chỗ khác. Cặp đối với \"add\"."
  - term: "close"
    ipa: "/kloʊz/"
    meaning_vi: "đóng lại"
