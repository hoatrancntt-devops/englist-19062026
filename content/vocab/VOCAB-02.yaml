    meaning_vi: "mọi thứ"
    chunk: "Everything is back to normal."
    emoji: "🌐"
    mnemonic_vi: "Là SỐ ÍT dù nghĩa nhiều: \"everything is\" chứ không phải \"everything are\"."
  - term: "nothing"
