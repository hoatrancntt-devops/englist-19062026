code: VOCAB-02
title_vi: "100 từ mô tả"
context_vi: >-
  Tính từ và trạng từ thông dụng nhất, cộng những danh từ gặp hằng ngày. Bộ trước cho bạn
  dựng được câu; bộ này cho bạn nói câu đó CHÍNH XÁC — to hay nhỏ, nhanh hay chậm, đủ hay
  thiếu. Không có nhóm này thì mọi thứ đều là "good" và "bad".
band: 2

words:
  - term: "good"
    ipa: "/ɡʊd/"
    meaning_vi: "tốt"
    chunk: "That's a good idea."
    emoji: "👍"
    mnemonic_vi: "So sánh hơn bất quy tắc hoàn toàn: good - better - best. Không bao giờ có \"gooder\"."
  - term: "bad"
    ipa: "/bæd/"
    meaning_vi: "xấu, tệ"
    chunk: "The connection is bad today."
    emoji: "👎"
    mnemonic_vi: "Cũng bất quy tắc: bad - worse - worst. Nhớ cặp với good - better - best."
  - term: "big"
    ipa: "/bɪɡ/"
    meaning_vi: "to, lớn"
    chunk: "That's a big change."
    emoji: "🐘"
    mnemonic_vi: "So sánh phải gấp đôi chữ g: bigger, biggest. Luật gấp đôi áp cho từ một âm tiết kết thúc bằng nguyên âm + phụ âm."
  - term: "small"
    ipa: "/smɔːl/"
    meaning_vi: "nhỏ"
    chunk: "It's a small fix."
    emoji: "🐜"
    mnemonic_vi: "\"small\" nói về KÍCH THƯỚC, \"little\" thường mang thêm sắc thái tình cảm hoặc ít ỏi."
  - term: "new"
    ipa: "/njuː/"
    meaning_vi: "mới"
    chunk: "We got a new server."
    emoji: "✨"
    mnemonic_vi: "Đồng âm với \"knew\" (đã biết). Người Anh đọc \"niu\", người Mỹ đọc \"nu\"."
  - term: "old"
    ipa: "/oʊld/"
    meaning_vi: "cũ; già"
    chunk: "The old system still runs."
    emoji: "📻"
    mnemonic_vi: "Dùng cho cả vật (cũ) lẫn người (già). Hỏi tuổi: \"how old are you?\" — dịch sát là bạn già bao nhiêu."
  - term: "long"
    ipa: "/lɒŋ/"
    meaning_vi: "dài; lâu"
    chunk: "How long will it take?"
    emoji: "📏"
    mnemonic_vi: "Dùng cho cả không gian (a long road) lẫn thời gian (how long). Cụm \"as long as\" nghĩa miễn là."
  - term: "short"
    ipa: "/ʃɔːrt/"
    meaning_vi: "ngắn; thấp"
    chunk: "Let's keep it short."
    emoji: "📐"
    mnemonic_vi: "Cặp đối với long. Còn nghĩa THIẾU: \"we're short on time\" là thiếu thời gian."
  - term: "high"
    ipa: "/haɪ/"
    meaning_vi: "cao (mức độ, độ cao)"
    chunk: "CPU usage is high."
    emoji: "⬆️"
    mnemonic_vi: "Chữ GH CÂM hoàn toàn — đọc \"hai\". Cùng họ câm gh với light, night, right."
  - term: "low"
    ipa: "/loʊ/"
    meaning_vi: "thấp"
    chunk: "Disk space is low."
    emoji: "⬇️"
    mnemonic_vi: "Cặp với high. Cảnh báo hệ thống hay dùng: low disk, low memory, low battery."
  - term: "fast"
    ipa: "/fɑːst/"
    meaning_vi: "nhanh"
    chunk: "The new server is much faster."
    emoji: "⚡"
    mnemonic_vi: "Vừa tính từ vừa trạng từ, không có \"fastly\". Nói \"run fast\" chứ không phải \"run fastly\"."
  - term: "slow"
    ipa: "/sloʊ/"
    meaning_vi: "chậm"
    chunk: "The website feels slow."
    emoji: "🐢"
    mnemonic_vi: "Trạng từ có hai dạng: \"slowly\" chuẩn mực, \"slow\" dùng trong biển báo (go slow)."
  - term: "easy"
    ipa: "/ˈiːzi/"
    meaning_vi: "dễ"
    chunk: "It's an easy fix."
    emoji: "😌"
    mnemonic_vi: "Trạng từ là \"easily\" — đổi y thành i rồi thêm ly. Luật này áp cho mọi tính từ kết thúc bằng y."
  - term: "hard"
    ipa: "/hɑːrd/"
    meaning_vi: "khó; cứng"
    chunk: "This part is hard to explain."
    emoji: "🪨"
    mnemonic_vi: "Bẫy: trạng từ \"hardly\" KHÔNG nghĩa là khó — nó nghĩa HẦU NHƯ KHÔNG. \"I hardly slept\" là tôi gần như không ngủ."
  - term: "important"
    ipa: "/ɪmˈpɔːrtnt/"
    meaning_vi: "quan trọng"
    chunk: "This is the important part."
    emoji: "❗"
    mnemonic_vi: "Nhấn âm THỨ HAI: im-POR-tant. Nhấn sai chỗ là người nghe phải đoán."
  - term: "same"
    ipa: "/seɪm/"
    meaning_vi: "giống nhau, như nhau"
    chunk: "It fails at the same step."
    emoji: "🟰"
    mnemonic_vi: "Gần như luôn đi với \"the\": the same. Nói \"a same\" là sai."
  - term: "different"
    ipa: "/ˈdɪfrənt/"
    meaning_vi: "khác"
    chunk: "That's a different issue."
    emoji: "🔀"
    mnemonic_vi: "Người Anh nói \"different from\", người Mỹ hay nói \"different than\". Cả hai đều nghe được."
  - term: "ready"
    ipa: "/ˈredi/"
    meaning_vi: "sẵn sàng"
    chunk: "Let me know when you're ready."
    emoji: "✅"
    mnemonic_vi: "Đọc \"RÉ-đi\", chữ ea đọc như \"e\" ngắn — giống head, bread, dead."
  - term: "sure"
    ipa: "/ʃʊr/"
    meaning_vi: "chắc chắn"
    chunk: "Are you sure about that?"
    emoji: "🎯"
    mnemonic_vi: "Chữ s đọc thành \"SH\" — \"shuơ\", giống sugar. Một mình \"Sure\" cũng là câu đồng ý."
  - term: "clear"
    ipa: "/klɪr/"
    meaning_vi: "rõ ràng"
    chunk: "Is that clear so far?"
    emoji: "💎"
    mnemonic_vi: "Còn là động từ DỌN SẠCH: clear the cache, clear the queue. Cụm \"just so I'm clear\" đã học ở bài công sở."
  - term: "possible"
    ipa: "/ˈpɒsəbl/"
    meaning_vi: "có thể được"
    chunk: "Is that possible today?"
    emoji: "🤔"
    mnemonic_vi: "Cụm \"as soon as possible\" viết tắt ASAP, gặp khắp nơi trong email công việc."
  - term: "free"
    ipa: "/friː/"
    meaning_vi: "rảnh; miễn phí"
    chunk: "Are you free this afternoon?"
    emoji: "🕊️"
    mnemonic_vi: "Hai nghĩa xa nhau: rảnh (are you free) và miễn phí (it's free). Ngữ cảnh quyết định."
  - term: "busy"
    ipa: "/ˈbɪzi/"
    meaning_vi: "bận"
    chunk: "I'm a bit busy right now."
    emoji: "🏃"
    mnemonic_vi: "Bẫy phát âm: viết chữ u nhưng đọc chữ i — \"BÍ-zi\". Cùng kiểu bất thường với \"business\"."
  - term: "late"
    ipa: "/leɪt/"
    meaning_vi: "muộn, trễ"
    chunk: "Sorry I'm late."
    emoji: "⏰"
    mnemonic_vi: "Bẫy: \"lately\" KHÔNG nghĩa là muộn màng — nó nghĩa DẠO GẦN ĐÂY. Giống bẫy hard và hardly."
  - term: "early"
    ipa: "/ˈɜːrli/"
    meaning_vi: "sớm"
    chunk: "I came in early today."
    emoji: "🌄"
    mnemonic_vi: "Vừa tính từ vừa trạng từ, không có \"earlily\". Cặp đối với late."
  - term: "next"
    ipa: "/nekst/"
    meaning_vi: "kế tiếp"
    chunk: "What are the next steps?"
    emoji: "⏭️"
    mnemonic_vi: "Nền của nhiều cụm đã học: next steps, next action, next update at."
  - term: "last"
    ipa: "/lɑːst/"
    meaning_vi: "cuối cùng; vừa rồi"
    chunk: "It worked last week."
    emoji: "🔚"
    mnemonic_vi: "Hai nghĩa dễ lẫn: cuối cùng (the last one) và vừa rồi (last week). Còn là động từ KÉO DÀI: it lasts two hours."
  - term: "first"
    ipa: "/fɜːrst/"
    meaning_vi: "đầu tiên"
    chunk: "First, check the logs."
    emoji: "1️⃣"
    mnemonic_vi: "Cụm \"first thing\" là việc đầu tiên trong ngày. \"At first\" là lúc đầu thì."
  - term: "another"
    ipa: "/əˈnʌðər/"
    meaning_vi: "một cái khác nữa"
    chunk: "Try another browser."
    emoji: "➕"
    mnemonic_vi: "Ghép \"an\" + \"other\" nên LUÔN viết liền và luôn đi với danh từ số ít. Nhiều cái khác thì dùng \"other\"."
  - term: "every"
    ipa: "/ˈevri/"
    meaning_vi: "mỗi, mọi"
    chunk: "It happens every time."
    emoji: "🔁"
    mnemonic_vi: "Đi với danh từ SỐ ÍT: every day, every user. Nói \"every users\" là sai."
  - term: "some"
    ipa: "/sʌm/"
    meaning_vi: "một vài, một ít"
    chunk: "I need some help with this."
    emoji: "🤏"
    mnemonic_vi: "Dùng trong câu khẳng định; câu hỏi và phủ định thường đổi sang \"any\". Ngoại lệ: lời mời dùng some (would you like some tea?)."
  - term: "any"
    ipa: "/ˈeni/"
    meaning_vi: "bất kỳ, nào đó"
    chunk: "Any questions before we start?"
    emoji: "❔"
    mnemonic_vi: "Cặp với \"some\". Trong câu khẳng định nó nghĩa BẤT KỲ CÁI NÀO CŨNG ĐƯỢC: any time works."
  - term: "all"
    ipa: "/ɔːl/"
    meaning_vi: "tất cả"
    chunk: "All the servers are up."
    emoji: "💯"
    mnemonic_vi: "Cụm \"all of\" khi đứng trước đại từ: all of us, all of them."
  - term: "most"
    ipa: "/moʊst/"
    meaning_vi: "phần lớn, hầu hết"
    chunk: "Most users are not affected."
    emoji: "📊"
    mnemonic_vi: "Vừa nghĩa phần lớn, vừa là dạng so sánh nhất: the most important."
  - term: "few"
    ipa: "/fjuː/"
    meaning_vi: "ít (đếm được)"
    chunk: "Only a few people saw it."
    emoji: "🔢"
    mnemonic_vi: "Bẫy tinh tế: \"a few\" là MỘT VÀI (tích cực), \"few\" không có a là RẤT ÍT (tiêu cực). Chữ a đổi hẳn sắc thái."
  - term: "enough"
    ipa: "/ɪˈnʌf/"
    meaning_vi: "đủ"
    chunk: "We don't have enough disk space."
    emoji: "⚖️"
    mnemonic_vi: "Chính tả đánh lừa: \"gh\" cuối đọc thành \"F\" — \"i-NÁP\". Cùng kiểu với tough, rough, laugh."
  - term: "more"
    ipa: "/mɔːr/"
    meaning_vi: "nhiều hơn"
    chunk: "We need more time."
    emoji: "➕"
    mnemonic_vi: "Dùng dựng so sánh cho từ dài: more important, more expensive. Từ ngắn thì thêm -er."
  - term: "less"
    ipa: "/les/"
    meaning_vi: "ít hơn (không đếm được)"
    chunk: "It uses less memory now."
    emoji: "➖"
    mnemonic_vi: "\"less\" cho thứ không đếm được (less time), \"fewer\" cho thứ đếm được (fewer users). Người bản xứ cũng hay lẫn."
  - term: "still"
    ipa: "/stɪl/"
    meaning_vi: "vẫn còn"
    chunk: "The ticket is still open."
    emoji: "⏸️"
    mnemonic_vi: "Đặt trước động từ thường, sau động từ to be. Còn là tính từ YÊN TĨNH, đứng im."
  - term: "already"
    ipa: "/ɔːlˈredi/"
    meaning_vi: "đã, rồi"
    chunk: "I already restarted it."
    emoji: "✔️"
    mnemonic_vi: "Viết LIỀN một chữ l. Khác hẳn \"all ready\" viết rời nghĩa tất cả đã sẵn sàng."
  - term: "yet"
    ipa: "/jet/"
    meaning_vi: "chưa (trong câu phủ định)"
    chunk: "It hasn't finished yet."
    emoji: "⏳"
    mnemonic_vi: "Đứng CUỐI câu phủ định hoặc câu hỏi. Cặp với \"already\" của câu khẳng định."
  - term: "only"
    ipa: "/ˈoʊnli/"
    meaning_vi: "chỉ"
    chunk: "Only two servers are affected."
    emoji: "☝️"
    mnemonic_vi: "Vị trí của \"only\" đổi nghĩa cả câu: \"only I saw it\" khác \"I only saw it\". Đặt sát thứ mình muốn nhấn."
  - term: "also"
    ipa: "/ˈɔːlsoʊ/"
    meaning_vi: "cũng"
    chunk: "We also need the logs."
    emoji: "➕"
    mnemonic_vi: "Đứng GIỮA câu; muốn đặt cuối câu thì dùng \"too\". Cùng nghĩa, khác chỗ đứng."
  - term: "very"
    ipa: "/ˈveri/"
    meaning_vi: "rất"
    chunk: "That's very helpful, thanks."
    emoji: "🔝"
    mnemonic_vi: "KHÔNG dùng với tính từ đã cực đại: nói \"very excellent\" là thừa. Dùng \"absolutely\" cho nhóm đó."
  - term: "really"
    ipa: "/ˈrɪəli/"
    meaning_vi: "thật sự, rất"
    chunk: "That really helped."
    emoji: "❗"
    mnemonic_vi: "Một mình \"Really?\" là câu hỏi lại đầy ngạc nhiên — dùng suốt trong hội thoại."
  - term: "almost"
    ipa: "/ˈɔːlmoʊst/"
    meaning_vi: "gần như, sắp"
    chunk: "It's almost done."
    emoji: "◕"
    mnemonic_vi: "Ghép \"all\" + \"most\" nhưng viết một chữ l. Câu báo tiến độ an toàn khi sắp xong mà chưa xong."
  - term: "together"
    ipa: "/təˈɡeðər/"
    meaning_vi: "cùng nhau"
    chunk: "Let's look at it together."
    emoji: "🤝"
    mnemonic_vi: "Nhìn ra ba chữ: to + get + her. Vô lý nhưng nhờ vậy nhớ được chính tả."
  - term: "instead"
    ipa: "/ɪnˈsted/"
    meaning_vi: "thay vì, thay vào đó"
    chunk: "Use the API instead."
    emoji: "🔄"
    mnemonic_vi: "Đứng một mình ở cuối câu, hoặc \"instead of\" khi nêu thứ bị thay. Rất hữu ích khi đề xuất phương án khác."
  - term: "however"
    ipa: "/haʊˈevər/"
    meaning_vi: "tuy nhiên"
    chunk: "However, the cost is higher."
    emoji: "↔️"
    mnemonic_vi: "Trang trọng hơn \"but\", dùng trong email và báo cáo. Đứng đầu câu và có dấu phẩy theo sau."
  - term: "because"
    ipa: "/bɪˈkɒz/"
    meaning_vi: "bởi vì"
    chunk: "We ruled it out because of the cost."
    emoji: "🔗"
    mnemonic_vi: "\"because\" đi với cả mệnh đề, \"because of\" đi với danh từ. Lẫn hai cái là lỗi ngữ pháp phổ biến."
  - term: "so"
    ipa: "/soʊ/"
    meaning_vi: "nên, vì vậy"
    chunk: "The disk was full, so it crashed."
    emoji: "➡️"
    mnemonic_vi: "Cặp nhân quả với \"because\": because nêu NGUYÊN NHÂN trước, so nêu KẾT QUẢ sau."
  - term: "if"
    ipa: "/ɪf/"
    meaning_vi: "nếu"
    chunk: "If it fails, call me."
    emoji: "🔀"
    mnemonic_vi: "Mệnh đề if KHÔNG dùng \"will\": nói \"if it fails\" chứ không phải \"if it will fail\"."
  - term: "when"
    ipa: "/wen/"
    meaning_vi: "khi nào"
    chunk: "When did it start?"
    emoji: "🕐"
    mnemonic_vi: "Khác \"if\": when là CHẮC CHẮN xảy ra, chỉ chưa biết lúc nào; if là chưa chắc có xảy ra."
  - term: "where"
    ipa: "/wer/"
    meaning_vi: "ở đâu"
    chunk: "Where is the log file?"
    emoji: "📍"
    mnemonic_vi: "Đồng âm với \"wear\" (mặc). Ba từ hay lẫn khi viết: where, were, wear."
  - term: "why"
    ipa: "/waɪ/"
    meaning_vi: "tại sao"
    chunk: "Why did it fail?"
    emoji: "❓"
    mnemonic_vi: "Câu hỏi khó trả lời nhất trong sự cố. Mẹo điều tra: hỏi why năm lần liên tiếp thì tới nguyên nhân gốc."
  - term: "how"
