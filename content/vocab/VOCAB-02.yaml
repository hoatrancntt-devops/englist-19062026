    meaning_vi: "không có gì"
    chunk: "Nothing changed since yesterday."
    emoji: "🕳️"
    mnemonic_vi: "ĐÃ mang nghĩa phủ định — không thêm \"not\". Nói \"there isn't nothing\" là sai."
  - term: "something"
    ipa: "/ˈsʌmθɪŋ/"
    meaning_vi: "một cái gì đó"
    chunk: "Something is wrong with the login."
    emoji: "❔"
    mnemonic_vi: "Cụm \"something came up\" đã học ở bài dời lịch — một việc trồi lên chắn đường."
  - term: "anyone"
    ipa: "/ˈeniwʌn/"
    meaning_vi: "bất kỳ ai"
    chunk: "Is anyone else seeing this?"
    emoji: "🙋"
    mnemonic_vi: "Câu \"is anyone else seeing this?\" là câu đầu tiên nên hỏi trong chat khi nghi có sự cố."
  - term: "everyone"
    ipa: "/ˈevriwʌn/"
    meaning_vi: "mọi người"
    chunk: "Can everyone hear me?"
    emoji: "👥"
