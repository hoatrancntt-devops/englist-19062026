code: VOCAB-03
title_vi: "100 từ việc hằng ngày"
context_vi: >-
  Danh từ và động từ bạn gặp mỗi ngày ở chỗ làm: người, đồ vật, thao tác. Hai bộ trước cho
  bạn dựng câu và mô tả; bộ này cho bạn gọi tên đúng thứ mình đang nói tới, thay vì chỉ tay
  và nói "cái này".
band: 3

words:
  - term: "person"
    ipa: "/ˈpɜːrsn/"
    meaning_vi: "người (một cá nhân)"
    chunk: "She's the right person to ask."
    emoji: "🧍"
    mnemonic_vi: "Số nhiều bất quy tắc là \"people\", không phải \"persons\". Dạng \"persons\" chỉ còn dùng trong văn bản pháp lý."
  - term: "user"
