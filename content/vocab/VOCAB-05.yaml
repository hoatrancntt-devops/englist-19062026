code: VOCAB-05
title_vi: "100 từ số lượng và so sánh"
context_vi: >-
  Số, đơn vị, mức độ, và cách so sánh hai thứ với nhau. Đây là nhóm quyết định bạn có nói
  được CON SỐ hay không — mà ở chỗ làm, gần như mọi câu đáng nghe đều có một con số trong đó.
band: 5

words:
