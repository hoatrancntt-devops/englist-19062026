code: VOCAB-06
title_vi: "100 động từ hành động"
context_vi: >-
  Động từ mô tả việc bạn làm với đồ vật và với hệ thống: mở, đóng, kéo, đẩy, gửi, nhận, thử,
  bỏ. Nhóm này ít được dạy nhưng dùng suốt — thiếu nó thì mọi câu đều phải vòng qua "do" và
  "make".
band: 6

words:
  - term: "push"
