code: VOCAB-07
title_vi: "100 từ nghề nghiệp và giấy tờ"
context_vi: >-
  Chức danh, hồ sơ, hợp đồng, đào tạo và những thủ tục quanh chuyện đi làm. Đây là nhóm bạn
  cần khi nói về SỰ NGHIỆP của mình chứ không phải công việc hôm nay — phỏng vấn, đánh giá,
  xin nghỉ, chuyển việc.
band: 7

words:
  - term: "job"
