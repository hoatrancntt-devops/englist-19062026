    emoji: "🙅"
    mnemonic_vi: "Ở phương Tây, nói thẳng \"I disagree\" trong họp là bình thường và được tôn trọng — khác văn hoá Á Đông."
  - term: "I'm afraid not"
    ipa: "/aɪm əˈfreɪd nɒt/"
    meaning_vi: "e là không được"
    chunk: "I'm afraid not, the budget is fixed."
    emoji: "😔"
    mnemonic_vi: "Ôn lại \"afraid\" nghĩa E RẰNG. Cách từ chối lịch sự nhất — nghe như bạn cũng tiếc."
  - term: "unfortunately"
