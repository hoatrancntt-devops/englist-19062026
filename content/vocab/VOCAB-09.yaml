    meaning_vi: "về lý thuyết thì"
    chunk: "In theory it should work."
    emoji: "📐"
    mnemonic_vi: "Ngụ ý thực tế có thể khác. Cặp với \"in practice\" — hai chữ này đứng cạnh nhau rất hay."
  - term: "in practice"
    ipa: "/ɪn ˈpræktɪs/"
