    chunk: "Unfortunately, we can't meet that date."
    emoji: "😞"
    mnemonic_vi: "Mở đầu tin xấu. Từ dài nhưng đáng học — nó làm cả câu nghe có thiện chí hơn."
  - term: "the thing is"
    ipa: "/ðə θɪŋ ɪz/"
    meaning_vi: "vấn đề là"
