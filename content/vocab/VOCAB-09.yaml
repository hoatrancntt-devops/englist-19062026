    chunk: "Great work getting it back so fast."
    emoji: "🌟"
    mnemonic_vi: "Khen kèm LÝ DO CỤ THỂ thì đáng giá gấp nhiều lần khen suông. Ôn lại \"keep up the good work\"."
  - term: "appreciate that"
