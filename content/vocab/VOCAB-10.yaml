code: VOCAB-10
title_vi: "100 từ tình huống thật"
context_vi: >-
  Bộ cuối: những từ và cụm bạn cần khi mọi thứ không diễn ra như kịch bản — nghe không rõ,
  hiểu nhầm, bị hỏi bất ngờ, phải xin lỗi, phải đính chính. Đây là nhóm quyết định bạn XOAY
  SỞ được hay đứng im khi hội thoại đi chệch hướng.
band: 10

